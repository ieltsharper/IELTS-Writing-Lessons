<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Unit 0 · Diagnostic Test · IELTS Harper Portal</title>
<style>
/* IELTS Harper Portal look (same tokens as the Speaking band descriptors page). */
:root{
  --page:#f7f5f2; --card:#ffffff; --line:#e7e5e4; --line-strong:#d6d3d1;
  --ink:#1c1917; --muted:#57534e; --heading:#f96c1b;
  --brand:#c2410c; --brand-hover:#9a3412; --on-brand:#ffffff; --brand-soft:#fff7ed;
  --hl:#ffedd5;
  --ok:#065f46; --ok-soft:#ecfdf5; --no:#991b1b; --no-soft:#fef2f2;
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light dark;
}
@media (prefers-color-scheme: dark){
  :root{
    --page:#171311; --card:#221c19; --line:#3a302b; --line-strong:#4f433c;
    --ink:#f5f0eb; --muted:#b8aca3; --brand-soft:#3a2416; --hl:#5a3418;
    --ok:#6ee7b7; --ok-soft:#12302a; --no:#fca5a5; --no-soft:#3b1d1d;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--page);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6}
.wrap{max-width:1000px;margin:0 auto;padding:0 20px}
a{color:var(--brand)}
button,textarea,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* top bar, as in the portal */
.topbar{background:var(--card);border-bottom:1px solid var(--line)}
.topbar .wrap{padding-top:12px;padding-bottom:12px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:inline-flex;align-items:center;gap:10px;color:var(--heading);font-weight:700;font-size:1.15rem;text-decoration:none;margin-right:auto}
.brand-mark{display:grid;place-items:center;width:36px;height:36px;border-radius:10px;background:var(--brand);color:var(--on-brand);font-size:.85rem;font-weight:800}
.topbar-link{color:var(--ink);font-weight:600;font-size:.9rem;text-decoration:none;border:1px solid var(--line);border-radius:12px;padding:6px 12px}
.topbar-link:hover{background:var(--brand-soft)}

/* masthead */
header.mast .wrap{padding-top:28px}
.hero{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px 26px}
.eyebrow{display:inline-block;font-size:.75rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--brand);background:var(--brand-soft);border-radius:999px;padding:3px 10px;margin:0 0 10px}
h1{color:var(--heading);font-weight:700;font-size:clamp(1.5rem,3.6vw,2.1rem);line-height:1.2;margin:0 0 8px}
.standfirst{margin:0;color:var(--muted)}
.standfirst.small{font-size:.9rem;font-style:italic}
.progress-all{margin-top:16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:.9rem;color:var(--muted)}
.bar{flex:1;min-width:160px;height:8px;background:var(--line);border-radius:999px;overflow:hidden}
.bar span{display:block;height:100%;background:var(--brand);width:0}

/* section tabs */
nav.tabs{position:sticky;top:0;z-index:40;background:var(--page);border-bottom:1px solid var(--line);margin-top:20px}
nav.tabs .wrap{display:flex;gap:6px;overflow-x:auto;padding-top:10px;padding-bottom:10px}
nav.tabs a{border:1px solid transparent;border-radius:12px;padding:8px 14px;white-space:nowrap;color:var(--muted);font-size:.93rem;font-weight:600;text-decoration:none}
nav.tabs a:hover{background:var(--brand-soft);color:var(--ink)}
nav.tabs a[aria-current="page"]{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
main{padding:28px 0 80px}
h2{color:var(--heading);font-weight:700;font-size:1.45rem;margin:0 0 6px}
h3{font-weight:700;font-size:1.12rem;margin:30px 0 10px}
h4{font-weight:700;font-size:1rem;margin:0 0 8px}
.lede{color:var(--muted);margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin-bottom:14px}
.card p{margin:0 0 8px}.card p:last-child{margin-bottom:0}
ul.plain{margin:4px 0 12px;padding-left:22px}
ul.plain li{margin-bottom:6px}

/* unit sub-navigation and level filter */
.subnav{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 12px;margin:14px 0 18px}
.chip{border:1px solid var(--line-strong);background:var(--card);border-radius:999px;padding:6px 14px;cursor:pointer;font-size:.88rem;font-weight:600;color:var(--muted)}
.chip:hover{background:var(--brand-soft);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.chip small{font-weight:500;opacity:.85}
.sep{width:1px;height:22px;background:var(--line);margin:0 4px}
.filter-label{font-size:.82rem;color:var(--muted);margin-left:auto}
.lv{color:var(--brand);letter-spacing:1px;font-size:.8rem;white-space:nowrap}

/* tables */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--card);margin-bottom:14px}
table{border-collapse:collapse;width:100%;font-size:.94rem}
th,td{text-align:left;vertical-align:top;padding:9px 12px;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
th{background:var(--brand);color:var(--on-brand);font-weight:700;font-size:.85rem}
td.phrase{font-weight:700;white-space:nowrap}
td.muted{color:var(--muted)}
.speak{border:1px solid var(--line-strong);background:var(--card);border-radius:999px;width:28px;height:28px;cursor:pointer;font-size:.8rem;vertical-align:middle;margin-left:6px;padding:0;line-height:1}
.speak:hover{background:var(--brand-soft)}
.speak.on{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}

/* boxes */
.boxes{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.box h4{color:var(--brand)}
.mistake{border-top:1px solid var(--line);padding-top:10px;margin-top:10px}
.mistake:first-of-type{border-top:0;margin-top:0;padding-top:0}
.bad{color:var(--no)}.good{color:var(--ok)}
.bad::before{content:"✗ ";font-weight:700}.good::before{content:"✓ ";font-weight:700}
.note{color:var(--muted);font-size:.92rem}
.sample{margin-bottom:10px}
.sample .q{font-weight:700}
.formula{background:var(--brand-soft);border-left:4px solid var(--brand);border-radius:8px;padding:10px 14px;margin:0 0 12px}

/* exercise items */
.item{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin-bottom:12px}
.item.done{border-color:var(--ok)}
.item-head{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.num{display:inline-grid;place-items:center;min-width:28px;height:28px;border-radius:8px;background:var(--brand-soft);color:var(--brand);font-weight:800;font-size:.85rem}
.cue{font-weight:700;font-size:1.05rem;flex:1;min-width:200px}
.examiner{color:var(--muted);font-weight:600;font-size:.85rem;margin-right:4px}
.lines{margin:8px 0 0 38px;font-size:.95rem}
.lines div{margin-bottom:3px}
.label{display:inline-block;min-width:78px;color:var(--muted);font-size:.85rem;font-weight:600}
.hint{color:var(--muted);font-style:italic}
.work{margin:12px 0 0 38px}
textarea{width:100%;min-height:58px;resize:vertical;border:1px solid var(--line-strong);border-radius:10px;padding:8px 10px;background:var(--page)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;align-items:center}
.btn{border:1px solid var(--line-strong);background:var(--card);border-radius:10px;padding:6px 12px;cursor:pointer;font-size:.88rem;font-weight:600}
.btn:hover{background:var(--brand-soft)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.primary:hover{background:var(--brand-hover)}
.btn[aria-pressed="true"]{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.answer{margin-top:10px;border-top:1px dashed var(--line-strong);padding-top:10px}
.answer .main{font-weight:600}
.answer .alt{margin-top:6px}
.empty{color:var(--muted);font-style:italic}

/* question bank */
.search{width:100%;max-width:420px;border:1px solid var(--line-strong);border-radius:12px;padding:8px 12px;background:var(--card);margin-bottom:14px}

footer{color:var(--muted);font-size:.85rem;padding:20px 0 40px;border-top:1px solid var(--line)}
@media (max-width:600px){.lines,.work{margin-left:0}.filter-label{margin-left:0;width:100%}}
@media print{
  .topbar,nav.tabs,.subnav,.actions,.speak,textarea,.progress-all,footer{display:none!important}
  section[hidden]{display:block!important}
  .answer[hidden]{display:block!important}
  body{background:#fff}
  .item,.card{break-inside:avoid}
}
.btn:disabled{opacity:.5;cursor:not-allowed}
.opts{display:grid;gap:6px;margin:10px 0 0 38px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer;background:var(--page)}
.opt:hover{background:var(--brand-soft)}
.opt input{margin-top:5px;accent-color:var(--brand)}
.opt b{min-width:1.2em}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--no);background:var(--no-soft)}
.verdict{font-weight:700;margin-bottom:4px}
.verdict.ok{color:var(--ok)}.verdict.no{color:var(--no)}
.mine{background:var(--page);border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-bottom:8px;white-space:pre-wrap}
.part-title{font-size:.78rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:22px 0 8px}
.read-cue{font-size:1.08rem}
.send-box{margin:0 0 14px}
.send-box:empty{display:none}
.send-msg{margin:0;padding:10px 14px;border:1px dashed var(--line-strong);border-radius:12px;background:var(--card);font-size:.92rem;color:var(--muted)}
.send-msg .btn{margin-left:6px}
.teacher-note{border-left:4px solid var(--brand);background:var(--brand-soft);border-radius:10px;padding:10px 14px;margin-bottom:8px;white-space:pre-wrap}
.teacher-note b{color:var(--brand);display:block;margin-bottom:2px}
.fb{border:1px solid var(--line);border-left:4px solid var(--brand);border-radius:10px;padding:10px 14px;margin:0 0 10px;background:var(--card)}
.fb.great{border-left-color:var(--ok)}.fb.needs_work{border-left-color:var(--no)}
.fb-head{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;margin-bottom:4px}
.fb-head b{color:var(--ink)}
.fb-tag{font-size:.75rem;font-weight:700;border-radius:999px;padding:1px 9px;background:var(--brand-soft);color:var(--brand)}
.fb.great .fb-tag{background:var(--ok-soft);color:var(--ok)}.fb.needs_work .fb-tag{background:var(--no-soft);color:var(--no)}
.fb ul{margin:6px 0 0;padding-left:20px}.fb li{margin-bottom:3px}
.fb .wrong{color:var(--no);text-decoration:line-through}.fb .right{color:var(--ok);font-weight:600}
.fb-small{font-size:.8rem;color:var(--muted);margin-top:6px}
/* Writing: criterion colours (TR red, CC orange, LR blue, GRA purple), corrections, exam prompts */
.tag{display:inline-block;font-size:.72rem;font-weight:800;border-radius:6px;padding:0 6px;color:#1c1917;font-style:normal}
.tag.TR{background:#F4CCCC}.tag.CC{background:#FCE5CD}.tag.LR{background:#CFE2F3}.tag.GRA{background:#D9D2E9}
s{color:var(--no)}
.prompt{margin:8px 0 0 38px;border-left:3px solid var(--line-strong);padding:4px 12px;color:var(--ink);font-size:.95rem}
.ref{font-size:.75rem;font-weight:700;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:0 8px;margin-left:6px}
.wc{font-size:.8rem;color:var(--muted)}
@media (max-width:600px){.prompt{margin-left:0}}
</style>
</head>

ào gồm <b>40 câu<\/b> chia thành bốn phần, kiểm tra cả bốn tiêu chí chấm: Task Response, Coherence and Cohesion, Lexical Resource và Grammatical Range and Accuracy. Hãy làm bài trong khoảng <b>60 phút<\/b>, không dùng tài liệu."}, {"type": "p", "html": "Sau khi làm xong, đối chiếu với phần Đáp án. Mỗi câu đúng được <b>1 điểm<\/b>. Ở Phần 2, chỉ chấm câu <i>Viết lại<\/i>; bản dịch không tính điểm. Với các câu viết, câu được tính là đúng nếu giữ đúng nghĩa, dùng đúng cấu trúc được yêu cầu và không có lỗi ngữ pháp hoặc từ vựng. Trong phần Đáp án, mỗi câu đều ghi rõ <b>Unit<\/b> kiểm tra kỹ năng đó."}, {"type": "p", "html": "Dùng hai bảng ở cuối bài để biết bạn nên bắt đầu từ Unit nào."}], "theory": [], "exercises": [{"title": "Part 1 — Paraphrasing the prompt", "intro": ["<i>Paraphrase the statement part of each prompt (not the question) in one sentence. Keep the same scope: who, what, to what extent.<\/i>"], "items": [{"level": 1, "n": 0, "cue": "Socio-cultural and global issues · Agree/disagree", "prompt": "<i>Some people believe that we should return to older and more traditional values in order to create a better world. To what extent do you agree or disagree?<\/i>", "hint": "<i>It is argued by some that …<\/i> + synonyms", "ref": "Unit 2", "answer": "It is argued by some that returning to traditional values would help to create a better world.", "kind": "write"}, {"level": 1, "n": 1, "cue": "Language · Agree/disagree", "prompt": "<i>Some people believe that not all children have a natural ability to learn a foreign language and that it is therefore wrong to make every child study one at school. To what extent do you agree or disagree?<\/i>", "hint": "Change the subject: <i>Not every child …<\/i>", "ref": "Unit 1", "answer": "Some people believe that not every child is naturally able to learn a foreign language, so it is unfair to make the subject compulsory.", "kind": "write"}, {"level": 1, "n": 2, "cue": "Work · Agree/disagree", "prompt": "<i>Countries where people work long hours are often economically successful, but long working hours can also have negative social consequences. To what extent do you agree or disagree?<\/i>", "hint": "Start with <i>Although …<\/i>", "ref": "Unit 1", "answer": "Although long working hours may bring economic success, they can also cause social problems.", "kind": "write"}, {"level": 1, "n": 3, "cue": "Climate · Agree/disagree", "prompt": "<i>Some people believe that instead of trying to prevent climate change, we should learn how to live with it. To what extent do you agree or disagree?<\/i>", "hint": "<i>rather than<\/i> + V", "ref": "Unit 1", "answer": "Some argue that we should adapt to climate change rather than try to prevent it.", "kind": "write"}, {"level": 2, "n": 4, "cue": "Education · Discuss both views", "prompt": "<i>In developing countries, children in rural areas often have less access to education. Some people believe the best solution is to provide more schools and teachers, while others think computers and Internet access are more important. Discuss both views and give your own opinion.<\/i>", "hint": "<i>While one school of thought holds that …, others maintain that …<\/i>", "ref": "Unit 2", "answer": "While one school of thought holds that rural children need more schools and teachers, others maintain that computers and Internet access matter more.", "kind": "write"}, {"level": 2, "n": 5, "cue": "Art and museums · Discuss both views", "prompt": "<i>Some people believe that museums should be free to enter, while others think visitors should pay an admission fee. Discuss both views and give your own opinion.<\/i>", "hint": "<i>Some people argue that …, while others believe that …<\/i>", "ref": "Unit 2", "answer": "Some people argue that museums should be free, while others believe that visitors should pay to enter.", "kind": "write"}, {"level": 2, "n": 6, "cue": "Age, generation and gender · Causes/problems/solutions", "prompt": "<i>In many countries, older people are not treated with enough respect. Why is this happening, and what problems can it cause?<\/i>", "hint": "<i>It is true that …<\/i>", "ref": "Unit 2", "answer": "It is true that older people are not given enough respect in many countries.", "kind": "write"}, {"level": 3, "n": 7, "cue": "Education · Advantages/disadvantages", "prompt": "<i>In some countries, university students move away from home to study in another city. Do the disadvantages of living away from home outweigh the advantages?<\/i>", "hint": "Choose your own technique. Paraphrase the statement in one sentence.", "ref": "Unit 5", "answer": "In some countries, students leave their family homes to attend university in another city.", "kind": "write"}, {"level": 3, "n": 8, "cue": "Age, generation and gender · Positive/negative development", "prompt": "<i>More and more people are becoming interested in finding out about their family history. Why is this happening, and is this a positive or negative development?<\/i>", "hint": "Choose your own technique. Paraphrase the statement in one sentence.", "ref": "Unit 2", "answer": "Tracing one's family history has gained increasing popularity in recent years.", "kind": "write"}, {"level": 3, "n": 9, "cue": "Age, generation and gender · Two-part question", "prompt": "<i>Some people believe that the characteristics we are born with have a greater influence on our personality and development than the experiences we have in life. Which of these do you think has the greater influence?<\/i>", "hint": "Choose your own technique. Paraphrase the statement in one sentence.", "ref": "Unit 2", "answer": "Some people believe that the traits we are born with shape our personality and development more than our life experiences do.", "kind": "write"}]}, {"title": "Part 2 — Translate, then rewrite", "intro": ["<i>Translate each sentence into natural English. Then rewrite your translation using the given structure. ● sentences give keywords; ●● and ●●● sentences give only the structure.<\/i>"], "items": [{"level": 1, "n": 0, "cue": "Đối với nhiều người lao động, việc cân bằng giữa công việc và gia đình là rất khó.", "kind": "translate", "rewriteWith": "<b>For sb, it is … to V<\/b>", "ref": "Unit 6", "translation": "Balancing work and family is very hard for many workers.", "answer": "<b>For many workers, it is very difficult to balance work and family life.<\/b>", "alt": "For many employees, balancing work and family life is extremely difficult."}, {"level": 1, "n": 1, "cue": "Khi ngày càng nhiều người mua sắm trực tuyến, nhiều cửa hàng nhỏ đang đóng cửa.", "kind": "translate", "rewriteWith": "<b>With + N + V-ing<\/b>", "ref": "Unit 7", "translation": "As more and more people shop online, many small shops are closing.", "answer": "<b>With more and more people shopping online, many small shops are closing.<\/b>", "alt": "With online shopping becoming increasingly popular, many small shops are closing down."}, {"level": 1, "n": 2, "cue": "Chính phủ nên đầu tư vào giáo dục để người trẻ có thể tìm được việc làm tốt hơn.", "kind": "translate", "rewriteWith": "<b>so that<\/b>", "ref": "Unit 8", "translation": "The government should invest in education to help young people find better jobs.", "answer": "<b>The government should invest in education so that young people can find better jobs.<\/b>", "alt": "Governments should put more resources into education so that young people can secure better jobs."}, {"level": 1, "n": 3, "cue": "Áp lực thi cử ngăn cản nhiều học sinh tận hưởng việc học.", "kind": "translate", "rewriteWith": "<b>prevent sb from<\/b>", "ref": "Unit 9", "translation": "Exam pressure makes many students unable to enjoy studying.", "answer": "<b>Exam pressure prevents many students from enjoying learning.<\/b>", "alt": "The pressure of exams stops many students from enjoying their studies."}, {"level": 2, "n": 4, "cue": "Mạng xã hội có thể khiến một số thanh thiếu niên cảm thấy lo âu.", "kind": "translate", "rewriteWith": "<b>may + some (suitable degree)<\/b>", "ref": "Unit 10", "translation": "Social media can make some teenagers feel worried.", "answer": "<b>Social media may make some teenagers feel anxious.<\/b>", "alt": "Some teenagers may feel anxious as a result of using social media."}, {"level": 2, "n": 5, "cue": "Trong những thập kỷ qua, du lịch quốc tế đã tăng nhanh chóng.", "kind": "translate", "rewriteWith": "<b>Over the past few decades + present perfect<\/b>", "ref": "Unit 11", "translation": "International tourism has increased quickly in recent decades.", "answer": "<b>Over the past few decades, international tourism has grown rapidly.<\/b>", "alt": "Over the past few decades, the number of international tourists has risen sharply."}, {"level": 2, "n": 6, "cue": "Thu nhập thấp đồng nghĩa với ít lựa chọn hơn về nhà ở.", "kind": "translate", "rewriteWith": "<b>one-verb sentence (noun phrase + mean + noun phrase)<\/b>", "ref": "Unit 12", "translation": "If people have low incomes, they have fewer housing choices.", "answer": "<b>Low incomes mean fewer housing options.<\/b>", "alt": "Low incomes mean fewer choices when it comes to housing."}, {"level": 3, "n": 7, "cue": "Trường có nhiều giáo viên trẻ, phần lớn trong số họ chưa có nhiều kinh nghiệm.", "kind": "translate", "rewriteWith": "<b>most of whom<\/b>", "ref": "Unit 13", "translation": "The school has many young teachers, and most of them do not have much experience.", "answer": "<b>The school has many young teachers, most of whom have little experience.<\/b>", "alt": "The school employs many young teachers, most of whom are inexperienced."}, {"level": 3, "n": 8, "cue": "Nếu chính phủ đánh thuế cao hơn đối với thuốc lá, ít người trẻ sẽ hút thuốc hơn.", "kind": "translate", "rewriteWith": "<b>second conditional<\/b>", "ref": "Unit 15", "translation": "If the government taxes cigarettes more, fewer young people will smoke.", "answer": "<b>If the government taxed cigarettes more heavily, fewer young people would smoke.<\/b>", "alt": "If cigarettes were taxed more heavily, fewer young people would smoke."}, {"level": 3, "n": 9, "cue": "Mặc dù xe điện thân thiện với môi trường, chúng vẫn còn quá đắt với nhiều gia đình.", "kind": "translate", "rewriteWith": "<b>Although<\/b>", "ref": "Unit 20", "translation": "Electric cars are environmentally friendly, but they are still too expensive for many families.", "answer": "<b>Although electric cars are environmentally friendly, they are still too expensive for many families.<\/b>", "alt": "Although they are kind to the environment, electric cars remain too expensive for many families."}]}, {"title": "Part 3 — Find and correct the errors", "intro": ["<i>Some sentences are correct; others have one or more errors. (a) Name the criterion for each error (TR, CC, LR or GRA). (b) Write the correction. (c) Tick ✓ if the sentence is correct.<\/i>"], "items": [{"level": 1, "n": 0, "kind": "fix", "cue": "Video games make all children violent.", "ref": "Unit 22", "answer": "Video games <s>make all children violent<\/s><b> MAY MAKE SOME CHILDREN MORE AGGRESSIVE<\/b>.", "notes": ["<span class=\"tag TR\">TR<\/span> Tuyệt đối hóa (<i>all<\/i>) và quá mạnh (<i>make … violent<\/i>)."]}, {"level": 1, "n": 1, "kind": "fix", "cue": "Learning English is important because English is an important language.", "ref": "Unit 22", "answer": "Learning English is important <s>because English is an important language<\/s><b> BECAUSE IT OPENS UP INTERNATIONAL JOB OPPORTUNITIES<\/b>.", "notes": ["<span class=\"tag TR\">TR<\/span> Lặp ý: lý do nhắc lại chính nhận định."]}, {"level": 1, "n": 2, "kind": "fix", "cue": "Many people who work from home are more productive, especially those with long commutes.", "ref": "Unit 22", "answer": "<b>✓ <\/b>Many people who work from home are more productive, especially those with long commutes.", "notes": ["Đúng: phạm vi hợp lý, có nhóm cụ thể."]}, {"level": 1, "n": 3, "kind": "fix", "cue": "Technology saves time. Even more, it reduces costs.", "ref": "Unit 23", "answer": "Technology saves time. <s>Even more,<\/s><b> MOREOVER,<\/b> it reduces costs.", "notes": ["<span class=\"tag CC\">CC<\/span> <i>Even more<\/i> không phải là từ nối."]}, {"level": 2, "n": 4, "kind": "fix", "cue": "Governments should regulate apps for children. If this works, they can protect children.", "ref": "Unit 23", "answer": "Governments should regulate apps for children. If this works, <s>they can protect children<\/s><b> SUCH RULES CAN PROTECT CHILDREN<\/b>.", "notes": ["<span class=\"tag CC\">CC<\/span> <i>If this works<\/i> mơ hồ (<i>this<\/i> chỉ điều gì?) và <i>they<\/i> dễ hiểu nhầm; dùng danh từ tóm tắt <i>such rules<\/i>."]}, {"level": 2, "n": 5, "kind": "fix", "cue": "The advantages of tourism overwhelm the disadvantages.", "ref": "Unit 24", "answer": "The advantages of tourism <s>overwhelm<\/s><b> OUTWEIGH<\/b> the disadvantages.", "notes": ["<span class=\"tag LR\">LR<\/span> So sánh lợi – hại dùng <i>outweigh<\/i>."]}, {"level": 2, "n": 6, "kind": "fix", "cue": "Children should learn foreign languages in an early age.", "ref": "Unit 24", "answer": "Children should learn foreign languages <s>in an early age<\/s><b> AT AN EARLY AGE<\/b>.", "notes": ["<span class=\"tag LR\">LR<\/span> Cụm cố định: <i>at an early age<\/i>."]}, {"level": 3, "n": 7, "kind": "fix", "cue": "Organising international events bring many benefits.", "ref": "Unit 25", "answer": "Organising international events <s>bring<\/s><b> BRINGS<\/b> many benefits.", "notes": ["<span class=\"tag GRA\">GRA<\/span> Chủ ngữ V-ing → động từ số ít."]}, {"level": 3, "n": 8, "kind": "fix", "cue": "Many families are unable to save any money.", "ref": "Unit 25", "answer": "<b>✓ <\/b>Many families are unable to save any money.", "notes": ["Đúng: cấu trúc <i>be unable to<\/i> + V."]}, {"level": 3, "n": 9, "kind": "fix", "cue": "Many people use their phones in bed, it affects their sleep.", "ref": "Unit 25", "answer": "Many people use their phones in bed<s>, it affects<\/s><b>, WHICH AFFECTS<\/b> their sleep.", "notes": ["<span class=\"tag GRA\">GRA<\/span> Lỗi nối câu bằng dấu phẩy; dùng <i>which<\/i>."]}]}, {"title": "Part 4 — Structure transformation", "intro": ["<i>Rewrite each sentence using the given structure. Keep the same meaning.<\/i>"], "items": [{"level": 1, "n": 0, "cue": "Some teachers work in rural schools. They often lack resources.", "hint": "relative clause with <i>who<\/i>", "ref": "Unit 13", "answer": "Teachers who work in rural schools often lack resources.", "alt": "Teachers who work in rural areas often lack teaching resources.", "kind": "write"}, {"level": 1, "n": 1, "cue": "Many elderly people live alone. They often feel isolated.", "hint": "opening V-ing participle clause", "ref": "Unit 14", "answer": "Living alone, many elderly people often feel isolated.", "alt": "Living on their own, many older people often feel isolated.", "kind": "write"}, {"level": 1, "n": 2, "cue": "Politicians seldom admit their mistakes.", "hint": "inversion with <i>Seldom<\/i>", "ref": "Unit 16", "answer": "Seldom do politicians admit their mistakes.", "alt": "Seldom do politicians acknowledge their mistakes.", "kind": "write"}, {"level": 1, "n": 3, "cue": "If the city had planted more trees, the streets would be cooler now.", "hint": "inverted conditional <i>Had …<\/i>", "ref": "Unit 17", "answer": "Had the city planted more trees, the streets would be cooler now.", "alt": "Had more trees been planted in the city, the streets would be cooler now.", "kind": "write"}, {"level": 2, "n": 4, "cue": "Children need attention from their parents most.", "hint": "<i>What … is<\/i>", "ref": "Unit 18", "answer": "What children need most is attention from their parents.", "alt": "What children need most is their parents' attention.", "kind": "write"}, {"level": 2, "n": 5, "cue": "People say that tourism damages local culture.", "hint": "<i>S + is said to<\/i>", "ref": "Unit 19", "answer": "Tourism is said to damage local culture.", "alt": "Tourism is said to harm local culture.", "kind": "write"}, {"level": 2, "n": 6, "cue": "Prices are rising, which means that families are spending less.", "hint": "one-verb sentence", "ref": "Unit 12", "answer": "Rising prices mean lower family spending.", "alt": "Rising prices mean less spending by families.", "kind": "write"}, {"level": 3, "n": 7, "cue": "Many young people cannot buy a home. The main reason is that prices have risen faster than wages.", "hint": "<i>(Much of) this comes down to the fact that<\/i>", "ref": "Unit 7", "answer": "Many young people cannot buy a home. Much of this comes down to the fact that house prices have risen faster than wages.", "alt": "Many young people cannot afford a home. Much of this comes down to the fact that property prices have outpaced wages.", "kind": "write"}, {"level": 3, "n": 8, "cue": "Cities are building bus lanes. This reduces journey times for commuters.", "hint": ", thereby + V-ing", "ref": "Unit 8", "answer": "Cities are building bus lanes, thereby reducing journey times for commuters.", "alt": "Cities are building bus lanes, thereby cutting commuters' journey times.", "kind": "write"}, {"level": 3, "n": 9, "cue": "Topic: a benefit of learning to cook (saves money).", "hint": "topic sentence <i>One major benefit of … is that<\/i>", "ref": "Unit 21", "answer": "One major benefit of learning to cook is that it saves money.", "alt": "One major benefit of learning to cook is that it reduces food spending.", "kind": "write"}]}], "after": [{"type": "sub", "text": "Bảng 1 — Câu sai → Unit cần học"}, {"type": "table", "head": ["Phần", "Câu", "Kỹ năng", "Unit"], "rows": [{"level": 0, "cells": ["1", "1–10", "Paraphrase đề bài, khung câu mở bài", "Unit 1, 2, 5"]}, {"level": 0, "cells": ["2", "1–4", "Cách mở đầu câu; nguyên nhân; mục đích; phủ định", "Unit 6, 7, 8, 9"]}, {"level": 0, "cells": ["2", "5–7", "Mức độ chắc chắn; thời gian; viết gọn", "Unit 10, 11, 12"]}, {"level": 0, "cells": ["2", "8–10", "Mệnh đề quan hệ; câu điều kiện; tương phản", "Unit 13, 15, 20"]}, {"level": 0, "cells": ["3", "1–3", "Lỗi lập luận (TR)", "Unit 22"]}, {"level": 0, "cells": ["3", "4–5", "Lỗi mạch lạc và liên kết (CC)", "Unit 23"]}, {"level": 0, "cells": ["3", "6–7", "Lỗi từ vựng (LR)", "Unit 24"]}, {"level": 0, "cells": ["3", "8–10", "Lỗi ngữ pháp (GRA)", "Unit 25"]}, {"level": 0, "cells": ["4", "1–6", "Cấu trúc nâng cao", "Unit 13, 14, 16, 17, 18, 19"]}, {"level": 0, "cells": ["4", "7–10", "Viết gọn; nguyên nhân; kết quả; câu chủ đề", "Unit 12, 7, 8, 21"]}]}, {"type": "sub", "text": "Bảng 2 — Tổng điểm → lộ trình gợi ý"}, {"type": "p", "html": "Mức điểm chỉ mang tính tham khảo cho câu văn, không phải điểm IELTS chính thức."}, {"type": "table", "head": ["Tổng điểm", "Mức hiện tại (tham khảo)", "Lộ trình gợi ý"], "rows": [{"level": 0, "cells": ["0–15", "khoảng 5.0–5.5", "Học tuần tự từ Unit 1. Ưu tiên Phần A và B, làm kỹ các câu ● và ●●."]}, {"level": 0, "cells": ["16–28", "khoảng 5.5–6.5", "Học các Unit ứng với những câu bạn làm sai (Bảng 1), sau đó làm Phần E (Unit 22–25)."]}, {"level": 0, "cells": ["29–36", "khoảng 6.5–7.0", "Tập trung vào Phần C (Unit 13–20) và Phần E; ưu tiên các câu ●●●."]}, {"level": 0, "cells": ["37–40", "7.0 trở lên", "Làm các câu ●●● trong mọi Unit, sau đó làm Bài ôn tập tổng hợp."]}]}]}], "parts": [], "guide": [], "index": []}</script>
<script type="application/json" id="audio">{}</script>
<script>
(function(){
'use strict';
var D = JSON.parse(document.getElementById('data').textContent);
var STORE = 'wt2-0';
var state = load();
function blank(){ return {draft:{}, sub:{}, choice:{}, seen:{}, sent:{}, dirty:{}, fb:{}}; }
function load(){ try { var s = JSON.parse(localStorage.getItem(STORE)); return s && s.sub ? s : blank(); } catch(e){ return blank(); } }
function save(){ try { localStorage.setItem(STORE, JSON.stringify(state)); } catch(e){} }

var $ = function(s, r){ return (r||document).querySelector(s); };
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function dots(n){ return n ? '<span class="lv" title="Level ' + n + '">' + '●'.repeat(n) + '</span>' : ''; }
function textOf(html){ var t = document.createElement('div'); t.innerHTML = html; return t.textContent; }

/* ---------- recorded audio for the English examples (audio/<id>.mp3, made by make_audio.py) ---------- */
var AUDIO = JSON.parse(document.getElementById('audio').textContent);
var player = new Audio(), playing = null;
function speakBtn(text){
  var id = AUDIO[text];
  if (!id) return '';
  return '<button type="button" class="speak" data-audio="' + id + '" aria-label="Listen: ' + esc(text) + '" title="Listen">🔊</button>';
}
function stopAudio(){ player.pause(); if (playing) playing.classList.remove('on'); playing = null; }
player.addEventListener('ended', stopAudio);
document.addEventListener('click', function(e){
  var b = e.target.closest('[data-audio]'); if (!b) return;
  var again = playing === b;
  stopAudio();
  if (again) return;
  player.src = 'audio/' + b.getAttribute('data-audio') + '.mp3';
  playing = b; b.classList.add('on');
  player.play().catch(stopAudio);
});

/* ---------- progress ---------- */
function ids(u){ var out = []; u.exercises.forEach(function(ex, k){ ex.items.forEach(function(it){ out.push(u.num + '-' + (k + 1) + '-' + it.n); }); }); return out; }
function isDone(id){ return !!(state.sub[id] || state.choice[id] || state.seen[id]); }
var ALL = [].concat.apply([], D.units.map(ids));
function updateProgress(){
  var n = ALL.filter(isDone).length;
  $('#progressText').textContent = 'Done: ' + n + '/' + ALL.length + ' items';
  $('#progressBar').style.width = (100 * n / ALL.length) + '%';
}
$('#reset').addEventListener('click', function(){
  if (!confirm('Clear everything you wrote, submitted and chose in this browser?')) return;
  state = blank(); save(); render();
});

/* ---------- header and tabs ---------- */
// One page per unit; D.nav lists every page (index + units) for the tab bar.
$('#title').textContent = D.cover[0];
$('#cover').innerHTML = D.cover.slice(1).map(function(c, i, a){
  return '<p class="standfirst' + (i === a.length - 1 ? ' small' : '') + '">' + esc(c) + '</p>';
}).join('');
$('#tabs').innerHTML = D.nav.map(function(t){ return '<a href="' + t.href + '"' + (t.current ? ' aria-current="page"' : '') + '>' + esc(t.label) + '</a>'; }).join('');
function unitTitle(u){ return u.num === 'review' ? u.name : 'Unit ' + u.num + ' · ' + u.name; }

function route(){
  return {tab: {unit: D.units[0]}, part: location.hash.replace('#', '') || 'ly-thuyet'};
}
var filter = 0;

/* ---------- index page: all units with progress, then the guide ---------- */
function renderBlocks(list){
  var s = '', card = '', open = false;
  function flush(){ if (open) { card += '</ul>'; open = false; } if (card) s += '<div class="card">' + card + '</div>'; card = ''; }
  list.forEach(function(b){
    if (b.type === 'h1') { flush(); s += '<h2 style="margin-top:28px">' + esc(b.text) + '</h2>'; }
    else if (b.type === 'h') { flush(); card = '<h4>' + b.html + '</h4>'; }
    else if (b.type === 'li') { if (!open) { card += '<ul class="plain">'; open = true; } card += '<li>' + b.html + '</li>'; }
    else if (b.type === 'table') { flush(); s += renderTable(b); }
    else { if (open) { card += '</ul>'; open = false; } card += '<p>' + b.html + '</p>'; }
  });
  flush();
  return s;
}
function renderIndex(){
  var s = '<h2>Units</h2>';
  D.parts.forEach(function(p){
    s += '<p class="part-title">' + esc(p.title) + '</p><div class="boxes">' + p.units.map(function(n){
      var u = D.index.find(function(x){ return x.num === n; }), done = 0;
      try { var st = JSON.parse(localStorage.getItem(u.store)) || {}; done = Object.keys(Object.assign({}, st.sub, st.choice)).length; } catch(e){}
      return '<a class="card" style="text-decoration:none;color:inherit;display:block;margin:0" href="' + u.href + '"><h4 style="color:var(--heading)">' + esc(unitTitle(u)) + '</h4><span class="note">Done: ' + Math.min(done, u.count) + '/' + u.count + '</span></a>';
    }).join('') + '</div>';
  });
  return s + renderBlocks(D.guide);
}

/* ---------- theory ---------- */
function renderTable(b){
  var vocab = b.head[0] === 'Cụm từ' || b.head[0] === 'Phrase', speakLast = vocab || /câu trả lời mở rộng|extended answer/i.test(b.head[b.head.length - 1]);
  var rows = b.rows.filter(function(r){ return !filter || !r.level || r.level === filter; });
  return '<div class="tablewrap"><table><thead><tr>' + b.head.map(function(h){ return '<th scope="col">' + esc(h) + '</th>'; }).join('') + '</tr></thead><tbody>' +
    rows.map(function(r){
      return '<tr>' + r.cells.map(function(c, i){
        if (i === 0 && vocab) return '<td class="phrase">' + dots(r.level) + ' ' + c + '</td>';
        if (i === r.cells.length - 1 && speakLast) return '<td>' + c + speakBtn(textOf(c)) + '</td>';
        return '<td' + (vocab && i === 1 ? ' class="muted"' : '') + '>' + c + '</td>';
      }).join('') + '</tr>';
    }).join('') + '</tbody></table></div>';
}
function sampleSpeech(html){
  var t = textOf(html), i = t.indexOf(' → ');
  if (i >= 0) t = t.slice(i + 3);
  return t.replace(/\s*\([^)]*\)\s*$/, '').replace(/\s*\/[^\/\s]+\/\s*/g, ' ');
}
function renderTheory(u){
  var s = '', boxes = [];
  u.theory.concat(u.intro, u.after).forEach(function(b){
    if (b.type === 'sub') s += '<h3>' + esc(b.text) + '</h3>';
    else if (b.type === 'p') s += '<p>' + b.html + '</p>';
    else if (b.type === 'table') s += renderTable(b);
    else if (b.type === 'samples') s += '<div class="card">' + b.items.map(function(x){ return '<div class="sample">' + x + speakBtn(sampleSpeech(x)) + '</div>'; }).join('') + '</div>';
    else if (b.type === 'mistakes') boxes.push('<div class="card box"><h4>Lỗi cần tránh</h4>' + b.items.map(function(m){

  var tmp = document.createElement('div');
  var item = findItem(id);
  tmp.innerHTML = renderItem(item, id, D.units.find(function(x){ return String(x.num) === p[0]; }).exercises[+p[1] - 1].items.indexOf(item));
  old.replaceWith(tmp.firstChild);
  updateProgress();
  var chip = document.querySelector('.subnav a[aria-pressed="true"] small');
  if (chip) { var ex = D.units.find(function(x){ return String(x.num) === p[0]; }).exercises[+p[1] - 1];
    chip.textContent = ex.items.filter(function(it){ return isDone(p[0] + '-' + p[1] + '-' + it.n); }).length + '/' + ex.items.length; }
}

/* ---------- events ---------- */
var lastTab = route().tab.id;
window.addEventListener('hashchange', function(){
  render();
  var t = route().tab.id;
  window.scrollTo(0, t === lastTab ? Math.min(window.scrollY, $('nav.tabs').offsetTop) : 0);
  lastTab = t;
});
$('#main').addEventListener('click', function(e){
  var b, id;
  if ((b = e.target.closest('[data-filter]'))) { filter = +b.getAttribute('data-filter'); var y = window.scrollY; render(); window.scrollTo(0, y); return; }
  if ((b = e.target.closest('[data-submit]'))) {
    id = b.getAttribute('data-submit');
    var t = document.getElementById('t-' + id).value.trim(), tt = document.getElementById('t-' + id + '~t');
    if (!t || (tt && !tt.value.trim())) return;
    if (tt) { t = 'Translation: ' + tt.value.trim() + '\nRewrite: ' + t; delete state.draft[id + '~t']; }
    var changed = state.sub[id] !== t;
    state.sub[id] = t; delete state.draft[id]; save(); rerenderItem(id);
    var a = document.getElementById('a-' + id); if (a) a.scrollIntoView({block: 'nearest'});
    var f = (state.fb || {})[id];
    if (!f || f.for !== t || f.kind !== 'ai') assess(findItem(id), id);
    if (changed) afterAnswer(id);
    return;
  }
  if ((b = e.target.closest('[data-choose]'))) {
    id = b.getAttribute('data-choose');
    var r = document.querySelector('input[name="c-' + id + '"]:checked');
    if (!r) return;
    var changedChoice = state.choice[id] !== r.value;
    state.choice[id] = r.value; save(); rerenderItem(id);
    if (changedChoice) afterAnswer(id);
    return;
  }
  if ((b = e.target.closest('[data-send]'))) { sendExercise(b.getAttribute('data-send')); return; }
  if ((b = e.target.closest('[data-see]'))) {
    id = b.getAttribute('data-see');
    if (state.seen[id]) delete state.seen[id]; else state.seen[id] = 1;
    save(); rerenderItem(id);
  }
});
$('#main').addEventListener('change', function(e){
  var t = e.target;
  if (t.matches('input[type="radio"]')) {
    var id = t.name.slice(2), btn = document.querySelector('[data-choose="' + id + '"]');
    if (btn) btn.disabled = false;
  }
});
$('#main').addEventListener('input', function(e){
  var t = e.target;
  if (t.matches('[data-text]')) {
    var id = t.getAttribute('data-text');
    state.draft[id] = t.value; save();
    var base = id.replace(/~t$/, ''), btn = document.querySelector('[data-submit="' + base + '"]');
    var all = [document.getElementById('t-' + base), document.getElementById('t-' + base + '~t')].filter(Boolean);
    if (btn) btn.disabled = !all.every(function(x){ return x.value.trim(); });
  }
});
render();
loadComments();
})();
</script>
</body>
</html>
