aders need is not only intelligence but also empathy.", "alt": "What leaders need is empathy as well as intelligence.", "kind": "write"}]}, {"title": "Exercise 2 — Translate, then rewrite", "intro": ["<i>Translate each sentence into natural English. Then rewrite your translation using the given structure. ● sentences give keywords; ●● and ●●● sentences give only the structure.<\/i>"], "items": [{"level": 1, "n": 0, "cue": "Chính giáo dục mới là con đường tốt nhất để thoát nghèo.", "kind": "translate", "rewriteWith": "<b>It is … that<\/b>", "translation": "Education is the best way to escape poverty.", "answer": "<b>It is education that offers the best route out of poverty.<\/b>", "alt": "It is through education that people can best escape poverty."}, {"level": 1, "n": 1, "cue": "Điều người trẻ cần nhất là kinh nghiệm thực tế.", "kind": "translate", "rewriteWith": "<b>What … is<\/b>", "translation": "Young people need practical experience most.", "answer": "<b>What young people need most is practical experience.<\/b>", "alt": "What young people most need is practical experience."}, {"level": 1, "n": 2, "cue": "Lý do nhiều người không đạp xe là vì đường sá nguy hiểm.", "kind": "translate", "rewriteWith": "<b>The reason why … is that<\/b>", "translation": "Many people do not cycle because the roads are dangerous.", "answer": "<b>The reason why many people do not cycle is that the roads are dangerous.<\/b>", "alt": "The main reason many people avoid cycling is that the roads are unsafe."}, {"level": 1, "n": 3, "cue": "Tất cả những gì nhiều sinh viên mong muốn là một công việc ổn định.", "kind": "translate", "rewriteWith": "<b>All (that) … is<\/b>", "translation": "Many students only want a stable job.", "answer": "<b>All that many students want is a stable job.<\/b>", "alt": "All many students want is a secure job."}, {"level": 1, "n": 4, "cue": "Vấn đề chính là giá thuê nhà tăng nhanh hơn tiền lương.", "kind": "translate", "rewriteWith": "<b>The main problem is that<\/ ", "answer": "The more time children spend online, <s>the less time do they spend<\/s><b> THE LESS TIME THEY SPEND<\/b> outdoors.", "notes": ["<span class=\"tag GRA\">GRA<\/span> Không đảo ngữ ở vế sau của so sánh kép."]}, {"level": 3, "n": 17, "kind": "fix", "cue": "What leaders need is not only intelligence but also empathetic.", "answer": "What leaders need is not only intelligence but also <s>empathetic<\/s><b> EMPATHY<\/b>.", "notes": ["<span class=\"tag GRA\">GRA<\/span> Hai vế song song phải cùng là danh từ (<i>intelligence … empathy<\/i>)."]}, {"level": 3, "n": 18, "kind": "fix", "cue": "The thing that worries young people most is the cost of housing.", "answer": "<b>✓ <\/b>The thing that worries young people most is the cost of housing.", "notes": ["Đúng: <i>The thing that … is …<\/i>."]}, {"level": 3, "n": 19, "kind": "fix", "cue": "It is money that is the only thing that makes everyone happy.", "answer": "It is money that is <s>the only thing that makes everyone happy<\/s><b> ONE OF SEVERAL FACTORS THAT AFFECT PEOPLE'S HAPPINESS<\/b>.", "notes": ["<span class=\"tag TR\">TR<\/span> Tuyệt đối hóa (<i>the only thing, everyone<\/i>); câu chẻ không làm nhận định đúng hơn."]}]}, {"title": "Exercise 4 — Apply to real exam prompts", "intro": ["<i>For each prompt, write one sentence (●, ●●) using the suggested emphasis structure, or two sentences (●●●) using two different emphasis structures.<\/i>"], "items": [{"level": 1, "n": 0, "cue": "Work · Agree/disagree", "prompt": "<i>Choosing a career is the most important decision that young people have to make. To what extent do you agree or disagree?<\/i>", "hint": "It is … that", "answer": "It is the choice of career that shapes much of a young person's adult life.", "kind": "write"}, {"level": 1, "n": 1, "cue": "Work · Agree/disagree", "prompt": "<i>People work for many different reasons. Some people believe that money is the most important reason. To what extent do you agree or disagree?<\/i>", "hint": "What … is", "answer": "What motivates many people most is not money but a sense of purpose.", "kind": "write"}, {"level": 1, "n": 2, "cue": "Government, politics and diplomacy · Agree/disagree", "prompt": "<i>Intelligence is the most important quality a leader can have. To what extent do you agree or disagree?<\/i>", "hint": "What … need is not only … but also", "answer": "What leaders need is not only intelligence but also the ability to listen.", "kind": "write"}, {"level": 1, "n": 3, "cue": "Work · Agree/disagree", "prompt": "<i>Social skills are as important as good qualifications for success in a job. To what extent do you agree or disagree?<\/i>", "hint": "It is … that", "answer": "It is often social skills, rather than qualifications, that help employees win promotion.", "kind": "write"}, {"level": 1, "n": 4, "cue": "Economy, money and trade · Agree/disagree", "prompt": "<i>Some people believe that the most important benefit of being wealthy is the ability to help other people. To what extent do you agree or disagree?<\/i>", "hint": "The main … is that", "answer": "The main benefit of wealth is that it gives people the freedom to help others.", "kind": "write"}, {"level": 1, "n": 5, "cue": "Lifestyle · Agree/disagree", "prompt": "<i>Eating meals together is an important social activity for families and communities. To what extent do you agree or disagree with this view in relation to your own country?<\/i>", "hint": "It is … that", "answer": "It is shared meals that give busy families a chance to talk to one another.", "kind": "write"}, {"level": 1, "n": 6, "cue": "Food and health · Agree/disagree", "prompt": "<i>Some people believe that everyone should become vegetarian because people do not need to eat meat to have a healthy diet. To what extent do you agree or disagree?<\/i>", "hint": "The reason why … is that", "answer": "The reason why many people eat less meat is that they are concerned about animal welfare.", "kind": "write"}, {"level": 2, "n": 7, "cue": "Education · Agree/disagree", "prompt": "<i>Some people believe that reading stories from books is better for children than watching television or playing computer games. To what extent do you agree or disagree?<\/i>", "hint": "The more …, the …", "answer": "The more children read, the richer their vocabulary becomes.", "kind": "write"}, {"level": 2, "n": 8, "cue": "Education · Discuss both views", "prompt": "<i>Some people believe that a university education is necessary for success in life, while others think it is possible to succeed without going to university. Discuss both views and give your own opinion.<\/i>", "hint": "What matters is not only … but also", "answer": "What matters for success is not only a degree but also the willingness to keep learning.", "kind": "write"}, {"level": 2, "n": 9, "cue": "Lifestyle · Discuss both views", "prompt": "<i>Some people believe that personal happiness depends mainly on economic success, while others think it depends on many different factors. Discuss both views and give your own opinion.<\/i>", "hint": "What … is", "answer": "What makes many people happy is having close relationships, not simply earning more.", "kind": "write"}, {"level": 2, "n": 10, "cue": "Work · Discuss both views", "prompt": "<i>Some people believe that companies should give the greatest importance to their employees, while others think customers should come first. Discuss both views and give your own opinion.<\/i>", "hint": "It is … who", "answer": "It is employees who ultimately determine how customers are treated.", "kind": "write"}, {"level": 2, "n": 11, "cue": "Media and communication · Discuss both views", "prompt": "<i>The number of television programmes is increasing. Some people think this gives viewers more choice, while others believe it lowers the overall quality of television. Discuss both views and give your own opinion.<\/i>", "hint": "The more …, the …", "answer": "The more channels there are, the harder it is for each one to fund high-quality programmes.", "kind": "write"}, {"level": 2, "n": 12, "cue": "Age, generation and gender · Discuss both views", "prompt": "<i>In some cultures, older people are highly valued, while in others, greater value is placed on youth. Discuss both views and give your own opinion.<\/i>", "hint": "What is most striking is that", "answer": "What is most striking is that cultures which respect older people often have stronger family ties.", "kind": "write"}, {"level": 2, "n": 13, "cue": "Media and communication · Causes/problems/solutions", "prompt": "<i>A report has shown that many children aged 7 to 11 spend too much time watching television and playing video games. How can this affect children, their families and society, and what measures can be taken to reduce the problem?<\/i>", "hint": "The main problem is that", "answer": "The main problem is that children who spend hours on screens get too little physical exercise.", "kind": "write"}, {"level": 3, "n": 14, "cue": "Socio-cultural and global issues · Causes/problems/solutions", "prompt": "<i>Many charities and organisations promote special awareness days, such as National Children's Day or No Smoking Day, in order to publicise their work. Why has this become common, and what effects does it have?<\/i>", "hint": "Two sentences, each using a different emphasis structure (cleft sentence, <i>The reason why<\/i>, double comparative …).", "answer": "What awareness days do best is draw public attention to issues that are usually ignored. The more often such days are held, however, the less impact each one may have.", "kind": "write"}, {"level": 3, "n": 15, "cue": "Socio-cultural and global issues · Advantages/disadvantages", "prompt": "<i>Some people believe that all young adults should spend a period of time doing unpaid work in their local community. Do the advantages of this outweigh the disadvantages?<\/i>", "hint": "Two sentences, each using a different emphasis structure (cleft sentence, <i>The reason why<\/i>, double comparative …).", "answer": "It is through unpaid community work that many young adults first learn responsibility. The main drawback, however, is that it may prevent those from poorer families from earning money.", "kind": "write"}, {"level": 3, "n": 16, "cue": "Education · Advantages/disadvantages", "prompt": "<i>Some students take a year off between finishing school and starting university. Do the advantages of taking a gap year outweigh the disadvantages?<\/i>", "hint": "Two sentences, each using a different emphasis structure (cleft sentence, <i>The reason why<\/i>, double comparative …).", "answer": "What a gap year offers is time to mature before university. The reason why some students struggle afterwards, however, is that they lose the habit of studying.", "kind": "write"}, {"level": 3, "n": 17, "cue": "Lifestyle · Positive/negative development", "prompt": "<i>In some countries, more and more people are choosing to live alone. Why is this happening, and is this a positive or negative development?<\/i>", "hint": "Two sentences, each using a different emphasis structure (cleft sentence, <i>The reason why<\/i>, double comparative …).", "answer": "The reason why more people live alone is that they have higher incomes and marry later. What concerns some experts is that this may increase loneliness in old age.", "kind": "write"}, {"level": 3, "n": 18, "cue": "Population · Positive/negative development", "prompt": "<i>In the future, the proportion of older people is expected to be higher than the proportion of young people in many countries. Is this a positive or negative development?<\/i>", "hint": "Two sentences, each using a different emphasis structure (cleft sentence, <i>The reason why<\/i>, double comparative …).", "answer": "It is not the ageing population itself but the lack of preparation that poses the greatest risk. The longer governments delay pension reform, the more difficult it will become.", "kind": "write"}, {"level": 3, "n": 19, "cue": "Lifestyle · Two-part question", "prompt": "<i>How important is it for individuals and countries to plan for the future rather than focus mainly on the present?<\/i>", "hint": "Two sentences, each using a different emphasis structure (cleft sentence, <i>The reason why<\/i>, double comparative …).", "answer": "What individuals need is a balance between enjoying the present and preparing for the future. It is governments, however, that most need long-term plans, especially for climate change.", "kind": "write"}]}], "after": []}], "parts": [], "guide": [], "index": []}</script>

<script>
(function(){
'use strict';
var D = JSON.parse(document.getElementById('data').textContent);
var STORE = 'wt2-18';
var state = load();
function blank(){ return {draft:{}, sub:{}, choice:{}, seen:{}, sent:{}, dirty:{}, fb:{}}; }
function load(){ try { var s = JSON.parse(localStorage.getItem(STORE)); return s && s.sub ? s : blank(); } catch(e){ return blank(); } }
function save(){ try { localStorage.setItem(STORE, JSON.stringify(state)); } catch(e){} }

var $ = function(s, r){ return (r||document).querySelector(s); };
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function dots(n){ return n ? '<span class="lv" title="Level ' + n + '">' + '●'.repeat(n) + '</span>' : ''; }
function textOf(html){ var t = document.createElement('div'); t.innerHTML = html; return t.textContent; }

/* ---------- recorded audio for the English examples (audio/<id>.mp3, made by make_audio.py) ---------- */
var AUDIO = JSON.parse(document.getElementById('audio').textContent);
var player = new Audio(), playing = null;
function speakBtn(text){
  var id = AUDIO[text];
  if (!id) return '';
  return '<button type="button" class="speak" data-audio="' + id + '" aria-label="Listen: ' + esc(text) + '" title="Listen">🔊</button>';
}
function stopAudio(){ player.pause(); if (playing) playing.classList.remove('on'); playing = null; }
player.addEventListener('ended', stopAudio);
document.addEventListener('click', function(e){
  var b = e.target.closest('[data-audio]'); if (!b) return;
  var again = playing === b;
  stopAudio();
  if (again) return;
  player.src = 'audio/' + b.getAttribute('data-audio') + '.mp3';
  playing = b; b.classList.add('on');
  player.play().catch(stopAudio);
});

/* ---------- progress ---------- */
function ids(u){ var out = []; u.exercises.forEach(function(ex, k){ ex.items.forEach(function(it){ out.push(u.num + '-' + (k + 1) + '-' + it.n); }); }); return out; }
function isDone(id){ return !!(state.sub[id] || state.choice[id] || state.seen[id]); }
var ALL = [].concat.apply([], D.units.map(ids));
function updateProgress(){
  var n = ALL.filter(isDone).length;
  $('#progressText').textContent = 'Done: ' + n + '/' + ALL.length + ' items';
  $('#progressBar').style.width = (100 * n / ALL.length) + '%';
}
$('#reset').addEventListener('click', function(){
  if (!confirm('Clear everything you wrote, submitted and chose in this browser?')) return;
  state = blank(); save(); render();
});

/* ---------- header and tabs ---------- */
// One page per unit; D.nav lists every page (index + units) for the tab bar.
$('#title').textContent = D.cover[0];
$('#cover').innerHTML = D.cover.slice(1).map(function(c, i, a){
  return '<p class="standfirst' + (i === a.length - 1 ? ' small' : '') + '">' + esc(c) + '</p>';
}).join('');
$('#tabs').innerHTML = D.nav.map(function(t){ return '<a href="' + t.href + '"' + (t.current ? ' aria-current="page"' : '') + '>' + esc(t.label) + '</a>'; }).join('');
function unitTitle(u){ return u.num === 'review' ? u.name : 'Unit ' + u.num + ' · ' + u.name; }

function route(){
  return {tab: {unit: D.units[0]}, part: location.hash.replace('#', '') || 'ly-thuyet'};
}
var filter = 0;

/* ---------- index page: all units with progress, then the guide ---------- */
function renderBlocks(list){
  var s = '', card = '', open = false;
  function flush(){ if (open) { card += '</ul>'; open = false; } if (card) s += '<div class="card">' + card + '</div>'; card = ''; }
  list.forEach(function(b){
    if (b.type === 'h1') { flush(); s += '<h2 style="margin-top:28px">' + esc(b.text) + '</h2>'; }
    else if (b.type === 'h') { flush(); card = '<h4>' + b.html + '</h4>'; }
    else if (b.type === 'li') { if (!open) { card += '<ul class="plain">'; open = true; } card += '<li>' + b.html + '</li>'; }
    else if (b.type === 'table') { flush(); s += renderTable(b); }
    else { if (open) { card += '</ul>'; open = false; } card += '<p>' + b.html + '</p>'; }
  });
  flush();
  return s;
}
function renderIndex(){
  var s = '<h2>Units</h2>';
  D.parts.forEach(function(p){
    s += '<p class="part-title">' + esc(p.title) + '</p><div class="boxes">' + p.units.map(function(n){
      var u = D.index.find(function(x){ return x.num === n; }), done = 0;
      try { var st = JSON.parse(localStorage.getItem(u.store)) || {}; done = Object.keys(Object.assign({}, st.sub, st.choice)).length; } catch(e){}
      return '<a class="card" style="text-decoration:none;color:inherit;display:block;margin:0" href="' + u.href + '"><h4 style="color:var(--heading)">' + esc(unitTitle(u)) + '</h4><span class="note">Done: ' + Math.min(done, u.count) + '/' + u.count + '</span></a>';
    }).join('') + '</div>';
  });
  return s + renderBlocks(D.guide);
}

/* ---------- theory ---------- */
function renderTable(b){
  var vocab = b.head[0] === 'Cụm từ' || b.head[0] === 'Phrase', speakLast = vocab || /câu trả lời mở rộng|extended answer/i.test(b.head[b.head.length - 1]);
  var rows = b.rows.filter(function(r){ return !filter || !r.level || r.level === filter; });
  return '<div class="tablewrap"><table><thead><tr>' + b.head.map(function(h){ return '<th scope="col">' + esc(h) + '</th>'; }).join('') + '</tr></thead><tbody>' +
    rows.map(function(r){
      return '<tr>' + r.cells.map(function(c, i){
        if (i === 0 && vocab) return '<td class="phrase">' + dots(r.level) + ' ' + c + '</td>';
        if (i === r.cells.length - 1 && speakLast) return '<td>' + c + speakBtn(textOf(c)) + '</td>';
        return '<td' + (vocab && i === 1 ? ' class="muted"' : '') + '>' + c + '</td>';
      }).join('') + '</tr>';
    }).join('') + '</tbody></table></div>';
}
function sampleSpeech(html){
  var t = textOf(html), i = t.indexOf(' → ');
  if (i >= 0) t = t.slice(i + 3);
  return t.replace(/\s*\([^)]*\)\s*$/, '').replace(/\s*\/[^\/\s]+\/\s*/g, ' ');
}
function renderTheory(u){
  var s = '', boxes = [];
  u.theory.concat(u.intro, u.after).forEach(function(b){
    if (b.type === 'sub') s += '<h3>' + esc(b.text) + '</h3>';
    else if (b.type === 'p') s += '<p>' + b.html + '</p>';
    else if (b.type === 'table') s += renderTable(b);
    else if (b.type === 'samples') s += '<div class="card">' + b.items.map(function(x){ return '<div class="sample">' + x + speakBtn(sampleSpeech(x)) + '</div>'; }).join('') + '</div>';
    else if (b.type === 'mistakes') boxes.push('<div class="card box"><h4>Lỗi cần tránh</h4>' + b.items.map(function(m){
      return '<div class="mistake"><div class="bad">' + m.bad + '</div><div class="good">' + m.good + '</div><div class="note">' + m.note + '</div></div>';
    }).join('') + '</div>');
    else if (b.type === 'choose') boxes.push('<div class="card box"><h4>Chọn cho đúng</h4>' + b.items.map(function(c){
      return '<div class="mistake"><div>' + c.h + '</div><div class="note">' + c.html + '</div></div>';
    }).join('') + '</div>');
    else if (b.type === 'sounds') boxes.push('<div class="card box"><h4>Âm cần luyện</h4>' + b.lines.map(function(l){ return '<p>' + l + '</p>'; }).join('') + '<p class="note">' + b.tip + '</p></div>');
  });
  // The first "Mục đích" block goes in a card.
  s = s.replace(/^<h3>Mục đích<\/h3>((?:<p>[\s\S]*?<\/p>)+)/, '<div class="card"><h4>Mục đích</h4>$1</div>');
  if (boxes.length) s += '<div class="boxes" style="margin-top:20px">' + boxes.join('') + '</div>';
  return s;
}

/* ---------- exercises ---------- */
var LINES = [['rewriteWith', 'Rewrite with'], ['hint', 'Hint']];
// The corrected sentence without the struck-through mistakes (error-correction keys).
function refText(h){ return textOf(String(h).replace(/<s>[\s\S]*?<\/s>/g, '')).replace(/\s+/g, ' ').trim(); }
function notesHtml(it){
  return (it.ref ? '<div style="margin-top:6px"><span class="ref">' + esc(it.ref) + '</span></div>' : '') +
    (it.notes || []).concat(it.note ? [it.note] : []).map(function(n){ return '<div class="note" style="margin-top:6px">' + n + '</div>'; }).join('');
}
function answerHtml(it, id){
  var s = '';
  if (state.sub[id]) s += '<div class="note">Your answer:</div><div class="mine" lang="en">' + esc(state.sub[id]) + '</div>' + feedbackHtml(it, id);
  if (it.translation) s += '<div class="main"><span class="label">Translation:</span> ' + it.translation + '</div>';
  s += '<div class="main">' + (it.suggest ? '<span class="label">Suggestion:</span> ' : it.translation ? '<span class="label">Rewrite:</span> ' : '<span class="label">Answer:</span> ') + it.answer + '</div>';
  if (it.alt) s += '<div class="alt"><span class="label">Also accepted:</span> ' + it.alt + '</div>';
  return s + notesHtml(it);
}
/* ---------- feedback on Submit: Gemini through the portal, or free quick checks ---------- */
var checking = {};
function feedbackHtml(it, id){
  var f = (state.fb || {})[id];
  if (checking[id]) return '<div class="fb"><div class="fb-head"><b>Feedback</b><span class="fb-small">Checking your answer…</span></div></div>';
  if (!f || f.for !== state.sub[id]) return '';
  if (f.kind === 'ai') {
    var r = f.data, tag = {great: 'Great', good: 'Good', needs_work: 'Needs work'}[r.verdict] || 'Good';
    var s = '<div class="fb ' + esc(r.verdict) + '" lang="en"><div class="fb-head"><b>Feedback</b><span class="fb-tag">' + tag + '</span></div><div>' + esc(r.feedback) + '</div>';
    if (r.corrections.length) s += '<ul>' + r.corrections.map(function(c){
      return '<li><span class="wrong">' + esc(c.wrong) + '</span> → <span class="right">' + esc(c.right) + '</span>' + (c.why ? ' <span class="fb-small">(' + esc(c.why) + ')</span>' : '') + '</li>';
    }).join('') + '</ul>';
    if (r.improved) s += '<div style="margin-top:6px"><span class="label">Better:</span> ' + esc(r.improved) + '</div>';
    return s + '<div class="fb-small">AI feedback; it can be wrong. Your teacher&rsquo;s comment is the final word.</div></div>';
  }
  var c = f.data;
  return '<div class="fb" lang="en"><div class="fb-head"><b>Quick checks</b></div><ul>' + c.list.map(function(x){
    return '<li>' + (x.ok ? '✓ ' : '✗ ') + esc(x.text) + '</li>';
  }).join('') + '</ul>' + (c.why ? '<div class="fb-small">' + esc(c.why) + '</div>' : '') + '</div>';
}
function words(t){ return (t.match(/[A-Za-z']+/g) || []); }
function sentences(t){ return t.split(/[.!?]+(?:\s|$)/).filter(function(x){ return x.trim(); }).length; }
function quickChecks(it, id){
  var a = state.sub[id], low = ' ' + a.toLowerCase().replace(/[^a-z' ]+/g, ' ').replace(/\s+/g, ' ') + ' ', list = [];
  // Lenient: each word of the phrase may change its ending (make → making, affect → affects).
  var has = function(p){
    var ws = p.toLowerCase().replace(/[^a-z' ]+/g, ' ').trim().split(/\s+/).filter(Boolean);
    if (!ws.length) return true;
    var re = new RegExp(' ' + ws.map(function(w){ return (w.length > 3 ? w.slice(0, Math.max(3, w.length - 2)) : w) + "[a-z']*"; }).join(" (?:[a-z']+ )?"));
    return re.test(low);
  };
  var mine = it.kind === 'translate' ? a.replace(/^[\s\S]*\nRewrite:\s*/, '') : a;
  // "Start with: …" / "Bắt đầu: …" in the hint: the answer should begin that way.
  var start = textOf(it.hint || '').match(/Start(?: with)?:\s*([^…\.;]+)/i);
  if (start) list.push({ok: has(start[1].replace(/\.\.\.|…/g, '')), text: 'Starts with “' + start[1].trim() + '…”'});
  if (it.kind === 'fix') {
    var orig = textOf(it.cue).replace(/\s+/g, ' ').trim(), right = refText(it.answer);
    var same = function(x, y){ return x.toLowerCase().replace(/[^a-z]+/g, '') === y.toLowerCase().replace(/[^a-z]+/g, ''); };
    if (/^correct\.?$/i.test(mine.trim())) list.push({ok: same(orig, right), text: same(orig, right) ? 'Yes, this sentence was already correct' : 'This sentence has at least one mistake'});
    else list.push({ok: !same(mine, orig), text: 'You changed the sentence (fixed something)'});
  }
  var n = words(mine).length, ref = words(refText(it.answer)).length;
  if (ref) list.push({ok: n >= ref * 0.6 && n <= ref * 1.6, text: 'Length: ' + n + ' words (the answer has about ' + ref + ')'});
  if (/\b\w+n't\b|\b(i'm|it's|they're|we're|you're|that's|there's)\b/i.test(mine)) list.push({ok: false, text: 'No contractions in academic writing (do not, it is …)'});
  list.push({ok: /^[A-Z"“]/.test(mine.trim()) && /[.!?]["”]?$/.test(mine.trim()), text: 'Starts with a capital letter and ends with a full stop'});
  return list;
}
function assess(it, id){
  var a = state.sub[id];
  var done = function(kind, data){ state.fb = state.fb || {}; state.fb[id] = {for: a, kind: kind, data: data}; save(); delete checking[id]; if (document.querySelector('.item[data-id="' + id + '"]')) rerenderItem(id); };
  var fallback = function(why){ done('checks', {list: quickChecks(it, id), why: why}); };
  if (!API_URL || !token()) return fallback('Sign in to the portal to get AI feedback.');
  var p = id.split('-'), u = D.units.find(function(x){ return String(x.num) === p[0]; }), ex = u.exercises[+p[1] - 1];
  checking[id] = 1; rerenderItem(id);
  apiCall('workbook.assess', {url: location.href.split('#')[0], subject: 'writing', instruction: textOf(ex.intro.join(' ')).slice(0, 600), prompt: promptOf(it),
    reference: (it.translation ? 'Translation: ' + textOf(it.translation) + '\nRewrite: ' : '') + refText(it.answer) + (it.alt ? '\nAlso accepted: ' + textOf(it.alt) : ''), answer: a})
    .then(function(res){
      if (res.ok) return done('ai', res.result);
      fallback({not_configured: 'AI feedback is not switched on yet.', limit: 'Daily AI feedback limit reached; try again tomorrow.',
        busy: 'AI feedback is busy right now; submit again in a minute.', error: 'AI feedback is not available right now.'}[res.reason] || '');
    })
    .catch(function(e){ fallback(e.code === 'unauthorized' ? 'Sign in to the portal to get AI feedback.' : e.code === 'forbidden' ? 'AI feedback is only for students of this class.' : 'AI feedback is not available right now.'); });
}
// Multiple choice: "choice" items have lettered options; "pick" items choose a phrase in brackets.
function optionsOf(it){
  return it.kind === 'pick' ? it.picks[0].map(function(p, k){ return {letter: String.fromCharCode(65 + k), text: p}; }) : it.options;
}
function correctOf(it){
  if (it.kind !== 'pick') return it.correct;
  return optionsOf(it).find(function(o){ return o.text === it.answer; }).letter;
}
function choiceResult(it, id){
  var pick = state.choice[id], ok = pick === correctOf(it);
  return '<div class="verdict ' + (ok ? 'ok">✓ Correct' : 'no">✗ Not quite. Answer: ' + (it.kind === 'pick' ? esc(it.answer) : it.correct)) + '</div>' + notesHtml(it);
}
function renderItem(it, id, i){
  var head = '<span class="cue">' + (it.kind === 'pick' ? it.cue.replace(/\(\s*[^()]*?\/[^()]*?\s*\)/, '( … )') : it.cue) + '</span>';
  var lines = LINES.filter(function(l){ return it[l[0]]; }).map(function(l){
    return '<div><span class="label">' + l[1] + ':</span> ' + (l[0] === 'hint' ? '<span class="hint">' + it.hint + '</span>' : it[l[0]]) + '</div>';
  }).join('');
  var s = '<div class="item' + (isDone(id) ? ' done' : '') + '" data-id="' + id + '">' +
    '<div class="item-head"><span class="num">' + (i + 1) + '</span>' + dots(it.level) + head + '</div>' +
    (it.prompt ? '<div class="prompt" lang="en">' + it.prompt + '</div>' : '') +
    (lines ? '<div class="lines">' + lines + '</div>' : '');
  if (it.kind === 'choice' || it.kind === 'pick') {
    var pick = state.choice[id], right = correctOf(it);
    s += '<div class="opts" role="radiogroup" aria-label="Choose one">' + optionsOf(it).map(function(o){
      var cls = pick ? (o.letter === right ? ' right' : o.letter === pick ? ' wrong' : '') : '';
      return '<label class="opt' + cls + '"><input type="radio" name="c-' + id + '" value="' + o.letter + '"' + (pick === o.letter ? ' checked' : '') + '>' + (it.kind === 'pick' ? '' : '<b>' + o.letter + '</b>') + '<span>' + o.text + '</span></label>';
    }).join('') + '</div><div class="work"><div class="actions"><button type="button" class="btn primary" data-choose="' + id + '"' + (pick ? '' : ' disabled') + '>' + (pick ? 'Submit again' : 'Submit') + '</button></div>' +
      '<div class="answer" id="a-' + id + '"' + (pick ? '' : ' hidden') + '>' + (pick ? choiceResult(it, id) : '') + '</div></div>';
  } else if (it.kind === 'translate') {
    var subT = !!state.sub[id], prev = splitTranslate(state.sub[id] || '');
    var d1 = state.draft[id + '~t'] != null ? state.draft[id + '~t'] : prev[0], d2 = state.draft[id] != null ? state.draft[id] : prev[1];
    s += '<div class="work"><label class="note" for="t-' + id + '~t">Your translation</label>' +
      '<textarea id="t-' + id + '~t" data-text="' + id + '~t" rows="2" spellcheck="true" lang="en">' + esc(d1) + '</textarea>' +
      '<label class="note" for="t-' + id + '">Rewrite it with the structure</label>' +
      '<textarea id="t-' + id + '" data-text="' + id + '" rows="2" spellcheck="true" lang="en">' + esc(d2) + '</textarea>' +
      '<div class="actions"><button type="button" class="btn primary" data-submit="' + id + '"' + (d1.trim() && d2.trim() ? '' : ' disabled') + '>' + (subT ? 'Submit again' : 'Submit') + '</button>' +
      (subT ? '' : '<span class="note">Submit both to see the answer.</span>') + '</div>' +
      '<div class="answer" id="a-' + id + '"' + (subT ? '' : ' hidden') + '>' + (subT ? answerHtml(it, id) : '') + '</div></div>';
  } else if (it.kind === 'read') {
    var seen = !!state.seen[id];
    s += '<div class="work"><div class="actions"><button type="button" class="btn primary" data-see="' + id + '" aria-expanded="' + seen + '">' + (seen ? 'Hide answer' : 'Show answer') + '</button></div>' +
      '<div class="answer" id="a-' + id + '"' + (seen ? '' : ' hidden') + '>' + answerHtml(it, id) + '</div></div>';
  } else {
    var draft = state.draft[id] != null ? state.draft[id] : (state.sub[id] || '');
    var sub = !!state.sub[id];
    s += '<div class="work"><label class="note" for="t-' + id + '">' + (it.kind === 'fix' ? 'Write the corrected sentence (or type <b>Correct</b> if there is no mistake)' : 'Write your answer') + '</label>' +
      '<textarea id="t-' + id + '" data-text="' + id + '" rows="2" spellcheck="true" lang="en">' + esc(draft) + '</textarea>' +
      '<div class="actions"><button type="button" class="btn primary" data-submit="' + id + '"' + (draft.trim() ? '' : ' disabled') + '>' + (sub ? 'Submit again' : 'Submit') + '</button>' +
      (sub ? '' : '<span class="note">Submit your answer to see ' + (it.suggest ? 'a suggestion' : 'the answer') + '.</span>') + '</div>' +
      '<div class="answer" id="a-' + id + '"' + (sub ? '' : ' hidden') + '>' + (sub ? answerHtml(it, id) : '') + '</div></div>';
  }
  return s + '</div>';
}
function splitTranslate(sub){
  var m = /^Translation:\s*([\s\S]*?)\nRewrite:\s*([\s\S]*)$/.exec(sub);
  return m ? [m[1], m[2]] : ['', sub];
}
function findItem(id){
  var p = id.split('-'), u = D.units.find(function(x){ return String(x.num) === p[0]; });
  return u.exercises[+p[1] - 1].items.find(function(it){ return it.n === +p[2]; });
}
function renderExercise(u, k){
  var ex = u.exercises[k - 1];
  var s = '<h3>' + esc(ex.title) + '</h3>' + ex.intro.map(function(p){ return '<p class="lede">' + p + '</p>'; }).join('') +
    (ex.legend ? '<div class="card">' + ex.legend.map(function(o){ return '<div><b>' + o.letter + '</b> ' + o.text + '</div>'; }).join('') + '</div>' : ''), shown = 0;
  s += '<div class="send-box" data-ex="' + u.num + '-' + k + '">' + sendBox(u.num + '-' + k) + '</div>';
  ex.items.forEach(function(it, i){
    if (filter && it.level !== filter) return;
    shown++;
    s += renderItem(it, u.num + '-' + k + '-' + it.n, i);
  });
  if (!shown) s += '<p class="empty">No items at this level.</p>';
  s += '<div class="send-box" data-ex="' + u.num + '-' + k + '">' + sendBox(u.num + '-' + k) + '</div>';
  return s;
}

/* ---------- sending finished exercises to the teacher (IELTS Harper Portal) ---------- */
// This page and the portal are on the same site, so the student's portal sign-in is readable here.
var API_URL = 'https://script.google.com/macros/s/AKfycbwKm1zvqca2-WO20f49M4mNW2qn9Aq4uxJZ3_bnQrErWPL5TN4jHycXZUQBDJ1W7wWg/exec', PORTAL = 'https://ieltsharper.github.io/portal/';
var send = {}; // exercise key -> {status: 'sending'|'error'|'forbidden'|'login', message}
var comments = {}; // exercise key -> {comment, commentAt}
state.sent = state.sent || {}; state.dirty = state.dirty || {};
function token(){ try { return localStorage.getItem('portal.session'); } catch(e){ return null; } }
function apiCall(action, payload){
  return fetch(API_URL, {method: 'POST', headers: {'Content-Type': 'text/plain;charset=utf-8'},
    body: JSON.stringify({action: action, token: token(), payload: payload}), redirect: 'follow', credentials: 'omit'})
    .then(function(r){ return r.json(); })
    .then(function(env){ if (env.ok) return env.data; var e = new Error(env.error.message); e.code = env.error.code; throw e; });
}
function exParts(key){ var p = key.split('-'), u = D.units.find(function(x){ return String(x.num) === p[0]; }); return {u: u, k: +p[1], ex: u.exercises[+p[1] - 1]}; }
function sendable(ex){ return ex.items.some(function(it){ return it.kind !== 'read'; }); }
function finished(key){ var x = exParts(key); return x.ex.items.every(function(it){ var id = key + '-' + it.n; return state.sub[id] || state.choice[id]; }); }
function doneCount(key){ var x = exParts(key); return x.ex.items.filter(function(it){ var id = key + '-' + it.n; return state.sub[id] || state.choice[id]; }).length; }
function promptOf(it){
  var head = textOf(it.cue) + (it.prompt ? '\nExam prompt: ' + textOf(it.prompt) : '');
  var lines = LINES.filter(function(l){ return it[l[0]]; }).map(function(l){ return l[1] + ': ' + textOf(it[l[0]]); });
  return [head].concat(lines).join('\n');
}
function payloadFor(key){
  var x = exParts(key);
  return {
    url: location.href.split('#')[0], lessonTitle: D.cover[0], exercise: key,
    exerciseTitle: unitTitle(x.u) + ' · ' + x.ex.title,
    answers: x.ex.items.map(function(it){
      var id = key + '-' + it.n;
      if (it.kind === 'choice' || it.kind === 'pick') {
        var opt = function(l){ var o = optionsOf(it).find(function(o){ return o.letter === l; }); return (it.kind === 'pick' ? '' : l + '. ') + (o ? textOf(o.text) : ''); };
        return {prompt: promptOf(it), answer: opt(state.choice[id]), model: opt(correctOf(it)), correct: state.choice[id] === correctOf(it)};
      }
      return {prompt: promptOf(it), answer: state.sub[id], model: (it.translation ? 'Translation: ' + textOf(it.translation) + '\nRewrite: ' : '') + refText(it.answer) +(it.alt ? '\nAlso accepted: ' + textOf(it.alt) : ''), correct: null};
    })
  };
}
function sendBox(key){
  var x = exParts(key);
  if (!sendable(x.ex) || !API_URL) return '';
  var c = comments[key], s = send[key] || {}, out = '';
  if (c && c.comment) out += '<div class="teacher-note"><b>Teacher&rsquo;s feedback</b><div>' + esc(c.comment) + '</div></div>';
  var msg;
  if (!token() || s.status === 'login') msg = '<a href="' + PORTAL + '" target="_blank" rel="noopener">Sign in to the portal</a> so your work is sent to your teacher when you finish.';
  else if (s.status === 'sending') msg = 'Sending to your teacher…';
  else if (s.status === 'forbidden') msg = 'This exercise is not open to your portal account yet, so it cannot be sent to your teacher.';
  else if (s.status === 'error') msg = 'Not sent yet (' + esc(s.message) + '). <button type="button" class="btn" data-send="' + key + '">Try again</button>';
  else if (state.sent[key] && state.dirty[key]) msg = 'You changed your answers after sending. <button type="button" class="btn primary" data-send="' + key + '">Send again to your teacher</button>';
  else if (state.sent[key]) msg = '✓ Sent to your teacher on ' + esc(new Date(state.sent[key]).toLocaleString('en-GB')) + '.' + (c && c.comment ? '' : ' Your teacher will give feedback in the portal.');
  else msg = 'Done: ' + doneCount(key) + '/' + x.ex.items.length + '. When you finish them all, this exercise is sent to your teacher automatically.';
  return out + '<p class="send-msg">' + msg + '</p>';
}
function refreshSendBoxes(key){
  document.querySelectorAll('.send-box[data-ex="' + key + '"]').forEach(function(b){ b.innerHTML = sendBox(key); });
}
function sendExercise(key){
  if (!API_URL || !token()) { refreshSendBoxes(key); return; }
  send[key] = {status: 'sending'}; refreshSendBoxes(key);
  apiCall('workbook.submit', payloadFor(key)).then(function(row){
    state.sent[key] = row.submittedAt; delete state.dirty[key]; save();
    send[key] = {}; comments[key] = {comment: row.comment, commentAt: row.commentAt};
  }).catch(function(e){
    send[key] = e.code === 'unauthorized' ? {status: 'login'} : e.code === 'forbidden' ? {status: 'forbidden'} : {status: 'error', message: e.message || 'network error'};
  }).then(function(){ refreshSendBoxes(key); });
}
function afterAnswer(id){
  var key = id.split('-').slice(0, 2).join('-');
  if (!sendable(exParts(key).ex)) return;
  if (state.sent[key]) { state.dirty[key] = 1; save(); refreshSendBoxes(key); return; }
  if (finished(key)) sendExercise(key); else refreshSendBoxes(key);
}
function loadComments(){
  if (!D.units.length) return;
  if (!API_URL || !token()) return;
  apiCall('workbook.mine', {url: location.href.split('#')[0]}).then(function(rows){
    rows.forEach(function(r){
      comments[r.exercise] = {comment: r.comment, commentAt: r.commentAt};
      if (!state.sent[r.exercise]) { state.sent[r.exercise] = r.submittedAt; save(); }
    });
    document.querySelectorAll('.send-box').forEach(function(b){ b.innerHTML = sendBox(b.getAttribute('data-ex')); });
    // Exercises finished before signing in are sent now.
    D.units.forEach(function(u){ u.exercises.forEach(function(ex, k){
      var key = u.num + '-' + (k + 1);
      if (sendable(ex) && !state.sent[key] && finished(key)) sendExercise(key);
    }); });
  }).catch(function(){});
}

function renderUnit(u, part){
  var parts = [['ly-thuyet', u.theory.length ? 'A. Theory' : 'Introduction']].concat(u.exercises.map(function(_, k){ return ['bai-tap-' + (k + 1), 'Exercise ' + (k + 1)]; }));
  if (!parts.some(function(p){ return p[0] === part; })) part = 'ly-thuyet';
  var s = '<h2>' + esc(unitTitle(u)) + '</h2>';
  s += '<div class="subnav" role="group" aria-label="Unit sections">' + parts.map(function(p){
    var n = p[0] === 'ly-thuyet' ? '' : (function(){ var k = +p[0].slice(-1), all = u.exercises[k - 1].items.map(function(it){ return u.num + '-' + k + '-' + it.n; }); return ' <small>' + all.filter(isDone).length + '/' + all.length + '</small>'; })();
    return '<a class="chip" style="text-decoration:none" href="#' + p[0] + '" aria-pressed="' + (p[0] === part) + '">' + p[1] + n + '</a>';
  }).join('') + '<span class="filter-label">Level:</span>' +
    [[0, 'All'], [1, '● 5.0-6.0'], [2, '●● 6.0-6.5'], [3, '●●● 7.0-7.5']].map(function(f){
      return '<button type="button" class="chip" data-filter="' + f[0] + '" aria-pressed="' + (filter === f[0]) + '">' + f[1] + '</button>';
    }).join('') + '</div>';
  s += part === 'ly-thuyet' ? renderTheory(u) : renderExercise(u, +part.slice(-1));
  var i = parts.findIndex(function(p){ return p[0] === part; });
  if (i < parts.length - 1) s += '<p style="text-align:right"><a class="btn primary" style="text-decoration:none;display:inline-block" href="#' + parts[i + 1][0] + '">Next: ' + parts[i + 1][1] + ' →</a></p>';
  return s;
}

function render(){
  var r = route();
  document.querySelectorAll('#tabs a').forEach(function(a){
    if (a.getAttribute('href') === '#' + r.tab.id) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
  });
  var m = $('#main');
  if (!D.units.length) { m.innerHTML = renderIndex(); $('.progress-all').style.display = 'none'; return; }
  m.innerHTML = renderUnit(r.tab.unit, r.part);
  updateProgress();
}
function rerenderItem(id){
  var old = document.querySelector('.item[data-id="' + id + '"]'), p = id.split('-');
  var tmp = document.createElement('div');
  var item = findItem(id);
  tmp.innerHTML = renderItem(item, id, D.units.find(function(x){ return String(x.num) === p[0]; }).exercises[+p[1] - 1].items.indexOf(item));
  old.replaceWith(tmp.firstChild);
  updateProgress();
  var chip = document.querySelector('.subnav a[aria-pressed="true"] small');
  if (chip) { var ex = D.units.find(function(x){ return String(x.num) === p[0]; }).exercises[+p[1] - 1];
    chip.textContent = ex.items.filter(function(it){ return isDone(p[0] + '-' + p[1] + '-' + it.n); }).length + '/' + ex.items.length; }
}

/* ---------- events ---------- */
var lastTab = route().tab.id;
window.addEventListener('hashchange', function(){
  render();
  var t = route().tab.id;
  window.scrollTo(0, t === lastTab ? Math.min(window.scrollY, $('nav.tabs').offsetTop) : 0);
  lastTab = t;
});
$('#main').addEventListener('click', function(e){
  var b, id;
  if ((b = e.target.closest('[data-filter]'))) { filter = +b.getAttribute('data-filter'); var y = window.scrollY; render(); window.scrollTo(0, y); return; }
  if ((b = e.target.closest('[data-submit]'))) {
    id = b.getAttribute('data-submit');
    var t = document.getElementById('t-' + id).value.trim(), tt = document.getElementById('t-' + id + '~t');
    if (!t || (tt && !tt.value.trim())) return;
    if (tt) { t = 'Translation: ' + tt.value.trim() + '\nRewrite: ' + t; delete state.draft[id + '~t']; }
    var changed = state.sub[id] !== t;
    state.sub[id] = t; delete state.draft[id]; save(); rerenderItem(id);
    var a = document.getElementById('a-' + id); if (a) a.scrollIntoView({block: 'nearest'});
    var f = (state.fb || {})[id];
    if (!f || f.for !== t || f.kind !== 'ai') assess(findItem(id), id);
    if (changed) afterAnswer(id);
    return;
  }
  if ((b = e.target.closest('[data-choose]'))) {
    id = b.getAttribute('data-choose');
    var r = document.querySelector('input[name="c-' + id + '"]:checked');
    if (!r) return;
    var changedChoice = state.choice[id] !== r.value;
    state.choice[id] = r.value; save(); rerenderItem(id);
    if (changedChoice) afterAnswer(id);
    return;
  }
  if ((b = e.target.closest('[data-send]'))) { sendExercise(b.getAttribute('data-send')); return; }
  if ((b = e.target.closest('[data-see]'))) {
    id = b.getAttribute('data-see');
    if (state.seen[id]) delete state.seen[id]; else state.seen[id] = 1;
    save(); rerenderItem(id);
  }
});
$('#main').addEventListener('change', function(e){
  var t = e.target;
  if (t.matches('input[type="radio"]')) {
    var id = t.name.slice(2), btn = document.querySelector('[data-choose="' + id + '"]');
    if (btn) btn.disabled = false;
  }
});
$('#main').addEventListener('input', function(e){
  var t = e.target;
  if (t.matches('[data-text]')) {
    var id = t.getAttribute('data-text');
    state.draft[id] = t.value; save();
    var base = id.replace(/~t$/, ''), btn = document.querySelector('[data-submit="' + base + '"]');
    var all = [document.getElementById('t-' + base), document.getElementById('t-' + base + '~t')].filter(Boolean);
    if (btn) btn.disabled = !all.every(function(x){ return x.value.trim(); });
  }
});
render();
loadComments();
})();
</script>
