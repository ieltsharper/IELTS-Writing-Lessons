ted. Keep the same meaning and type of conditional.<\/i>"], "items": [{"level": 1, "n": 0, "cue": "If the government raised taxes on fuel, people would drive less.", "hint": "Were + S + to V", "answer": "Were the government to raise taxes on fuel, people would drive less.", "alt": "Were fuel taxes to rise, people would drive less.", "kind": "write"}, {"level": 1, "n": 1, "cue": "If the city had invested earlier, congestion would have been less severe.", "hint": "Had + S + V3", "answer": "Had the city invested earlier, congestion would have been less severe.", "alt": "Had the city invested in public transport earlier, congestion would have been less severe.", "kind": "write"}, {"level": 1, "n": 2, "cue": "If any problems arise, the school will contact parents.", "hint": "Should", "answer": "Should any problems arise, the school will contact parents.", "alt": "Should problems arise, parents will be contacted.", "kind": "write"}, {"level": 1, "n": 3, "cue": "If it were not for tourism, many villages would be empty.", "hint": "Were it not for", "answer": "Were it not for tourism, many villages would be empty.", "alt": "Were it not for tourism, many villages would be deserted.", "kind": "write"}, {"level": 1, "n": 4, "cue": "If it had not been for vaccines, millions more people would have died.", "hint": "Had it not been for", "answer": "Had it not been for vaccines, millions more people would have died.", "alt": "Had it not been for vaccination, millions more people would have died.", "kind": "write"}, {"level": 1, "n": 5, "cue": "Were public transport free, more people would use it.", "hint": "→ normal if-sentence", "answer": "If public transport were free, more people would use it.", "alt": "If public transport were free of charge, more people would use it.", "kind": "write"}, {"level": 1, "n": 6, "cue": "Had the government acted sooner, fewer jobs would have been lost.", "hint": "→ normal if-sentence", "answer": "If the government had acted sooner, fewer jobs would have been lost.", "alt": "If the government had acted earlier, fewer jobs would have been lost.", "kind": "write"}, {"level": 2, "n": 7, "cue": "If the government did not subsidise farmers, many would go out of business.", "hint": "Were + S + not to V", "answer": "Were the government not to subsidise farmers, many would go out of business.", "alt": "Were the state not to subsidise farmers, many would go out of business.", "kind": "write"}, {"level": 2, "n": 8, "cue": "If the factory had not closed, the town would have kept its jobs.", "hint": "Had + S + not + V3", "answer": "Had the factory not closed, the town would have kept its jobs.", "alt": "Had the factory remained open, the town would have kept its jobs.", "kind": "write"}, {"level": 2, "n": 9, "cue": "Without international aid, the disaster would have been far worse.", "hint": "But for", "answer": "But for international aid, the disaster would have been far worse.", "alt": "Had it not been for international aid, the disaster would have been far worse.", "kind": "write"}, {"level": 2, "n": 10, "cue": "If I had learned English as a child, I would be more confident now.", "hint": "Had (mixed)", "answer": "Had I learned English as a child, I would be more confident now.", "alt": "Had I started learning English as a child, I would feel more confident now.", "kind": "write"}, {"level": 2, "n": 11, "cue": "If more young people choose vocational training, skills shortages may ease.", "hint": "Should", "answer": "Should more young people choose vocational training, skills shortages may ease.", "alt": "Should vocational training become more popular, skills shortages may ease.", "kind": "write"}, {"level": 2, "n": 12, "cue": "If cars were banned from the city centre, the air would be cleaner.", "hint": "Were + S + to be + V3", "answer": "Were cars to be banned from the city centre, the air would be cleaner.", "alt": "Were the government to ban cars from the city centre, the air would be cleaner.", "kind": "write"}, {"level": 2, "n": 13, "cue": "Should the economy slow down, unemployment may rise.", "hint": "→ normal if-sentence", "answer": "If the economy slows down, unemployment may rise.", "alt": "If economic growth slows, unemployment may rise.", "kind": "write"}, {"level": 3, "n": 14, "cue": "If it were not for the Internet, many students in rural areas would have no access to good teaching.", "hint": "But for", "answer": "But for the Internet, many students in rural areas would have no access to good teaching.", "alt": "Were it not for the Internet, many rural students would have no access to good teaching.", "kind": "write"}, {"level": 3, "n": 15, "cue": "If the river had been protected, the fish would still be there today.", "hint": "Had (mixed, passive)", "answer": "Had the river been protected, the fish would still be there today.", "alt": "Had the river been protected from pollution, fish would still live there today.", "kind": "write"}, {"level": 3, "n": 16, "cue": "If schools did not teach practical skills, many students would leave unprepared for life.", "hint": "Were + S + not to V", "answer": "Were schools not to teach practical skills, many students would leave unprepared for life.", "alt": "Were schools not to offer practical skills lessons, many students would leave unprepared for life.", "kind": "write"}, {"level": 3, "n": 17, "cue": "If governments had not introduced seat-belt laws, many more people would have died on the roads.", "hint": "Had it not been for + N", "answer": "Had it not been for seat-belt laws, many more people would have died on the roads.", "alt": "But for seat-belt laws, many more people would have died on the roads.", "kind": "write"}, {"level": 3, "n": 18, "cue": "If the government decides to raise the retirement age, older workers will need retraining.", "hint": "Should", "answer": "Should the government decide to raise the retirement age, older workers will need retraining.", "alt": "Should the retirement age be raised, older workers will need retraining.", "kind": "write"}, {"level": 3, "n": 19, "cue": "If it were not for their parents' support, many young adults could not afford to rent a flat.", "hint": "Were it not for", "answer": "Were it not for their parents' support, many young adults could not afford to rent a flat.", "alt": "But for their parents' support, many young adults could not afford to rent a flat.", "kind": "write"}]}, {"title": "Exercise 2 — Translate, then rewrite", "intro": ["<i>Translate each sentence into natural English. Then rewrite your translation using the given structure. ● sentences give keywords; ●● and ●●● sentences give only the structure.<\/i>"], "items": [{"level": 1, "n": 0, "cue": "Nếu chính phủ tăng thuế nhiên liệu, người dân sẽ lái xe ít hơn.", "kind": "translate", "rewriteWith": "<b>Were + S + to V<\/b>", "translation": "If the government increased fuel tax, people would drive less.", "answer": "<b>Were the government to raise fuel taxes, people would drive less.<\/b>", "alt": "Were fuel taxes to rise, people would drive less."}, {"level": 1, "n": 1, "cue": "Nếu thành phố đầu tư sớm hơn, tình trạng ùn tắc đã bớt nghiêm trọng.", "kind": "translate", "rewriteWith": "<b>Had + S + V3<\/b>", "translation": "If the city had invested earlier, traffic jams would have been less serious.", "answer": "<b>Had the city invested earlier, congestion would have been less severe.<\/b>", "alt": "Had the city invested sooner, congestion would not have become so severe."}, {"level": 1, "n": 2, "cue": "Nếu không có du lịch, nhiều ngôi làng sẽ trở nên vắng vẻ.", "kind": "translate", "rewriteWith": "<b>Were it not for<\/b>", "translation": "If there were no tourism, many villages would be empty.", "answer": "<b>Were it not for tourism, many villages would be empty.<\/b>", "alt": "But for tourism, many villages would be deserted."}, {"level": 1, "n": 3, "cue": "Nếu không nhờ vắc-xin, hàng triệu người nữa đã tử vong.", "kind": "translate", "rewriteWith": "<b>Had it not been for<\/b>", "translation": "Without vaccines, millions more people would have died.", "answer": "<b>Had it not been for vaccines, millions more people would have died.<\/b>", "alt": "But for vaccines, millions more people would have died."}, {"level": 1, "n": 4, "cue": "Nếu có vấn đề phát sinh, nhà trường sẽ liên hệ với phụ huynh.", "kind": "translate", "rewriteWith": "<b>Should<\/b>", "translation": "If any problems happen, the school will contact parents.", "answer": "<b>Should any problems arise, the school will contact parents.<\/b>", "alt": "Should problems arise, parents will be contacted."}, {"level": 1, "n": 5, "cue": "Nếu nhà máy không đóng cửa, thị trấn đã giữ được việc làm.", "kind": "translate", "rewriteWith": "<b>Had + S + not + V3<\/b>", "translation": "If the factory had not closed, the town would have kept the jobs.", "answer": "<b>Had the factory not closed, the town would have kept its jobs.<\/b>", "alt": "Had the factory remained open, the town would have kept its jobs."}, {"level": 1, "n": 6, "cue": "Nếu không có viện trợ quốc tế, thảm họa đã tồi tệ hơn nhiều.", "kind": "translate", "rewriteWith": "<b>But for<\/b>", "translation": "Without international aid, the disaster would have been much worse.", "answer": "<b>But for international aid, the disaster would have been far worse.<\/b>", "alt": "Had it not been for international aid, the disaster would have been far worse."}, {"level": 2, "n": 7, "cue": "Nếu tôi học tiếng Anh từ nhỏ, bây giờ tôi đã tự tin hơn.", "kind": "translate", "rewriteWith": "<b>Had (mixed)<\/b>", "translation": "I did not learn English as a child, so I am not confident now.", "answer": "<b>Had I learned English as a child, I would be more confident now.<\/b>", "alt": "Had I started learning English as a child, I would feel more confident now."}, {"level": 2, "n": 8, "cue": "Nếu chính phủ không trợ cấp cho nông dân, nhiều người sẽ phá sản.", "kind": "translate", "rewriteWith": "<b>Were + S + not to V<\/b>", "translation": "If the government did not give subsidies to farmers, many would go bankrupt.", "answer": "<b>Were the government not to subsidise farmers, many would go out of business.<\/b>", "alt": "Were it not for government subsidies, many farmers would go out of business."}, {"level": 2, "n": 9, "cue": "Nếu nhiều người trẻ chọn học nghề hơn, tình trạng thiếu kỹ năng có thể giảm bớt.", "kind": "translate", "rewriteWith": "<b>Should<\/b>", "translation": "If more young people choose vocational training, the skills shortage may decrease.", "answer": "<b>Should more young people choose vocational training, skills shortages may ease.<\/b>", "alt": "Should vocational training become more popular, skills shortages may ease."}, {"level": 2, "n": 10, "cue": "Nếu ô tô bị cấm ở trung tâm thành phố, không khí sẽ sạch hơn.", "kind": "translate", "rewriteWith": "<b>Were + S + to be + V3<\/b>", "translation": "If cars were banned in the city centre, the air would be cleaner.", "answer": "<b>Were cars to be banned from the city centre, the air would be cleaner.<\/b>", "alt": "Were the government to ban cars from the city centre, the air would be cleaner."}, {"level": 2, "n": 11, "cue": "Nếu không có Internet, nhiều học sinh ở nông thôn sẽ không được tiếp cận việc giảng dạy tốt.", "kind": "translate", "rewriteWith": "<b>But for<\/b>", "translation": "Without the Internet, many students in the countryside would not have access to good teaching.", "answer": "<b>But for the Internet, many rural students would have no access to good teaching.<\/b>", "alt": "Were it not for the Internet, many rural students would have no access to good teaching."}, {"level": 2, "n": 12, "cue": "Nếu con sông được bảo vệ, cá vẫn còn ở đó đến ngày nay.", "kind": "translate", "rewriteWith": "<b>Had (mixed, passive)<\/b>", "translation": "The river was not protected, so there are no fish there today.", "answer": "<b>Had the river been protected, the fish would still be there today.<\/b>", "alt": "Had the river been protected from pollution, fish would still live there today."}, {"level": 2, "n": 13, "cue": "Nếu không có luật thắt dây an toàn, nhiều người hơn đã tử vong trên đường.", "kind": "translate", "rewriteWith": "<b>Had it not been for<\/b>", "translation": "Without seat-belt laws, more people would have died on the roads.", "answer": "<b>Had it not been for seat-belt laws, many more people would have died on the roads.<\/b>", "alt": "But for seat-belt laws, many more people would have died on the roads."}, {"level": 3, "n": 14, "cue": "Nếu chính phủ quyết định tăng tuổi nghỉ hưu, người lao động lớn tuổi sẽ cần được đào tạo lại.", "kind": "translate", "rewriteWith": "<b>Should<\/b>", "translation": "If the government decides to increase the retirement age, older workers will need to be retrained.", "answer": "<b>Should the government decide to raise the retirement age, older workers will need retraining.<\/b>", "alt": "Should the retirement age be raised, older workers will need retraining."}, {"level": 3, "n": 15, "cue": "Nếu không có sự hỗ trợ của cha mẹ, nhiều người trẻ không đủ khả năng thuê nhà.", "kind": "translate", "rewriteWith": "<b>Were it not for<\/b>", "translation": "Without their parents' help, many young people could not afford to rent a flat.", "answer": "<b>Were it not for their parents' support, many young adults could not afford to rent a flat.<\/b>", "alt": "But for their parents' support, many young adults could not afford to rent."}, {"level": 3, "n": 16, "cue": "Nếu trường học không dạy kỹ năng thực tế, nhiều học sinh sẽ ra trường mà không sẵn sàng cho cuộc sống.", "kind": "translate", "rewriteWith": "<b>Were + S + not to V<\/b>", "translation": "If schools did not teach practical skills, many students would leave school not ready for life.", "answer": "<b>Were schools not to teach practical skills, many students would leave unprepared for life.<\/b>", "alt": "Were schools not to offer practical skills lessons, many students would leave unprepared for life."}, {"level": 3, "n": 17, "cue": "Nếu chính phủ hành động sớm hơn, đã có ít việc làm bị mất hơn.", "kind": "translate", "rewriteWith": "<b>Had<\/b>", "translation": "If the government had acted sooner, fewer jobs would have been lost.", "answer": "<b>Had the government acted sooner, fewer jobs would have been lost.<\/b>", "alt": "Had the government acted earlier, fewer jobs would have been lost."}, {"level": 3, "n": 18, "cue": "Nếu giá nhà tiếp tục tăng, nhiều gia đình trẻ có thể phải rời thành phố.", "kind": "translate", "rewriteWith": "<b>Should<\/b>", "translation": "If house prices continue rising, many young families may have to leave the city.", "answer": "<b>Should house prices continue to rise, many young families may have to leave the city.<\/b>", "alt": "Should property prices keep rising, many young families may be forced to leave the city."}, {"level": 3, "n": 19, "cue": "Nếu không nhờ những tiến bộ y học, tuổi thọ con người đã không tăng đáng kể như vậy.", "kind": "translate", "rewriteWith": "<b>Had it not been for<\/b>", "translation": "Without medical advances, life expectancy would not have increased so much.", "answer": "<b>Had it not been for medical advances, life expectancy would not have risen so significantly.<\/b>", "alt": "But for medical advances, life expectancy would not have risen so sharply."}]}, {"title": "Exercise 3 — Find and correct the errors", "intro": ["<i>Some sentences are correct; others have one or more errors. (a) Name the criterion for each error (TR, CC, LR or GRA). (b) Write the correction. (c) Tick ✓ if the sentence is correct.<\/i>"], "items": [{"level": 1, "n": 0, "kind": "fix", "cue": "Had the city invest earlier, congestion would have been less severe.", "answer": "Had the city <s>invest<\/s><b> INVESTED<\/b> earlier, congestion would have been less severe.", "notes": ["<span class=\"tag GRA\">GRA<\/span> Sau <i>Had<\/i> + chủ ngữ dùng V3."]}, {"level": 1, "n": 1, "kind": "fix", "cue": "Were the government bans cars, air quality would improve.", "answer": "<s>Were the government bans<\/s><b> WERE THE GOVERNMENT TO BAN<\/b> cars, air quality would improve.", "notes": ["<span class=\"tag GRA\">GRA<\/span> <i>Were<\/i> + S + <i>to<\/i> + V nguyên mẫu."]}, {"level": 1, "n": 2, "kind": "fix", "cue": "If had the city invested earlier, congestion would have eased.", "answer": "<s>If had<\/s><b> HAD<\/b> the city invested earlier, congestion would have eased.", "notes": ["<span class=\"tag GRA\">GRA<\/span> Câu đảo bỏ <i>if<\/i>."]}, {"level": 1, "n": 3, "kind": "fix", "cue": "Were it not for tourism, many villages would be empty.", "answer": "<b>✓ <\/b>Were it not for tourism, many villages would be empty.", "notes": ["Đúng: <i>Were it not for<\/i> + danh từ, <i>would<\/i> + V."]}, {"level": 1, "n": 4, "kind": "fix", "cue": "Hadn't the government acted, more jobs would have been lost.", "answer": "<s>Hadn't the government acted<\/s><b> HAD THE GOVERNMENT NOT ACTED<\/b>, more jobs would have been lost.", "notes": ["<span class=\"tag GRA\">GRA<\/span> Không viết tắt; <i>not<\/i> đứng sau chủ ngữ."]}, {"level": 1, "n": 5, "kind": "fix", "cue": "Should the government will raise taxes, consumption may fall.", "answer": "Should the government <s>will raise<\/s><b> RAISE<\/b> taxes, consumption may fall.", "notes": ["<span class=\"tag GRA\">GRA<\/span> Sau <i>Should<\/i> + chủ ngữ dùng V nguyên mẫu."]}, {"level": 1, "n": 6, "kind": "fix", "cue": "Were it not for tourism, many villages would have been empty now.", "answer": "Were it not for tourism, many villages <s>would have been empty now<\/s><b> WOULD BE EMPTY NOW<\/b>.", "notes": ["<span class=\"tag GRA\">GRA<\/span> Nói về hiện tại → <i>would<\/i> + V."]}, {"level": 2, "n": 7, "kind": "fix", "cue": "Had it not been for vaccines, millions more people would have died.", "answer": "<b>✓ <\/b>Had it not been for vaccines, millions more people would have died.", "notes": ["Đúng: giả định trong quá khứ."]}, {"level": 2, "n": 8, "kind": "fix", "cue": "Had not the factory closed, the town would have kept its jobs.", "answer": "<s>Had not the factory closed<\/s><b> HAD THE FACTORY NOT CLOSED<\/b>, the town would have kept its jobs.", "notes": ["<span class=\"tag GRA\">GRA<\/span> <i>not<\/i> đứng sau chủ ngữ."]}, {"level": 2, "n": 9, "kind": "fix", "cue": "But for international aid, the disaster will be far worse.", "answer": "But for international aid, the disaster <s>will be<\/s><b> WOULD HAVE BEEN<\/b> far worse.", "notes": ["<span class=\"tag GRA\">GRA<\/span> <i>But for<\/i> + giả định quá khứ → <i>would have<\/i> + V3."]}, {"level": 2, "n": 10, "kind": "fix", "cue": "Were public transport free, more people will use it.", "answer": "Were public transport free, more people <s>will use<\/s><b> WOULD USE<\/b> it.", "notes": ["<span class=\"tag GRA\">GRA<\/span> <i>Were<\/i> (loại 2) → <i>would<\/i> + V."]}, {"level": 2, "n": 11, "kind": "fix", "cue": "Should any problems arise, the school will contact parents.", "answer": "<b>✓ <\/b>Should any problems arise, the school will contact parents.", "notes": ["Đúng: <i>Should<\/i> + S + V, <i>will<\/i> + V."]}, {"level": 2, "n": 12, "kind": "fix", "cue": "Had I learned English as a child, I would have been more confident now.", "answer": "Had I learned English as a child, I <s>would have been<\/s><b> WOULD BE<\/b> more confident now.", "notes": ["<span class=\"tag GRA\">GRA<\/span> Câu hỗn hợp: kết quả ở hiện tại (<i>now<\/i>)."]}, {"level": 2, "n": 13, "kind": "fix", "cue": "Were it not for the Internet, rural students would had no access to good teaching.", "answer": "Were it not for the Internet, rural students <s>would had<\/s><b> WOULD HAVE<\/b> no access to good teaching.", "notes": ["<span class=\"tag GRA\">GRA<\/span> Sau <i>would<\/i> dùng V nguyên mẫu."]}, {"level": 3, "n": 14, "kind": "fix", "cue": "Were cars to banned from the centre, the air would be cleaner.", "answer": "Were cars <s>to banned<\/s><b> TO BE BANNED<\/b> from the centre, the air would be cleaner.", "notes": ["<span class=\"tag GRA\">GRA<\/span> Bị động: <i>to be<\/i> + V3."]}, {"level": 3, "n": 15, "kind": "fix", "cue": "Had the river been protected, the fish would still be there today.", "answer": "<b>✓ <\/b>Had the river been protected, the fish would still be there today.", "notes": ["Đúng: câu hỗn hợp, bị động."]}, {"level": 3, "n": 16, "kind": "fix", "cue": "Had it not for seat-belt laws, more people would have died.", "answer": "<s>Had it not for<\/s><b> HAD IT NOT BEEN FOR<\/b> seat-belt laws, more people would have died.", "notes": ["<span class=\"tag GRA\">GRA<\/span> Thiếu <i>been<\/i>: <i>Had it not been for<\/i> + N."]}, {"level": 3, "n": 17, "kind": "fix", "cue": "Should house prices continuing to rise, families may leave the city.", "answer": "Should house prices <s>continuing<\/s><b> CONTINUE<\/b> to rise, families may leave the city.", "notes": ["<span class=\"tag GRA\">GRA<\/span> Sau <i>Should<\/i> + chủ ngữ dùng V nguyên mẫu."]}, {"level": 3, "n": 18, "kind": "fix", "cue": "Were schools not to teach practical skills, many students would leave unprepared.", "answer": "<b>✓ <\/b>Were schools not to teach practical skills, many students would leave unprepared.", "notes": ["Đúng: <i>Were<\/i> + S + <i>not to<\/i> + V."]}, {"level": 3, "n": 19, "kind": "fix", "cue": "Had the government acted sooner, all jobs would have been saved and nobody would have suffered.", "answer": "Had the government acted sooner, <s>all jobs would have been saved<\/s><b> MANY JOBS COULD HAVE BEEN SAVED<\/b> and <s>nobody would have suffered<\/s><b> FEWER FAMILIES WOULD HAVE SUFFERED<\/b>.", "notes": ["<span class=\"tag TR\">TR<\/span> Tuyệt đối hóa (<i>all<\/i>); dùng <i>many<\/i> và <i>could<\/i>.", "<span class=\"tag TR\">TR<\/span> Tuyệt đối hóa (<i>nobody<\/i>)."]}]}, {"title": "Exercise 4 — Apply to real exam prompts", "intro": ["<i>For each prompt, write one sentence (●, ●●) using the suggested inverted conditional, or two sentences (●●●) using two different inverted forms.<\/i>"], "items": [{"level": 1, "n": 0, "cue": "City development · Agree/disagree", "prompt": "<i>It is important for every town and city to have large public spaces such as squares and parks. To what extent do you agree or disagree?<\/i>", "hint": "Were + S + to V", "answer": "Were every city to provide large parks, residents would have more opportunities to exercise and socialise.", "kind": "write"}, {"level": 1, "n": 1, "cue": "Education · Agree/disagree", "prompt": "<i>It is important for children to have lessons outside the classroom by visiting places such as local businesses and public buildings. To what extent do you agree or disagree?<\/i>", "hint": "Should", "answer": "Should schools organise visits to local businesses, children will see how classroom knowledge is used in real life.", "kind": "write"}, {"level": 1, "n": 2, "cue": "Education · Agree/disagree", "prompt": "<i>Unemployment is becoming increasingly serious in many countries. Some people believe that primary education is enough for students, while others think secondary education is necessary. To what extent do you agree or disagree?<\/i>", "hint": "Were it not for", "answer": "Were it not for secondary education, many young people would lack the skills employers require.", "kind": "write"}, {"level": 1, "n": 3, "cue": "Education · Agree/disagree", "prompt": "<i>Some people believe that schools should stop using books because children find them boring and should use films, television and computers instead. To what extent do you agree or disagree?<\/i>", "hint": "Were + S + to V", "answer": "Were schools to stop using books, children might lose the ability to concentrate on long texts.", "kind": "write"}, {"level": 1, "n": 4, "cue": "Education · Agree/disagree", "prompt": "<i>In some education systems, governments decide what subjects and lesson content students should study. Some people believe teachers should make these decisions instead. To what extent do you agree or disagree?<\/i>", "hint": "Should", "answer": "Should teachers decide lesson content, lessons could be better adapted to students' needs.", "kind": "write"}, {"level": 1, "n": 5, "cue": "Travelling and tourism · Agree/disagree", "prompt": "<i>The traditional lifestyles of local people in developing countries can attract tourists, but tourism may prevent these communities from adopting more modern ways of life. To what extent do you agree or disagree?<\/i>", "hint": "Were it not for", "answer": "Were it not for tourism, some traditional crafts would already have disappeared.", "kind": "write"}, {"level": 1, "n": 6, "cue": "Art and museums · Agree/disagree", "prompt": "<i>Governments should spend more money on public services than on the arts, such as music and painting. To what extent do you agree or disagree?<\/i>", "hint": "But for", "answer": "But for public funding, many orchestras and theatres would have to close.", "kind": "write"}, {"level": 2, "n": 7, "cue": "Environment · Agree/disagree", "prompt": "<i>Some people believe that air travel should be restricted because it causes pollution and uses large amounts of the world's fuel resources. To what extent do you agree or disagree?<\/i>", "hint": "Were + S + to be + V3", "answer": "Were air travel to be restricted, millions of people would lose access to affordable international travel.", "kind": "write"}, {"level": 2, "n": 8, "cue": "Education · Discuss both views", "prompt": "<i>Some people believe that governments should provide free public libraries in every town, while others think this is a waste of money because people can access information online. Discuss both views and give your own opinion.<\/i>", "hint": "Were it not for", "answer": "Were it not for free public libraries, many low-income families would have no access to books or computers.", "kind": "write"}, {"level": 2, "n": 9, "cue": "Government, politics and diplomacy · Discuss both views", "prompt": "<i>Some people believe that rich countries should give aid to all poorer countries, while others think that aid should not be given to countries where corruption is common. Discuss both views and give your own opinion.<\/i>", "hint": "Should", "answer": "Should aid be given to corrupt governments, much of it may never reach those in need.", "kind": "write"}, {"level": 2, "n": 10, "cue": "Work · Discuss both views", "prompt": "<i>Some people believe that job satisfaction is more important than job security, while others think having a secure, permanent job is more important. Discuss both views and give your own opinion.<\/i>", "hint": "Had (mixed)", "answer": "Had more people chosen jobs they enjoy rather than secure ones, they might feel more fulfilled today.", "kind": "write"}, {"level": 2, "n": 11, "cue": "Food and health · Discuss both views", "prompt": "<i>Some people prefer to use gyms and health clubs to stay healthy, while others think everyday activities such as walking and climbing stairs are more effective. Discuss both views and give your own opinion.<\/i>", "hint": "Were + S + to V", "answer": "Were people to walk or cycle to work, they would not need expensive gym memberships.", "kind": "write"}, {"level": 2, "n": 12, "cue": "Socio-cultural and global issues · Discuss both views", "prompt": "<i>Some people believe that the amount of noise people make should be strictly controlled, while others think people should be free to make as much noise as they want. Discuss both views and give your own opinion.<\/i>", "hint": "But for", "answer": "But for noise regulations, residents near busy roads would struggle to sleep.", "kind": "write"}, {"level": 2, "n": 13, "cue": "Media and communication · Causes/problems/solutions", "prompt": "<i>Studies show that children spend more time watching television than in the past and less time doing active or creative activities. Why is this happening, and what can be done to encourage children to be more active and creative?<\/i>", "hint": "Had it not been for", "answer": "Had it not been for the rise of streaming services, children might still spend more time playing outdoors.", "kind": "write"}, {"level": 3, "n": 14, "cue": "Travelling and tourism · Causes/problems/solutions", "prompt": "<i>International travel can sometimes make people more prejudiced rather than more open-minded. Why might this happen, and what can be done to reduce this problem?<\/i>", "hint": "Two sentences, each using a different inverted conditional form.", "answer": "Were travellers to learn about local customs before visiting, misunderstandings would be less likely. Should they stay only in tourist resorts, however, their prejudices may remain unchallenged.", "kind": "write"}, {"level": 3, "n": 15, "cue": "City development · Advantages/disadvantages", "prompt": "<i>Some governments encourage businesses to move from cities to rural areas. Do the advantages of this policy outweigh the disadvantages?<\/i>", "hint": "Two sentences, each using a different inverted conditional form.", "answer": "Were more businesses to move to rural areas, young people would not need to leave their villages for work. Had such policies been introduced earlier, many rural communities might not be in decline today.", "kind": "write"}, {"level": 3, "n": 16, "cue": "Economy, money and trade · Advantages/disadvantages", "prompt": "<i>It has become easy for people to obtain credit cards, but some users have difficulty repaying their debts. Do the advantages of easy access to credit cards outweigh the disadvantages?<\/i>", "hint": "Two sentences, each using a different inverted conditional form.", "answer": "Were it not for credit cards, many people would struggle to cover unexpected expenses. Should users borrow more than they can repay, however, they may fall into serious debt.", "kind": "write"}, {"level": 3, "n": 17, "cue": "Travelling and tourism · Positive/negative development", "prompt": "<i>It has become easier and more affordable for people to travel to other countries. Is this a positive or negative development?<\/i>", "hint": "Two sentences, each using a different inverted conditional form.", "answer": "Had travel not become so affordable, few young people would have the chance to experience other cultures. Were airlines to pay the full cost of their emissions, however, flights would be far more expensive.", "kind": "write"}, {"level": 3, "n": 18, "cue": "Work · Positive/negative development", "prompt": "<i>In some countries, it is illegal for employers to reject job applicants because of their age. Is this a positive or negative development?<\/i>", "hint": "Two sentences, each using a different inverted conditional form.", "answer": "Were it not for age discrimination laws, many older applicants would be rejected without consideration. Should employers have to justify every decision, however, hiring could become slower.", "kind": "write"}, {"level": 3, "n": 19, "cue": "Age, generation and gender · Two-part question", "prompt": "<i>In schools and universities, girls often choose arts subjects while boys are more likely to choose science subjects. Why does this happen, and should this trend be changed?<\/i>", "hint": "Two sentences, each using a different inverted conditional form.", "answer": "Were girls to receive more encouragement in science, the gender gap in these subjects would narrow. Had schools challenged these stereotypes earlier, more women might be working as engineers today.", "kind": "write"}]}], "after": []}], "parts": [], "guide": [], "index": []}</script>
<script type="application/json" id="audio">{}</script>
<script>
(function(){
'use strict';
var D = JSON.parse(document.getElementById('data').textContent);
var STORE = 'wt2-17';
var state = load();
function blank(){ return {draft:{}, sub:{}, choice:{}, seen:{}, sent:{}, dirty:{}, fb:{}}; }
function load(){ try { var s = JSON.parse(localStorage.getItem(STORE)); return s && s.sub ? s : blank(); } catch(e){ return blank(); } }
function save(){ try { localStorage.setItem(STORE, JSON.stringify(state)); } catch(e){} }

var $ = function(s, r){ return (r||document).querySelector(s); };
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function dots(n){ return n ? '<span class="lv" title="Level ' + n + '">' + '●'.repeat(n) + '</span>' : ''; }
function textOf(html){ var t = document.createElement('div'); t.innerHTML = html; return t.textContent; }

/* ---------- recorded audio for the English examples (audio/<id>.mp3, made by make_audio.py) ---------- */
var AUDIO = JSON.parse(document.getElementById('audio').textContent);
var player = new Audio(), playing = null;
function speakBtn(text){
  var id = AUDIO[text];
  if (!id) return '';
  return '<button type="button" class="speak" data-audio="' + id + '" aria-label="Listen: ' + esc(text) + '" title="Listen">🔊</button>';
}
function stopAudio(){ player.pause(); if (playing) playing.classList.remove('on'); playing = null; }
player.addEventListener('ended', stopAudio);
document.addEventListener('click', function(e){
  var b = e.target.closest('[data-audio]'); if (!b) return;
  var again = playing === b;
  stopAudio();
  if (again) return;
  player.src = 'audio/' + b.getAttribute('data-audio') + '.mp3';
  playing = b; b.classList.add('on');
  player.play().catch(stopAudio);
});

/* ---------- progress ---------- */
function ids(u){ var out = []; u.exercises.forEach(function(ex, k){ ex.items.forEach(function(it){ out.push(u.num + '-' + (k + 1) + '-' + it.n); }); }); return out; }
function isDone(id){ return !!(state.sub[id] || state.choice[id] || state.seen[id]); }
var ALL = [].concat.apply([], D.units.map(ids));
function updateProgress(){
  var n = ALL.filter(isDone).length;
  $('#progressText').textContent = 'Done: ' + n + '/' + ALL.length + ' items';
  $('#progressBar').style.width = (100 * n / ALL.length) + '%';
}
$('#reset').addEventListener('click', function(){
  if (!confirm('Clear everything you wrote, submitted and chose in this browser?')) return;
  state = blank(); save(); render();
});

/* ---------- header and tabs ---------- */
// One page per unit; D.nav lists every page (index + units) for the tab bar.
$('#title').textContent = D.cover[0];
$('#cover').innerHTML = D.cover.slice(1).map(function(c, i, a){
  return '<p class="standfirst' + (i === a.length - 1 ? ' small' : '') + '">' + esc(c) + '</p>';
}).join('');
$('#tabs').innerHTML = D.nav.map(function(t){ return '<a href="' + t.href + '"' + (t.current ? ' aria-current="page"' : '') + '>' + esc(t.label) + '</a>'; }).join('');
function unitTitle(u){ return u.num === 'review' ? u.name : 'Unit ' + u.num + ' · ' + u.name; }

function route(){
  return {tab: {unit: D.units[0]}, part: location.hash.replace('#', '') || 'ly-thuyet'};
}
var filter = 0;

/* ---------- index page: all units with progress, then the guide ---------- */
function renderBlocks(list){
  var s = '', card = '', open = false;
  function flush(){ if (open) { card += '</ul>'; open = false; } if (card) s += '<div class="card">' + card + '</div>'; card = ''; }
  list.forEach(function(b){
    if (b.type === 'h1') { flush(); s += '<h2 style="margin-top:28px">' + esc(b.text) + '</h2>'; }
    else if (b.type === 'h') { flush(); card = '<h4>' + b.html + '</h4>'; }
    else if (b.type === 'li') { if (!open) { card += '<ul class="plain">'; open = true; } card += '<li>' + b.html + '</li>'; }
    else if (b.type === 'table') { flush(); s += renderTable(b); }
    else { if (open) { card += '</ul>'; open = false; } card += '<p>' + b.html + '</p>'; }
  });
  flush();
  return s;
}
function renderIndex(){
  var s = '<h2>Units</h2>';
  D.parts.forEach(function(p){
    s += '<p class="part-title">' + esc(p.title) + '</p><div class="boxes">' + p.units.map(function(n){
      var u = D.index.find(function(x){ return x.num === n; }), done = 0;
      try { var st = JSON.parse(localStorage.getItem(u.store)) || {}; done = Object.keys(Object.assign({}, st.sub, st.choice)).length; } catch(e){}
      return '<a class="card" style="text-decoration:none;color:inherit;display:block;margin:0" href="' + u.href + '"><h4 style="color:var(--heading)">' + esc(unitTitle(u)) + '</h4><span class="note">Done: ' + Math.min(done, u.count) + '/' + u.count + '</span></a>';
    }).join('') + '</div>';
  });
  return s + renderBlocks(D.guide);
}

/* ---------- theory ---------- */
function renderTable(b){
  var vocab = b.head[0] === 'Cụm từ' || b.head[0] === 'Phrase', speakLast = vocab || /câu trả lời mở rộng|extended answer/i.test(b.head[b.head.length - 1]);
  var rows = b.rows.filter(function(r){ return !filter || !r.level || r.level === filter; });
  return '<div class="tablewrap"><table><thead><tr>' + b.head.map(function(h){ return '<th scope="col">' + esc(h) + '</th>'; }).join('') + '</tr></thead><tbody>' +
    rows.map(function(r){
      return '<tr>' + r.cells.map(function(c, i){
        if (i === 0 && vocab) return '<td class="phrase">' + dots(r.level) + ' ' + c + '</td>';
        if (i === r.cells.length - 1 && speakLast) return '<td>' + c + speakBtn(textOf(c)) + '</td>';
        return '<td' + (vocab && i === 1 ? ' class="muted"' : '') + '>' + c + '</td>';
      }).join('') + '</tr>';
    }).join('') + '</tbody></table></div>';
}
function sampleSpeech(html){
  var t = textOf(html), i = t.indexOf(' → ');
  if (i >= 0) t = t.slice(i + 3);
  return t.replace(/\s*\([^)]*\)\s*$/, '').replace(/\s*\/[^\/\s]+\/\s*/g, ' ');
}
function renderTheory(u){
  var s = '', boxes = [];
  u.theory.concat(u.intro, u.after).forEach(function(b){
    if (b.type === 'sub') s += '<h3>' + esc(b.text) + '</h3>';
    else if (b.type === 'p') s += '<p>' + b.html + '</p>';
    else if (b.type === 'table') s += renderTable(b);
    else if (b.type === 'samples') s += '<div class="card">' + b.items.map(function(x){ return '<div class="sample">' + x + speakBtn(sampleSpeech(x)) + '</div>'; }).join('') + '</div>';
    else if (b.type === 'mistakes') boxes.push('<div class="card box"><h4>Lỗi cần tránh</h4>' + b.items.map(function(m){
      return '<div class="mistake"><div class="bad">' + m.bad + '</div><div class="good">' + m.good + '</div><div class="note">' + m.note + '</div></div>';
    }).join('') + '</div>');
    else if (b.type === 'choose') boxes.push('<div class="card box"><h4>Chọn cho đúng</h4>' + b.items.map(function(c){
      return '<div class="mistake"><div>' + c.h + '</div><div class="note">' + c.html + '</div></div>';
    }).join('') + '</div>');
    else if (b.type === 'sounds') boxes.push('<div class="card box"><h4>Âm cần luyện</h4>' + b.lines.map(function(l){ return '<p>' + l + '</p>'; }).join('') + '<p class="note">' + b.tip + '</p></div>');
  });
  // The first "Mục đích" block goes in a card.
  s = s.replace(/^<h3>Mục đích<\/h3>((?:<p>[\s\S]*?<\/p>)+)/, '<div class="card"><h4>Mục đích</h4>$1</div>');
  if (boxes.length) s += '<div class="boxes" style="margin-top:20px">' + boxes.join('') + '</div>';
  return s;
}

/* ---------- exercises ---------- */
var LINES = [['rewriteWith', 'Rewrite with'], ['hint', 'Hint']];
// The corrected sentence without the struck-through mistakes (error-correction keys).
function refText(h){ return textOf(String(h).replace(/<s>[\s\S]*?<\/s>/g, '')).replace(/\s+/g, ' ').trim(); }
function notesHtml(it){
  return (it.ref ? '<div style="margin-top:6px"><span class="ref">' + esc(it.ref) + '</span></div>' : '') +
    (it.notes || []).concat(it.note ? [it.note] : []).map(function(n){ return '<div class="note" style="margin-top:6px">' + n + '</div>'; }).join('');
}
function answerHtml(it, id){
  var s = '';
  if (state.sub[id]) s += '<div class="note">Your answer:</div><div class="mine" lang="en">' + esc(state.sub[id]) + '</div>' + feedbackHtml(it, id);
  if (it.translation) s += '<div class="main"><span class="label">Translation:</span> ' + it.translation + '</div>';
  s += '<div class="main">' + (it.suggest ? '<span class="label">Suggestion:</span> ' : it.translation ? '<span class="label">Rewrite:</span> ' : '<span class="label">Answer:</span> ') + it.answer + '</div>';
  if (it.alt) s += '<div class="alt"><span class="label">Also accepted:</span> ' + it.alt + '</div>';
  return s + notesHtml(it);
}
/* ---------- feedback on Submit: Gemini through the portal, or free quick checks ---------- */
var checking = {};
function feedbackHtml(it, id){
  var f = (state.fb || {})[id];
  if (checking[id]) return '<div class="fb"><div class="fb-head"><b>Feedback</b><span class="fb-small">Checking your answer…</span></div></div>';
  if (!f || f.for !== state.sub[id]) return '';
  if (f.kind === 'ai') {
    var r = f.data, tag = {great: 'Great', good: 'Good', needs_work: 'Needs work'}[r.verdict] || 'Good';
    var s = '<div class="fb ' + esc(r.verdict) + '" lang="en"><div class="fb-head"><b>Feedback</b><span class="fb-tag">' + tag + '</span></div><div>' + esc(r.feedback) + '</div>';
    if (r.corrections.length) s += '<ul>' + r.corrections.map(function(c){
      return '<li><span class="wrong">' + esc(c.wrong) + '</span> → <span class="right">' + esc(c.right) + '</span>' + (c.why ? ' <span class="fb-small">(' + esc(c.why) + ')</span>' : '') + '</li>';
    }).join('') + '</ul>';
    if (r.improved) s += '<div style="margin-top:6px"><span class="label">Better:</span> ' + esc(r.improved) + '</div>';
    return s + '<div class="fb-small">AI feedback; it can be wrong. Your teacher&rsquo;s comment is the final word.</div></div>';
  }
  var c = f.data;
  return '<div class="fb" lang="en"><div class="fb-head"><b>Quick checks</b></div><ul>' + c.list.map(function(x){
    return '<li>' + (x.ok ? '✓ ' : '✗ ') + esc(x.text) + '</li>';
  }).join('') + '</ul>' + (c.why ? '<div class="fb-small">' + esc(c.why) + '</div>' : '') + '</div>';
}
function words(t){ return (t.match(/[A-Za-z']+/g) || []); }
function sentences(t){ return t.split(/[.!?]+(?:\s|$)/).filter(function(x){ return x.trim(); }).length; }
function quickChecks(it, id){
  var a = state.sub[id], low = ' ' + a.toLowerCase().replace(/[^a-z' ]+/g, ' ').replace(/\s+/g, ' ') + ' ', list = [];
  // Lenient: each word of the phrase may change its ending (make → making, affect → affects).
  var has = function(p){
    var ws = p.toLowerCase().replace(/[^a-z' ]+/g, ' ').trim().split(/\s+/).filter(Boolean);
    if (!ws.length) return true;
    var re = new RegExp(' ' + ws.map(function(w){ return (w.length > 3 ? w.slice(0, Math.max(3, w.length - 2)) : w) + "[a-z']*"; }).join(" (?:[a-z']+ )?"));
    return re.test(low);
  };
  var mine = it.kind === 'translate' ? a.replace(/^[\s\S]*\nRewrite:\s*/, '') : a;
  // "Start with: …" / "Bắt đầu: …" in the hint: the answer should begin that way.
  var start = textOf(it.hint || '').match(/Start(?: with)?:\s*([^…\.;]+)/i);
  if (start) list.push({ok: has(start[1].replace(/\.\.\.|…/g, '')), text: 'Starts with “' + start[1].trim() + '…”'});
  if (it.kind === 'fix') {
    var orig = textOf(it.cue).replace(/\s+/g, ' ').trim(), right = refText(it.answer);
    var same = function(x, y){ return x.toLowerCase().replace(/[^a-z]+/g, '') === y.toLowerCase().replace(/[^a-z]+/g, ''); };
    if (/^correct\.?$/i.test(mine.trim())) list.push({ok: same(orig, right), text: same(orig, right) ? 'Yes, this sentence was already correct' : 'This sentence has at least one mistake'});
    else list.push({ok: !same(mine, orig), text: 'You changed the sentence (fixed something)'});
  }
  var n = words(mine).length, ref = words(refText(it.answer)).length;
  if (ref) list.push({ok: n >= ref * 0.6 && n <= ref * 1.6, text: 'Length: ' + n + ' words (the answer has about ' + ref + ')'});
  if (/\b\w+n't\b|\b(i'm|it's|they're|we're|you're|that's|there's)\b/i.test(mine)) list.push({ok: false, text: 'No contractions in academic writing (do not, it is …)'});
  list.push({ok: /^[A-Z"“]/.test(mine.trim()) && /[.!?]["”]?$/.test(mine.trim()), text: 'Starts with a capital letter and ends with a full stop'});
  return list;
}
function assess(it, id){
  var a = state.sub[id];
  var done = function(kind, data){ state.fb = state.fb || {}; state.fb[id] = {for: a, kind: kind, data: data}; save(); delete checking[id]; if (document.querySelector('.item[data-id="' + id + '"]')) rerenderItem(id); };
  var fallback = function(why){ done('checks', {list: quickChecks(it, id), why: why}); };
  if (!API_URL || !token()) return fallback('Sign in to the portal to get AI feedback.');
  var p = id.split('-'), u = D.units.find(function(x){ return String(x.num) === p[0]; }), ex = u.exercises[+p[1] - 1];
  checking[id] = 1; rerenderItem(id);
  apiCall('workbook.assess', {url: location.href.split('#')[0], subject: 'writing', instruction: textOf(ex.intro.join(' ')).slice(0, 600), prompt: promptOf(it),
    reference: (it.translation ? 'Translation: ' + textOf(it.translation) + '\nRewrite: ' : '') + refText(it.answer) + (it.alt ? '\nAlso accepted: ' + textOf(it.alt) : ''), answer: a})
    .then(function(res){
      if (res.ok) return done('ai', res.result);
      fallback({not_configured: 'AI feedback is not switched on yet.', limit: 'Daily AI feedback limit reached; try again tomorrow.',
        busy: 'AI feedback is busy right now; submit again in a minute.', error: 'AI feedback is not available right now.'}[res.reason] || '');
    })
    .catch(function(e){ fallback(e.code === 'unauthorized' ? 'Sign in to the portal to get AI feedback.' : e.code === 'forbidden' ? 'AI feedback is only for students of this class.' : 'AI feedback is not available right now.'); });
}
// Multiple choice: "choice" items have lettered options; "pick" items choose a phrase in brackets.
function optionsOf(it){
  return it.kind === 'pick' ? it.picks[0].map(function(p, k){ return {letter: String.fromCharCode(65 + k), text: p}; }) : it.options;
}
function correctOf(it){
  if (it.kind !== 'pick') return it.correct;
  return optionsOf(it).find(function(o){ return o.text === it.answer; }).letter;
}
function choiceResult(it, id){
  var pick = state.choice[id], ok = pick === correctOf(it);
  return '<div class="verdict ' + (ok ? 'ok">✓ Correct' : 'no">✗ Not quite. Answer: ' + (it.kind === 'pick' ? esc(it.answer) : it.correct)) + '</div>' + notesHtml(it);
}
function renderItem(it, id, i){
  var head = '<span class="cue">' + (it.kind === 'pick' ? it.cue.replace(/\(\s*[^()]*?\/[^()]*?\s*\)/, '( … )') : it.cue) + '</span>';
  var lines = LINES.filter(function(l){ return it[l[0]]; }).map(function(l){
    return '<div><span class="label">' + l[1] + ':</span> ' + (l[0] === 'hint' ? '<span class="hint">' + it.hint + '</span>' : it[l[0]]) + '</div>';
  }).join('');
  var s = '<div class="item' + (isDone(id) ? ' done' : '') + '" data-id="' + id + '">' +
    '<div class="item-head"><span class="num">' + (i + 1) + '</span>' + dots(it.level) + head + '</div>' +
    (it.prompt ? '<div class="prompt" lang="en">' + it.prompt + '</div>' : '') +
    (lines ? '<div class="lines">' + lines + '</div>' : '');
  if (it.kind === 'choice' || it.kind === 'pick') {
    var pick = state.choice[id], right = correctOf(it);
    s += '<div class="opts" role="radiogroup" aria-label="Choose one">' + optionsOf(it).map(function(o){
      var cls = pick ? (o.letter === right ? ' right' : o.letter === pick ? ' wrong' : '') : '';
      return '<label class="opt' + cls + '"><input type="radio" name="c-' + id + '" value="' + o.letter + '"' + (pick === o.letter ? ' checked' : '') + '>' + (it.kind === 'pick' ? '' : '<b>' + o.letter + '</b>') + '<span>' + o.text + '</span></label>';
    }).join('') + '</div><div class="work"><div class="actions"><button type="button" class="btn primary" data-choose="' + id + '"' + (pick ? '' : ' disabled') + '>' + (pick ? 'Submit again' : 'Submit') + '</button></div>' +
      '<div class="answer" id="a-' + id + '"' + (pick ? '' : ' hidden') + '>' + (pick ? choiceResult(it, id) : '') + '</div></div>';
  } else if (it.kind === 'translate') {
    var subT = !!state.sub[id], prev = splitTranslate(state.sub[id] || '');
    var d1 = state.draft[id + '~t'] != null ? state.draft[id + '~t'] : prev[0], d2 = state.draft[id] != null ? state.draft[id] : prev[1];
    s += '<div class="work"><label class="note" for="t-' + id + '~t">Your translation</label>' +
      '<textarea id="t-' + id + '~t" data-text="' + id + '~t" rows="2" spellcheck="true" lang="en">' + esc(d1) + '</textarea>' +
      '<label class="note" for="t-' + id + '">Rewrite it with the structure</label>' +
      '<textarea id="t-' + id + '" data-text="' + id + '" rows="2" spellcheck="true" lang="en">' + esc(d2) + '</textarea>' +
      '<div class="actions"><button type="button" class="btn primary" data-submit="' + id + '"' + (d1.trim() && d2.trim() ? '' : ' disabled') + '>' + (subT ? 'Submit again' : 'Submit') + '</button>' +
      (subT ? '' : '<span class="note">Submit both to see the answer.</span>') + '</div>' +
      '<div class="answer" id="a-' + id + '"' + (subT ? '' : ' hidden') + '>' + (subT ? answerHtml(it, id) : '') + '</div></div>';
  } else if (it.kind === 'read') {
    var seen = !!state.seen[id];
    s += '<div class="work"><div class="actions"><button type="button" class="btn primary" data-see="' + id + '" aria-expanded="' + seen + '">' + (seen ? 'Hide answer' : 'Show answer') + '</button></div>' +
      '<div class="answer" id="a-' + id + '"' + (seen ? '' : ' hidden') + '>' + answerHtml(it, id) + '</div></div>';
  } else {
    var draft = state.draft[id] != null ? state.draft[id] : (state.sub[id] || '');
    var sub = !!state.sub[id];
    s += '<div class="work"><label class="note" for="t-' + id + '">' + (it.kind === 'fix' ? 'Write the corrected sentence (or type <b>Correct</b> if there is no mistake)' : 'Write your answer') + '</label>' +
      '<textarea id="t-' + id + '" data-text="' + id + '" rows="2" spellcheck="true" lang="en">' + esc(draft) + '</textarea>' +
      '<div class="actions"><button type="button" class="btn primary" data-submit="' + id + '"' + (draft.trim() ? '' : ' disabled') + '>' + (sub ? 'Submit again' : 'Submit') + '</button>' +
      (sub ? '' : '<span class="note">Submit your answer to see ' + (it.suggest ? 'a suggestion' : 'the answer') + '.</span>') + '</div>' +
      '<div class="answer" id="a-' + id + '"' + (sub ? '' : ' hidden') + '>' + (sub ? answerHtml(it, id) : '') + '</div></div>';
  }
  return s + '</div>';
}
function splitTranslate(sub){
  var m = /^Translation:\s*([\s\S]*?)\nRewrite:\s*([\s\S]*)$/.exec(sub);
  return m ? [m[1], m[2]] : ['', sub];
}
function findItem(id){
  var p = id.split('-'), u = D.units.find(function(x){ return String(x.num) === p[0]; });
  return u.exercises[+p[1] - 1].items.find(function(it){ return it.n === +p[2]; });
}
function renderExercise(u, k){
  var ex = u.exercises[k - 1];
  var s = '<h3>' + esc(ex.title) + '</h3>' + ex.intro.map(function(p){ return '<p class="lede">' + p + '</p>'; }).join('') +
    (ex.legend ? '<div class="card">' + ex.legend.map(function(o){ return '<div><b>' + o.letter + '</b> ' + o.text + '</div>'; }).join('') + '</div>' : ''), shown = 0;
  s += '<div class="send-box" data-ex="' + u.num + '-' + k + '">' + sendBox(u.num + '-' + k) + '</div>';
  ex.items.forEach(function(it, i){
    if (filter && it.level !== filter) return;
    shown++;
    s += renderItem(it, u.num + '-' + k + '-' + it.n, i);
  });
  if (!shown) s += '<p class="empty">No items at this level.</p>';
  s += '<div class="send-box" data-ex="' + u.num + '-' + k + '">' + sendBox(u.num + '-' + k) + '</div>';
  return s;
}

/* ---------- sending finished exercises to the teacher (IELTS Harper Portal) ---------- */
// This page and the portal are on the same site, so the student's portal sign-in is readable here.
var API_URL = 'https://script.google.com/macros/s/AKfycbwKm1zvqca2-WO20f49M4mNW2qn9Aq4uxJZ3_bnQrErWPL5TN4jHycXZUQBDJ1W7wWg/exec', PORTAL = 'https://ieltsharper.github.io/portal/';
var send = {}; // exercise key -> {status: 'sending'|'error'|'forbidden'|'login', message}
var comments = {}; // exercise key -> {comment, commentAt}
state.sent = state.sent || {}; state.dirty = state.dirty || {};
function token(){ try { return localStorage.getItem('portal.session'); } catch(e){ return null; } }
function apiCall(action, payload){
  return fetch(API_URL, {method: 'POST', headers: {'Content-Type': 'text/plain;charset=utf-8'},
    body: JSON.stringify({action: action, token: token(), payload: payload}), redirect: 'follow', credentials: 'omit'})
    .then(function(r){ return r.json(); })
    .then(function(env){ if (env.ok) return env.data; var e = new Error(env.error.message); e.code = env.error.code; throw e; });
}
function exParts(key){ var p = key.split('-'), u = D.units.find(function(x){ return String(x.num) === p[0]; }); return {u: u, k: +p[1], ex: u.exercises[+p[1] - 1]}; }
function sendable(ex){ return ex.items.some(function(it){ return it.kind !== 'read'; }); }
function finished(key){ var x = exParts(key); return x.ex.items.every(function(it){ var id = key + '-' + it.n; return state.sub[id] || state.choice[id]; }); }
function doneCount(key){ var x = exParts(key); return x.ex.items.filter(function(it){ var id = key + '-' + it.n; return state.sub[id] || state.choice[id]; }).length; }
function promptOf(it){
  var head = textOf(it.cue) + (it.prompt ? '\nExam prompt: ' + textOf(it.prompt) : '');
  var lines = LINES.filter(function(l){ return it[l[0]]; }).map(function(l){ return l[1] + ': ' + textOf(it[l[0]]); });
  return [head].concat(lines).join('\n');
}
function payloadFor(key){
  var x = exParts(key);
  return {
    url: location.href.split('#')[0], lessonTitle: D.cover[0], exercise: key,
    exerciseTitle: unitTitle(x.u) + ' · ' + x.ex.title,
    answers: x.ex.items.map(function(it){
      var id = key + '-' + it.n;
      if (it.kind === 'choice' || it.kind === 'pick') {
        var opt = function(l){ var o = optionsOf(it).find(function(o){ return o.letter === l; }); return (it.kind === 'pick' ? '' : l + '. ') + (o ? textOf(o.text) : ''); };
        return {prompt: promptOf(it), answer: opt(state.choice[id]), model: opt(correctOf(it)), correct: state.choice[id] === correctOf(it)};
      }
      return {prompt: promptOf(it), answer: state.sub[id], model: (it.translation ? 'Translation: ' + textOf(it.translation) + '\nRewrite: ' : '') + refText(it.answer) +(it.alt ? '\nAlso accepted: ' + textOf(it.alt) : ''), correct: null};
    })
  };
}
function sendBox(key){
  var x = exParts(key);
  if (!sendable(x.ex) || !API_URL) return '';
  var c = comments[key], s = send[key] || {}, out = '';
  if (c && c.comment) out += '<div class="teacher-note"><b>Teacher&rsquo;s feedback</b><div>' + esc(c.comment) + '</div></div>';
  var msg;
  if (!token() || s.status === 'login') msg = '<a href="' + PORTAL + '" target="_blank" rel="noopener">Sign in to the portal</a> so your work is sent to your teacher when you finish.';
  else if (s.status === 'sending') msg = 'Sending to your teacher…';
  else if (s.status === 'forbidden') msg = 'This exercise is not open to your portal account yet, so it cannot be sent to your teacher.';
  else if (s.status === 'error') msg = 'Not sent yet (' + esc(s.message) + '). <button type="button" class="btn" data-send="' + key + '">Try again</button>';
  else if (state.sent[key] && state.dirty[key]) msg = 'You changed your answers after sending. <button type="button" class="btn primary" data-send="' + key + '">Send again to your teacher</button>';
  else if (state.sent[key]) msg = '✓ Sent to your teacher on ' + esc(new Date(state.sent[key]).toLocaleString('en-GB')) + '.' + (c && c.comment ? '' : ' Your teacher will give feedback in the portal.');
  else msg = 'Done: ' + doneCount(key) + '/' + x.ex.items.length + '. When you finish them all, this exercise is sent to your teacher automatically.';
  return out + '<p class="send-msg">' + msg + '</p>';
}
function refreshSendBoxes(key){
  document.querySelectorAll('.send-box[data-ex="' + key + '"]').forEach(function(b){ b.innerHTML = sendBox(key); });
}
function sendExercise(key){
  if (!API_URL || !token()) { refreshSendBoxes(key); return; }
  send[key] = {status: 'sending'}; refreshSendBoxes(key);
  apiCall('workbook.submit', payloadFor(key)).then(function(row){
    state.sent[key] = row.submittedAt; delete state.dirty[key]; save();
    send[key] = {}; comments[key] = {comment: row.comment, commentAt: row.commentAt};
  }).catch(function(e){
    send[key] = e.code === 'unauthorized' ? {status: 'login'} : e.code === 'forbidden' ? {status: 'forbidden'} : {status: 'error', message: e.message || 'network error'};
  }).then(function(){ refreshSendBoxes(key); });
}
function afterAnswer(id){
  var key = id.split('-').slice(0, 2).join('-');
  if (!sendable(exParts(key).ex)) return;
  if (state.sent[key]) { state.dirty[key] = 1; save(); refreshSendBoxes(key); return; }
  if (finished(key)) sendExercise(key); else refreshSendBoxes(key);
}
function loadComments(){
  if (!D.units.length) return;
  if (!API_URL || !token()) return;
  apiCall('workbook.mine', {url: location.href.split('#')[0]}).then(function(rows){
    rows.forEach(function(r){
      comments[r.exercise] = {comment: r.comment, commentAt: r.commentAt};
      if (!state.sent[r.exercise]) { state.sent[r.exercise] = r.submittedAt; save(); }
    });
    document.querySelectorAll('.send-box').forEach(function(b){ b.innerHTML = sendBox(b.getAttribute('data-ex')); });
    // Exercises finished before signing in are sent now.
    D.units.forEach(function(u){ u.exercises.forEach(function(ex, k){
      var key = u.num + '-' + (k + 1);
      if (sendable(ex) && !state.sent[key] && finished(key)) sendExercise(key);
    }); });
  }).catch(function(){});
}

function renderUnit(u, part){
  var parts = [['ly-thuyet', u.theory.length ? 'A. Theory' : 'Introduction']].concat(u.exercises.map(function(_, k){ return ['bai-tap-' + (k + 1), 'Exercise ' + (k + 1)]; }));
  if (!parts.some(function(p){ return p[0] === part; })) part = 'ly-thuyet';
  var s = '<h2>' + esc(unitTitle(u)) + '</h2>';
  s += '<div class="subnav" role="group" aria-label="Unit sections">' + parts.map(function(p){
    var n = p[0] === 'ly-thuyet' ? '' : (function(){ var k = +p[0].slice(-1), all = u.exercises[k - 1].items.map(function(it){ return u.num + '-' + k + '-' + it.n; }); return ' <small>' + all.filter(isDone).length + '/' + all.length + '</small>'; })();
    return '<a class="chip" style="text-decoration:none" href="#' + p[0] + '" aria-pressed="' + (p[0] === part) + '">' + p[1] + n + '</a>';
  }).join('') + '<span class="filter-label">Level:</span>' +
    [[0, 'All'], [1, '● 5.0-6.0'], [2, '●● 6.0-6.5'], [3, '●●● 7.0-7.5']].map(function(f){
      return '<button type="button" class="chip" data-filter="' + f[0] + '" aria-pressed="' + (filter === f[0]) + '">' + f[1] + '</button>';
    }).join('') + '</div>';
  s += part === 'ly-thuyet' ? renderTheory(u) : renderExercise(u, +part.slice(-1));
  var i = parts.findIndex(function(p){ return p[0] === part; });
  if (i < parts.length - 1) s += '<p style="text-align:right"><a class="btn primary" style="text-decoration:none;display:inline-block" href="#' + parts[i + 1][0] + '">Next: ' + parts[i + 1][1] + ' →</a></p>';
  return s;
}

function render(){
  var r = route();
  document.querySelectorAll('#tabs a').forEach(function(a){
    if (a.getAttribute('href') === '#' + r.tab.id) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
  });
  var m = $('#main');
  if (!D.units.length) { m.innerHTML = renderIndex(); $('.progress-all').style.display = 'none'; return; }
  m.innerHTML = renderUnit(r.tab.unit, r.part);
  updateProgress();
}
function rerenderItem(id){
  var old = document.querySelector('.item[data-id="' + id + '"]'), p = id.split('-');
  var tmp = document.createElement('div');
  var item = findItem(id);
  tmp.innerHTML = renderItem(item, id, D.units.find(function(x){ return String(x.num) === p[0]; }).exercises[+p[1] - 1].items.indexOf(item));
  old.replaceWith(tmp.firstChild);
  updateProgress();
  var chip = document.querySelector('.subnav a[aria-pressed="true"] small');
  if (chip) { var ex = D.units.find(function(x){ return String(x.num) === p[0]; }).exercises[+p[1] - 1];
    chip.textContent = ex.items.filter(function(it){ return isDone(p[0] + '-' + p[1] + '-' + it.n); }).length + '/' + ex.items.length; }
}

/* ---------- events ---------- */
var lastTab = route().tab.id;
window.addEventListener('hashchange', function(){
  render();
  var t = route().tab.id;
  window.scrollTo(0, t === lastTab ? Math.min(window.scrollY, $('nav.tabs').offsetTop) : 0);
  lastTab = t;
});
$('#main').addEventListener('click', function(e){
  var b, id;
  if ((b = e.target.closest('[data-filter]'))) { filter = +b.getAttribute('data-filter'); var y = window.scrollY; render(); window.scrollTo(0, y); return; }
  if ((b = e.target.closest('[data-submit]'))) {
    id = b.getAttribute('data-submit');
    var t = document.getElementById('t-' + id).value.trim(), tt = document.getElementById('t-' + id + '~t');
    if (!t || (tt && !tt.value.trim())) return;
    if (tt) { t = 'Translation: ' + tt.value.trim() + '\nRewrite: ' + t; delete state.draft[id + '~t']; }
    var changed = state.sub[id] !== t;
    state.sub[id] = t; delete state.draft[id]; save(); rerenderItem(id);
    var a = document.getElementById('a-' + id); if (a) a.scrollIntoView({block: 'nearest'});
    var f = (state.fb || {})[id];
    if (!f || f.for !== t || f.kind !== 'ai') assess(findItem(id), id);
    if (changed) afterAnswer(id);
    return;
  }
  if ((b = e.target.closest('[data-choose]'))) {
    id = b.getAttribute('data-choose');
    var r = document.querySelector('input[name="c-' + id + '"]:checked');
    if (!r) return;
    var changedChoice = state.choice[id] !== r.value;
    state.choice[id] = r.value; save(); rerenderItem(id);
    if (changedChoice) afterAnswer(id);
    return;
  }
  if ((b = e.target.closest('[data-send]'))) { sendExercise(b.getAttribute('data-send')); return; }
  if ((b = e.target.closest('[data-see]'))) {
    id = b.getAttribute('data-see');
    if (state.seen[id]) delete state.seen[id]; else state.seen[id] = 1;
    save(); rerenderItem(id);
  }
});
$('#main').addEventListener('change', function(e){
  var t = e.target;
  if (t.matches('input[type="radio"]')) {
    var id = t.name.slice(2), btn = document.querySelector('[data-choose="' + id + '"]');
    if (btn) btn.disabled = false;
  }
});
$('#main').addEventListener('input', function(e){
  var t = e.target;
  if (t.matches('[data-text]')) {
    var id = t.getAttribute('data-text');
    state.draft[id] = t.value; save();
    var base = id.replace(/~t$/, ''), btn = document.querySelector('[data-submit="' + base + '"]');
    var all = [document.getElementById('t-' + base), document.getElementById('t-' + base + '~t')].filter(Boolean);
    if (btn) btn.disabled = !all.every(function(x){ return x.value.trim(); });
  }
});
render();
loadComments();
})();
