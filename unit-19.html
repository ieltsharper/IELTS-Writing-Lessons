": "It is unclear whether online learning is as effective as classroom learning.", "alt": "Whether online learning is as effective as classroom learning remains unclear.", "kind": "write"}, {"level": 2, "n": 7, "cue": "People think that the Internet changed education more than any other invention.", "hint": "S + is thought to have + V3", "answer": "The Internet is thought to have changed education more than any other invention.", "alt": "It is thought that the Internet has changed education more than any other invention.", "kind": "write"}, {"level": 2, "n": 8, "cue": "Most experts accept that sleep affects learning.", "hint": "It is widely accepted that", "answer": "It is widely accepted that sleep affects learning.", "alt": "It is generally accepted that sleep affects learning.", "kind": "write"}, {"level": 2, "n": 9, "cue": "The way tourism is managed decides whether it helps local people.", "hint": "Whether … depends on …", "answer": "Whether tourism helps local people depends on how it is managed.", "alt": "How tourism is managed determines whether it benefits local people.", "kind": "write"}, {"level": 2, "n": 10, "cue": "People often say that money cannot buy happiness.", "hint": "It is often said that", "answer": "It is often said that money cannot buy happiness.", "alt": "It is commonly said that money cannot buy happiness.", "kind": "write"}, {"level": 2, "n": 11, "cue": "Peers strongly influence teenagers.", "hint": "The influence of … is", "answer": "The influence of peers on teenagers is strong.", "alt": "Teenagers are strongly influenced by their peers.", "kind": "write"}, {"level": 2, "n": 12, "cue": "Children learn more when they enjoy their lessons. Most people recognise this.", "hint": "The fact that … is widely recognised", "answer": "The fact that children learn more when they enjoy their lessons is widely recognised.", "alt": "It is widely recognised that children learn more when they enjoy their lessons.", "kind": "write"}, {"level": 2, "n": 13 Many people now have their groceries delivered.<\/b>", "alt": "Many people now get their groceries delivered."}, {"level": 1, "n": 5, "cue": "Việc tổ chức một sự kiện quốc tế mang lại nhiều lợi ích.", "kind": "translate", "rewriteWith": "<b>V-ing subject + singular verb<\/b>", "translation": "Organising an international event has many benefits.", "answer": "<b>Organising an international event brings many benefits.<\/b>", "alt": "Hosting an international event brings many benefits."}, {"level": 1, "n": 6, "cue": "Chưa rõ liệu học trực tuyến có hiệu quả bằng học trên lớp hay không.", "kind": "translate", "rewriteWith": "<b>It is unclear whether<\/b>", "translation": "It is not clear if online learning is as effective as learning in class.", "answer": "<b>It is unclear whether online learning is as effective as classroom learning.<\/b>", "alt": "Whether online learning is as effective as classroom learning remains unclear."}, {"level": 2, "n": 7, "cue": "Internet được cho là đã thay đổi giáo dục nhiều hơn bất kỳ phát minh nào khác.", "kind": "translate", "rewriteWith": "<b>is thought to have + V3<\/b>", "translation": "People think the Internet changed education more than any other invention.", "answer": "<b>The Internet is thought to have changed education more than any other invention.<\/b>", "alt": "It is thought that the Internet has changed education more than any other invention."}, {"level": 2, "n": 8, "cue": "Người ta thừa nhận rộng rãi rằng giấc ngủ ảnh hưởng đến việc học.", "kind": "translate", "rewriteWith": "<b>It is widely accepted that<\/b>", "translation": "People widely accept that sleep affects learning.", "answer": "<b>It is widely accepted that sleep affects learning.<\/b>", "alt": "Sleep is widely accepted to affect learning."}, {"level": 2, "n": 9, "cue": "Liệu du lịch có giúp ích cho người dân địa phương hay không phụ thuộc vào cách nó được quản lý.", "kind": "translate", "rewriteWith": "<b>Whether … depends on<\/b>", "translation": "Whether tourism helps local people or not depends on how it is managed.", "answer": "<b>Whether tourism benefits local people depends on how it is managed.<\/b>", "alt": "How tourism is managed determines whether it benefits local people."}, {"level": 2, "n": 10, "cue": "Người ta thường nói rằng tiền không mua được hạnh phúc.", "kind": "translate", "rewriteWith": "<b>It is often said that<\/b>", "translation": "People often say money cannot buy happiness.", "answer": "<b>It is often said that money cannot buy happiness.<\/b>", "alt": "Money is often said to be unable to buy happiness."}, {"level": 2, "n": 11, "cue": "Ảnh hưởng của bạn bè đồng trang lứa đối với thanh thiếu niên là rất lớn.", "kind": "translate", "rewriteWith": "<b>The influence of … is<\/b>", "translation": "Peers have a very big influence on teenagers.", "answer": "<b>The influence of peers on teenagers is very strong.<\/b>", "alt": "Teenagers are strongly influenced by their peers."}, {"level": 2, "n": 12, "cue": "Việc trẻ em học tốt hơn khi yêu thích bài học được thừa nhận rộng rãi.", "kind": "translate", "rewriteWith": "<b>The fact that … is<\/b>", "translation": "It is widely accepted that children learn better when they like the lessons.", "answer": "<b>The fact that children learn better when they enjoy their lessons is widely recognised.<\/b>", "alt": "It is widely recognised that children learn better when they enjoy their lessons."}, {"level": 2, "n": 13, "cue": "Ô nhiễm không khí được cho là gây ra hàng nghìn ca tử vong mỗi năm.", "kind": "translate", "rewriteWith": "<b>is reported to<\/b>", "translation": "Air pollution is said to cause thousands of deaths every year.", "answer": "<b>Air pollution is reported to cause thousands of deaths each year.<\/b>", "alt": "It is reported that air pollution causes thousands of deaths a year."}, {"level": 3, "n": 14, "cue": "Philippines ghi nhận tỷ lệ sinh giảm đều đặn.", "kind": "translate", "rewriteWith": "<b>active (do not use the incorrect passive)<\/b>", "t ion more than any other invention.", "notes": ["<span class=\"tag GRA\">GRA<\/span> Sự việc đã xảy ra → <i>to have<\/i> + V3."]}, {"level": 2, "n": 12, "kind": "fix", "cue": "Whether tourism benefits local people depends on how it is managed.", "answer": "<b>✓ <\/b>Whether tourism benefits local people depends on how it is managed.", "notes": ["Đúng: mệnh đề <i>Whether<\/i> làm chủ ngữ + động từ số ít."]}, {"level": 2, "n": 13, "kind": "fix", "cue": "Many people now have delivered their groceries.", "answer": "Many people now <s>have delivered their groceries<\/s><b> HAVE THEIR GROCERIES DELIVERED<\/b>.", "notes": ["<span class=\"tag GRA\">GRA<\/span> Trật tự: <i>have<\/i> + tân ngữ + V3."]}, {"level": 3, "n": 14, "kind": "fix", "cue": "The proportion of participations who supported the plan were low.", "answer": "The proportion of <s>participations<\/s><b> PARTICIPANTS<\/b> who supported the plan <s>were<\/s><b> WAS<\/b> low.", "notes": ["<span class=\"tag LR\">LR<\/span> Từ loại: người tham gia là <i>participants<\/i>.", "<span class=\"tag GRA\">GRA<\/span> Danh từ chính <i>proportion<\/i> (số ít)."]}, {"level": 3, "n": 15, "kind": "fix", "cue": "What children watch on television affects their behaviour.", "answer": "<b>✓ <\/b>What children watch on television affects their behaviour.", "notes": ["Đúng: mệnh đề <i>What<\/i> làm chủ ngữ + động từ số ít."]}, {"level": 3, "n": 16, "kind": "fix", "cue": "What children need are more time to play.", "answer": "What children need <s>are<\/s><b> IS<\/b> more time to play.", "notes": ["<span class=\"tag GRA\">GRA<\/span> Mệnh đề <i>What<\/i> làm chủ ngữ → số ít."]}, {"level": 3, "n": 17, "kind": "fix", "cue": "The new law was believed would reduce crime.", "answer": "The new law <s>was believed would reduce<\/s><b> WAS EXPECTED TO REDUCE<\/b> crime.", "notes": ["<span class=\"tag GRA\">GRA<\/span> Cấu trúc: <i>S + was believed/expected + to<\/i> V."]}, {"level": 3, "n": 18, "kind": "fix", "cue": "How public money is spent is a matter of concern to all citizens.", "answer": "<b>✓ <\/b>How public money is spent is a matter of concern to all citizens.", "notes": ["Đúng: mệnh đề <i>How<\/i> làm chủ ngữ."]}, {"level": 3, "n": 19, "kind": "fix", "cue": "It is proven that video games make all children violent.", "answer": "<s>It is proven that<\/s><b> IT HAS BEEN SUGGESTED THAT<\/b> video games <s>make all children violent<\/s><b> MAY INCREASE AGGRESSION IN SOME CHILDREN<\/b>.", "notes": ["<span class=\"tag TR\">TR<\/span> Không có bằng chứng chắc chắn; dùng cấu trúc tường thuật thận trọng hơn.", "<span class=\"tag TR\">TR<\/span> Tuyệt đối hóa (<i>all<\/i>)."]}]}, {"title": "Exercise 4 — Apply to real exam prompts", "intro": ["<i>For each prompt, write one sentence (●, ●●) using the suggested structure, or two sentences (●●●) using two different structures (passive, reporting, noun clause).<\/i>"], "items": [{"level": 1, "n": 0, "cue": "Age, generation and gender · Agree/disagree", "prompt": "<i>In many countries, women can join the armed forces in the same way as men. Some people believe that only men should serve in the army, navy or air force. To what extent do you agree or disagree?<\/i>", "hint": "It is sometimes argued that", "answer": "It is sometimes argued that combat roles should be reserved for men, but this view is increasingly being challenged.", "kind": "write"}, {"level": 1, "n": 1, "cue": "Age, generation and gender · Agree/disagree", "prompt": "<i>People's shopping habits are influenced more by their age than by any other factor. To what extent do you agree or disagree?<\/i>", "hint": "passive", "answer": "Shopping habits are influenced by many factors, including income and culture, not only age.", "kind": "write"}, {"level": 1, "n": 2, "cue": "Age, generation and gender · Agree/disagree", "prompt": "<i>Some people believe that children today have too much freedom. To what extent do you agree or disagree?<\/i>", "hint": "It is often said that", "answer": "It is often said that today's children are given too much freedom, especially online.", "kind": "write"}, {"level": 1, "n": 3, "cue": "Economy, money and trade · Agree/disagree", "prompt": "<i>In some countries, a small number of people earn extremely high salaries. Some people believe that governments should place limits on how much people can earn. To what extent do you agree or disagree?<\/i>", "hint": "should be + V3", "answer": "Extremely high salaries should be taxed more heavily rather than legally capped.", "kind": "write"}, {"level": 1, "n": 4, "cue": "Economy, money and trade · Agree/disagree", "prompt": "<i>The spread of multinational companies and increasing globalisation have positive effects on everyone. To what extent do you agree or disagree?<\/i>", "hint": "It is widely accepted that", "answer": "It is widely accepted that globalisation has created jobs, but its benefits have not been shared equally.", "kind": "write"}, {"level": 1, "n": 5, "cue": "Economy, money and trade · Agree/disagree", "prompt": "<i>As well as making money, businesses also have social responsibilities. To what extent do you agree or disagree?<\/i>", "hint": "V-ing as subject", "answer": "Supporting local communities helps businesses build trust with their customers.", "kind": "write"}, {"level": 1, "n": 6, "cue": "Crime, punishment and law · Agree/disagree", "prompt": "<i>Young people who commit serious crimes should be punished in the same way as adults. To what extent do you agree or disagree?<\/i>", "hint": "Whether … depends on", "answer": "Whether a young offender can be rehabilitated depends largely on the support he or she receives.", "kind": "write"}, {"level": 2, "n": 7, "cue": "Crime, punishment and law · Agree/disagree", "prompt": "<i>Some people believe that former prisoners are the best people to talk to school students about the dangers of crime. To what extent do you agree or disagree?<\/i>", "hint": "S + is thought to", "answer": "Hearing from former prisoners is thought to have a stronger effect on students than warnings from teachers.", "kind": "write"}, {"level": 2, "n": 8, "cue": "Crime, punishment and law · Discuss both views", "prompt": "<i>Some people believe that members of the public should be allowed to own guns, while others disagree. Discuss both views and give your own opinion.<\/i>", "hint": "should be + V3", "answer": "In my view, gun ownership should be strictly limited to licensed hunters and sports shooters.", "kind": "write"}, {"level": 2, "n": 9, "cue": "Leisure, sports and hobbies · Discuss both views", "prompt": "<i>Some people believe that sports and games play an important role in society, while others think they should be regarded simply as leisure activities. Discuss both views and give your own opinion.<\/i>", "hint": "What-clause as subject", "answer": "What sport teaches young people is how to cooperate and cope with defeat.", "kind": "write"}, {"level": 2, "n": 10, "cue": "Leisure, sports and hobbies · Discuss both views", "prompt": "<i>Some people believe that playing computer games is harmful to children, while others think that it can have positive effects. Discuss both views and give your own opinion.<\/i>", "hint": "It has been suggested that", "answer": "It has been suggested that some computer games can improve children's problem-solving skills.", "kind": "write"}, {"level": 2, "n": 11, "cue": "Leisure, sports and hobbies · Discuss both views", "prompt": "<i>Some people believe that physical strength and fitness are the main reasons individuals and teams succeed in sport, while others think mental attitude is more important. Discuss both views and give your own opinion.<\/i>", "hint": "The fact that … shows", "answer": "The fact that many talented athletes fail under pressure shows that mental attitude is crucial.", "kind": "write"}, {"level": 2, "n": 12, "cue": "Government, politics and diplomacy · Discuss both views", "prompt": "<i>Some people believe that the main benefit of international cooperation is protecting the environment, while others think its main benefit is promoting global business. Discuss both views and give your own opinion.<\/i>", "hint": "It is widely believed that", "answer": "It is widely believed that international cooperation is essential for tackling climate change.", "kind": "write"}, {"level": 2, "n": 13, "cue": "Travelling and tourism · Causes/problems/solutions", "prompt": "<i>Many countries believe that international tourism can have harmful effects. Why can tourism cause problems, and what can be done to reduce these negative effects?<\/i>", "hint": "passive", "answer": "Local cultures can be damaged when traditions are turned into performances for tourists.", "kind": "write"}, {"level": 3, "n": 14, "cue": "Media and communication · Causes/problems/solutions", "prompt": "<i>Studies show that children spend more time watching television than in the past and less time doing active or creative activities. Why is this happening, and what can be done to encourage children to be more active and creative?<\/i>", "hint": "Two sentences: one passive or reporting sentence and one sentence with a noun clause.", "answer": "Children are increasingly entertained by screens rather than by creative play. It is widely recommended that screen time be limited and outdoor activities encouraged.", "kind": "write"}, {"level": 3, "n": 15, "cue": "Science, technology and innovation · Advantages/disadvantages", "prompt": "<i>More and more people are using the Internet to carry out tasks that they used to do in person. Do the advantages of this development outweigh the disadvantages?<\/i>", "hint": "Two sentences: one passive or reporting sentence and one sentence with a noun clause.", "answer": "Many everyday tasks, such as banking and shopping, can now be done online. Whether this is beneficial depends on how well vulnerable groups are supported.", "kind": "write"}, {"level": 3, "n": 16, "cue": "Media and communication · Advantages/disadvantages", "prompt": "<i>The use of mobile phones can create social, medical and technical problems. Do these problems outweigh the benefits of mobile phones?<\/i>", "hint": "Two sentences: one passive or reporting sentence and one sentence with a noun clause.", "answer": "It is often claimed that mobile phones damage people's health. What is clearer, however, is that excessive use can disrupt sleep and concentration.", "kind": "write"}, {"level": 3, "n": 17, "cue": "Media and communication · Positive/negative development", "prompt": "<i>The news media play an important role in modern society. Why are they so important, and is their influence generally positive or negative?<\/i>", "hint": "Two sentences: one passive or reporting sentence and one sentence with a noun clause.", "answer": "It is widely accepted that the news media help to hold governments to account. How accurately they report events, however, varies considerably.", "kind": "write"}, {"level": 3, "n": 18, "cue": "Education · Positive/negative development", "prompt": "<i>Some fast-food restaurants and supermarkets provide money to schools in order to promote their products. Is this a positive or negative development?<\/i>", "hint": "Two sentences: one passive or reporting sentence and one sentence with a noun clause.", "answer": "Schools that are funded by fast-food companies may be pressured to promote unhealthy products. Whether such sponsorship benefits pupils is therefore highly questionable.", "kind": "write"}, {"level": 3, "n": 19, "cue": "Art and museums · Two-part question", "prompt": "<i>In many countries, people watch more foreign films than films made in their own country. Why is this the case, and should governments provide financial support to local film industries?<\/i>", "hint": "Two sentences: one passive or reporting sentence and one sentence with a noun clause.", "answer": "Foreign films are often watched because they are backed by huge marketing budgets. It is argued that local film industries should be supported so that national culture is preserved.", "kind": "write"}]}, {"title": "Exercise 5 — Active or passive?", "intro": ["<i>Choose the correct option.<\/i>"], "items": [{"level": 1, "n": 0, "kind": "pick", "picks": [["are replacing", "are being replaced"]], "cue": "Many jobs <b>( are replacing / are being replaced )<\/b> by machines.", "answer": "are being replaced", "note": "Công việc <i>bị<\/i> thay thế → bị động."}, {"level": 1, "n": 1, "kind": "pick", "picks": [["should be banned", "should ban"]], "cue": "Plastic bags <b>( should be banned / should ban )<\/b>.", "answer": "should be banned", "note": "Túi ni lông <i>bị<\/i> cấm → bị động."}, {"level": 1, "n": 2, "kind": "pick", "picks": [["believes", "is believed"]], "cue": "It <b>( believes / is believed )<\/b> that exercise improves mood.", "answer": "is believed", "note": "Cấu trúc tường thuật bị động."}, {"level": 1, "n": 3, "kind": "pick", "picks": [["rising", "to rise"]], "cue": "Global temperatures are expected <b>( rising / to rise )<\/b>.", "answer": "to rise", "note": "Cấu trúc đúng: <i>be expected<\/i> + <i>to<\/i> V."}, {"level": 1, "n": 4, "kind": "pick", "picks": [["brings", "bring"]], "cue": "Organising international events <b>( brings / bring )<\/b> benefits.", "answer": "brings", "note": "Chủ ngữ V-ing → số ít."}, {"level": 1, "n": 5, "kind": "pick", "picks": [["is", "are"]], "cue": "The influence of peers <b>( is / are )<\/b> strong.", "answer": "is", "note": "Danh từ chính <i>influence<\/i> (số ít)."}, {"level": 1, "n": 6, "kind": "pick", "picks": [["deliver", "delivered"]], "cue": "Many people now have their groceries <b>( deliver / delivered )<\/b>.", "answer": "delivered", "note": "<i>have<\/i> + tân ngữ + V3."}, {"level": 2, "n": 7, "kind": "pick", "picks": [["depends", "depend"]], "cue": "Whether online learning works <b>( depends / depend )<\/b> on the student.", "answer": "depends", "note": "Mệnh đề danh từ làm chủ ngữ → số ít."}, {"level": 2, "n": 8, "kind": "pick", "picks": [["to have changed", "to change"]], "cue": "The Internet is thought <b>( to have changed / to change )<\/b> education more than any other invention.", "answer": "to have changed", "note": "Sự việc đã xảy ra → <i>to have<\/i> + V3."}, {"level": 2, "n": 9, "kind": "pick", "picks": [["recorded", "was recorded"]], "cue": "The Philippines <b>( recorded / was recorded )<\/b> a steady decline in its birth rate.", "answer": "recorded", "note": "Câu đã có tân ngữ (<i>a steady decline<\/i>) → chủ động."}, {"level": 2, "n": 10, "kind": "pick", "picks": [["are", "is"]], "cue": "What children need <b>( are / is )<\/b> more time to play.", "answer": "is", "note": "Mệnh đề <i>What<\/i> làm chủ ngữ → số ít."}, {"level": 2, "n": 11, "kind": "pick", "picks": [["should be invested", "should invest"]], "cue": "Governments <b>( should be invested / should invest )<\/b> more in public transport.", "answer": "should invest", "note": "Chính phủ là người thực hiện và là trọng tâm → chủ động."}, {"level": 2, "n": 12, "kind": "pick", "picks": [["was built", "built"]], "cue": "The new bridge <b>( was built / built )<\/b> in 2010.", "answer": "was built", "note": "Cây cầu <i>được<\/i> xây → bị động."}, {"level": 2, "n": 13, "kind": "pick", "picks": [["causing", "to cause"]], "cue": "Air pollution is reported <b>( causing / to cause )<\/b> thousands of deaths.", "answer": "to cause", "note": "Cấu trúc đúng: <i>be reported<\/i> + <i>to<\/i> V."}, {"level": 3, "n": 14, "kind": "pick", "picks": [["are", "is"]], "cue": "How public money is spent <b>( are / is )<\/b> a concern to all citizens.", "answer": "is", "note": "Mệnh đề <i>How<\/i> làm chủ ngữ → số ít."}, {"level": 3, "n": 15, "kind": "pick", "picks": [["has been made", "has made"]], "cue": "The decision <b>( has been made / has made )<\/b> to close the factory.", "answer": "has been made", "note": "Quyết định <i>được<\/i> đưa ra → bị động."}, {"level": 3, "n": 16, "kind": "pick", "picks": [["checked", "check"]], "cue": "Factories must have their emissions <b>( checked / check )<\/b> regularly.", "answer": "checked", "note": "<i>have<\/i> + tân ngữ + V3."}, {"level": 3, "n": 17, "kind": "pick", "picks": [["were", "was"]], "cue": "The proportion of students who passed <b>( were / was )<\/b> high.", "answer": "was", "note": "Danh từ chính <i>proportion<\/i> (số ít)."}, {"level": 3, "n": 18, "kind": "pick", "picks": [["widely accepts", "is widely accepted"]], "cue": "It <b>( widely accepts / is widely accepted )<\/b> that sleep affects learning.", "answer": "is widely accepted", "note": "Cấu trúc tường thuật bị động."}, {"level": 3, "n": 19, "kind": "pick", "picks": [["have been created", "have created"]], "cue": "Many new jobs <b>( have been created / have created )<\/b> by the tourism industry.", "answer": "have been created", "note": "Việc làm <i>được<\/i> tạo ra → bị động."}]}], "after": []}], "parts": [], "guide": [], "index": []}</script>

<script>
(function(){
'use strict';
var D = JSON.parse(document.getElementById('data').textContent);
var STORE = 'wt2-19';
var state = load();
function blank(){ return {draft:{}, sub:{}, choice:{}, seen:{}, sent:{}, dirty:{}, fb:{}}; }
function load(){ try { var s = JSON.parse(localStorage.getItem(STORE)); return s && s.sub ? s : blank(); } catch(e){ return blank(); } }
function save(){ try { localStorage.setItem(STORE, JSON.stringify(state)); } catch(e){} }

var $ = function(s, r){ return (r||document).querySelector(s); };
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function dots(n){ return n ? '<span class="lv" title="Level ' + n + '">' + '●'.repeat(n) + '</span>' : ''; }
function textOf(html){ var t = document.createElement('div'); t.innerHTML = html; return t.textContent; }

/* ---------- recorded audio for the English examples (audio/<id>.mp3, made by make_audio.py) ---------- */
var AUDIO = JSON.parse(document.getElementById('audio').textContent);
var player = new Audio(), playing = null;
function speakBtn(text){
  var id = AUDIO[text];
  if (!id) return '';
  return '<button type="button" class="speak" data-audio="' + id + '" aria-label="Listen: ' + esc(text) + '" title="Listen">🔊</button>';
}
function stopAudio(){ player.pause(); if (playing) playing.classList.remove('on'); playing = null; }
player.addEventListener('ended', stopAudio);
document.addEventListener('click', function(e){
  var b = e.target.closest('[data-audio]'); if (!b) return;
  var again = playing === b;
  stopAudio();
  if (again) return;
  player.src = 'audio/' + b.getAttribute('data-audio') + '.mp3';
  playing = b; b.classList.add('on');
  player.play().catch(stopAudio);
});

/* ---------- progress ---------- */
function ids(u){ var out = []; u.exercises.forEach(function(ex, k){ ex.items.forEach(function(it){ out.push(u.num + '-' + (k + 1) + '-' + it.n); }); }); return out; }
function isDone(id){ return !!(state.sub[id] || state.choice[id] || state.seen[id]); }
var ALL = [].concat.apply([], D.units.map(ids));
function updateProgress(){
  var n = ALL.filter(isDone).length;
  $('#progressText').textContent = 'Done: ' + n + '/' + ALL.length + ' items';
  $('#progressBar').style.width = (100 * n / ALL.length) + '%';
}
$('#reset').addEventListener('click', function(){
  if (!confirm('Clear everything you wrote, submitted and chose in this browser?')) return;
  state = blank(); save(); render();
});

/* ---------- header and tabs ---------- */
// One page per unit; D.nav lists every page (index + units) for the tab bar.
$('#title').textContent = D.cover[0];
$('#cover').innerHTML = D.cover.slice(1).map(function(c, i, a){
  return '<p class="standfirst' + (i === a.length - 1 ? ' small' : '') + '">' + esc(c) + '</p>';
}).join('');
$('#tabs').innerHTML = D.nav.map(function(t){ return '<a href="' + t.href + '"' + (t.current ? ' aria-current="page"' : '') + '>' + esc(t.label) + '</a>'; }).join('');
function unitTitle(u){ return u.num === 'review' ? u.name : 'Unit ' + u.num + ' · ' + u.name; }

function route(){
  return {tab: {unit: D.units[0]}, part: location.hash.replace('#', '') || 'ly-thuyet'};
}
var filter = 0;

/* ---------- index page: all units with progress, then the guide ---------- */
function renderBlocks(list){
  var s = '', card = '', open = false;
  function flush(){ if (open) { card += '</ul>'; open = false; } if (card) s += '<div class="card">' + card + '</div>'; card = ''; }
  list.forEach(function(b){
    if (b.type === 'h1') { flush(); s += '<h2 style="margin-top:28px">' + esc(b.text) + '</h2>'; }
    else if (b.type === 'h') { flush(); card = '<h4>' + b.html + '</h4>'; }
    else if (b.type === 'li') { if (!open) { card += '<ul class="plain">'; open = true; } card += '<li>' + b.html + '</li>'; }
    else if (b.type === 'table') { flush(); s += renderTable(b); }
    else { if (open) { card += '</ul>'; open = false; } card += '<p>' + b.html + '</p>'; }
  });
  flush();
  return s;
}
function renderIndex(){
  var s = '<h2>Units</h2>';
  D.parts.forEach(function(p){

/* ---------- sending finished exercises to the teacher (IELTS Harper Portal) ---------- */
// This page and the portal are on the same site, so the student's portal sign-in is readable here.
var API_URL = 'https://script.google.com/macros/s/AKfycbwKm1zvqca2-WO20f49M4mNW2qn9Aq4uxJZ3_bnQrErWPL5TN4jHycXZUQBDJ1W7wWg/exec', PORTAL = 'https://ieltsharper.github.io/portal/';

}

function renderUnit(u, part){
  var parts = [['ly-thuyet', u.theory.length ? 'A. Theory' : 'Introduction']].concat(u.exercises.map(function(_, k){ return ['bai-tap-' + (k + 1), 'Exercise ' + (k + 1)]; }));
  if (!parts.some(function(p){ return p[0] === part; })) part = 'ly-thuyet';
  var s = '<h2>' + esc(unitTitle(u)) + '</h2>';
  s += '<div class="subnav" role="group" aria-label="Unit sections">' + parts.map(function(p){
    var n = p[0] === 'ly-thuyet' ? '' : (function(){ var k = +p[0].slice(-1), all = u.exercises[k - 1].items.map(function(it){ return u.num + '-' + k + '-' + it.n; }); return ' <small>' + all.filter(isDone).length + '/' + all.length + '</small>'; })();
    return '<a class="chip" style="text-decoration:none" href="#' + p[0] + '" aria-pressed="' + (p[0] === part) + '">' + p[1] + n + '</a>';
  }).join('') + '<span class="filter-label">Level:</span>' +
    [[0, 'All'], [1, '● 5.0-6.0'], [2, '●● 6.0-6.5'], [3, '●●● 7.0-7.5']].map(function(f){
      return '<button type="button" class="chip" data-filter="' + f[0] + '" aria-pressed="' + (filter === f[0]) + '">' + f[1] + '</button>';
    }).join('') + '</div>';
  s += part === 'ly-thuyet' ? renderTheory(u) : renderExercise(u, +part.slice(-1));
  var i = parts.findIndex(function(p){ return p[0] === part; });
  if (i < parts.length - 1) s += '<p style="text-align:right"><a class="btn primary" style="text-decoration:none;display:inline-block" href="#' + parts[i + 1][0] + '">Next: ' + parts[i + 1][1] + ' →</a></p>';
  return s;
}

function render(){
  var r = route();
  document.querySelectorAll('#tabs a').forEach(function(a){
    if (a.getAttribute('href') === '#' + r.tab.id) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
  });
  var m = $('#main');
  if (!D.units.length) { m.innerHTML = renderIndex(); $('.progress-all').style.display = 'none'; return; }
  m.innerHTML = renderUnit(r.tab.unit, r.part);
  updateProgress();
}
function rerenderItem(id){
  var old = document.querySelector('.item[data-id="' + id + '"]'), p = id.split('-');
  var tmp = document.createElement('div');
  var item = findItem(id);
  tmp.innerHTML = renderItem(item, id, D.units.find(function(x){ return String(x.num) === p[0]; }).exercises[+p[1] - 1].items.indexOf(item));
  old.replaceWith(tmp.firstChild);
  updateProgress();
  var chip = document.querySelector('.subnav a[aria-pressed="true"] small');
  if (chip) { var ex = D.units.find(function(x){ return String(x.num) === p[0]; }).exercises[+p[1] - 1];
    chip.textContent = ex.items.filter(function(it){ return isDone(p[0] + '-' + p[1] + '-' + it.n); }).length + '/' + ex.items.length; }
}

/* ---------- events ---------- */
var lastTab = route().tab.id;
window.addEventListener('hashchange', function(){
  render();
  var t = route().tab.id;
  window.scrollTo(0, t === lastTab ? Math.min(window.scrollY, $('nav.tabs').offsetTop) : 0);
  lastTab = t;
});
$('#main').addEventListener('click', function(e){
  var b, id;
  if ((b = e.target.closest('[data-filter]'))) { filter = +b.getAttribute('data-filter'); var y = window.scrollY; render(); window.scrollTo(0, y); return; }
  if ((b = e.target.closest('[data-submit]'))) {
    id = b.getAttribute('data-submit');
    var t = document.getElementById('t-' + id).value.trim(), tt = document.getElementById('t-' + id + '~t');
    if (!t || (tt && !tt.value.trim())) return;
    if (tt) { t = 'Translation: ' + tt.value.trim() + '\nRewrite: ' + t; delete state.draft[id + '~t']; }
    var changed = state.sub[id] !== t;
    state.sub[id] = t; delete state.draft[id]; save(); rerenderItem(id);
    var a = document.getElementById('a-' + id); if (a) a.scrollIntoView({block: 'nearest'});
    var f = (state.fb || {})[id];
    if (!f || f.for !== t || f.kind !== 'ai') assess(findItem(id), id);
    if (changed) afterAnswer(id);
    return;
  }
  if ((b = e.target.closest('[data-choose]'))) {
    id = b.getAttribute('data-choose');
    var r = document.querySelector('input[name="c-' + id + '"]:checked');
    if (!r) return;
    var changedChoice = state.choice[id] !== r.value;
    state.choice[id] = r.value; save(); rerenderItem(id);
    if (changedChoice) afterAnswer(id);
    return;
  }
  if ((b = e.target.closest('[data-send]'))) { sendExercise(b.getAttribute('data-send')); return; }
  if ((b = e.target.closest('[data-see]'))) {
    id = b.getAttribute('data-see');
    if (state.seen[id]) delete state.seen[id]; else state.seen[id] = 1;
    save(); rerenderItem(id);
  }
});
$('#main').addEventListener('change', function(e){
  var t = e.target;
  if (t.matches('input[type="radio"]')) {
    var id = t.name.slice(2), btn = document.querySelector('[data-choose="' + id + '"]');
    if (btn) btn.disabled = false;
  }
});
$('#main').addEventListener('input', function(e){
  var t = e.target;
  if (t.matches('[data-text]')) {
    var id = t.getAttribute('data-text');
    state.draft[id] = t.value; save();
    var base = id.replace(/~t$/, ''), btn = document.querySelector('[data-submit="' + base + '"]');
    var all = [document.getElementById('t-' + base), document.getElementById('t-' + base + '~t')].filter(Boolean);
    if (btn) btn.disabled = !all.every(function(x){ return x.value.trim(); });
  }
});
render();
loadComments();
})();
</script>
