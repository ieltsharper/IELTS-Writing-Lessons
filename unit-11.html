ch sentence using the given phrase or structure. Pay attention to choosing the right verb tense.<\/i>"], "items": [{"level": 1, "n": 0, "cue": "Nowadays children spend more time online.", "hint": "today's + noun", "answer": "Today's children spend more time online.", "alt": "Children today spend more time online.", "kind": "write"}, {"level": 1, "n": 1, "cue": "People used to write letters. Now they send emails.", "hint": "no longer", "answer": "People no longer write letters; they send emails instead.", "alt": "People no longer send letters; they email instead.", "kind": "write"}, {"level": 1, "n": 2, "cue": "The number of cars on the roads went up a lot recently.", "hint": "In recent years + present perfect", "answer": "In recent years, the number of cars on the roads has increased significantly.", "alt": "Over the past few years, the number of cars on the roads has risen considerably.", "kind": "write"}, {"level": 1, "n": 3, "cue": "Children who learn to cook will benefit when they are adults.", "hint": "later in life", "answer": "Children who learn to cook will benefit later in life.", "alt": "Children who learn to cook will benefit as adults.", "kind": "write"}, {"level": 1, "n": 4, "cue": "In the past, families ate together every evening.", "hint": "Traditionally", "answer": "Traditionally, families ate together every evening.", "alt": "Families traditionally ate together every evening.", "kind": "write"}, {"level": 1, "n": 5, "cue": "The Internet changed the way we work a lot.", "hint": "transform + present perfect", "answer": "The Internet has transformed the way we work.", "alt": "The Internet has revolutionised the way we work.", "kind": "write"}, {"level": 1, "n": 6, "cue": "Smartphones appeared, and people started to communicate differently.", "hint": "With the advent of", "answer": "With the advent of smartphones, the way people communicate has changed dramatically.", "alt": "The advent of smartphones has transformed the way people communicate.", "kind" eir phones.", "hint": "Whereas … traditionally …, … now … (one sentence)", "answer": "Whereas people traditionally wrote letters by hand, most now type messages on their phones.", "alt": "People used to write letters by hand, but most now type messages on their phones.", "kind": "write"}, {"level": 3, "n": 15, "cue": "Over the last thirty years, cities grew very fast, and many green spaces disappeared.", "hint": "Over the past few decades + present perfect", "answer": "Over the past few decades, cities have grown rapidly, and many green spaces have disappeared.", "alt": "In recent decades, rapid urban growth has led to the loss of many green spaces.", "kind": "write"}, {"level": 3, "n": 16, "cue": "When children grow up, those who read a lot are usually more successful.", "hint": "as adults + more likely to", "answer": "Children who read widely are more likely to be successful as adults.", "alt": "Children who read a great deal tend to be more successful later in life.", "kind": "write"}, {"level": 3, "n": 17, "cue": "The way people shop is changing completely because of online stores.", "hint": "revolutionise (continuous tense)", "answer": "Online stores are revolutionising the way people shop.", "alt": "Online retail is transforming the way people shop.", "kind": "write"}, {"level": 3, "n": 18, "cue": "People do not need cash as much now because mobile payment exists.", "hint": "With the advent of + no longer", "answer": "With the advent of mobile payment, many people no longer need to carry cash.", "alt": "The advent of mobile payment means that many people no longer carry cash.", "kind": "write"}, {"level": 3, "n": 19, "cue": "In the future, many jobs may disappear because of automation, and new jobs may appear.", "hint": "in the coming decades + may", "answer": "In the coming decades, automation may eliminate many jobs while creating new ones.", "alt": "In years to come, automation may replace many jobs but also create new types of work.", "kind": "write"}]}, {"title": "Exercise 2 — Translate, then rewrite", "intro": ["<i>Translate each sentence into natural English. Then rewrite your translation using the given structure. ● sentences give keywords; ●● and ●●● sentences give only the structure.<\/i>"], "items": [{"level": 1, "n": 0, "cue": "Trẻ em ngày nay dành nhiều thời gian trước màn hình hơn.", "kind": "translate", "rewriteWith": "<b>today's (keywords: <i>in front of screens<\/i>)<\/b>", "translation": "Children nowadays spend more time in front of screens.", "answer": "<b>Today's children spend more time in front of screens.<\/b>", "alt": "Children today spend more time in front of screens."}, {"level": 1, "n": 1, "cue": "Mọi người không còn viết thư tay nữa.", "kind": "translate", "rewriteWith": "<b>no longer (keywords: <i>by hand<\/i>)<\/b>", "translation": "People do not write letters by hand any more.", "answer": "<b>People no longer write letters by hand.<\/b>", "alt": "Letters are no longer written by hand."}, {"level": 1, "n": 2, "cue": "Trong những năm gần đây, giá nhà đã tăng mạnh.", "kind": "translate", "rewriteWith": "<b>In recent years + present perfect (keywords: <i>sharply<\/i>)<\/b>", "translation": "House prices have gone up a lot recently.", "answer": "<b>In recent years, house prices have risen sharply.<\/b>", "alt": "House prices have risen sharply in recent years."}, {"level": 1, "n": 3, "cue": "Kỹ năng nấu ăn sẽ có ích cho trẻ khi chúng trưởng thành.", "kind": "translate", "rewriteWith": "<b>later in life (keywords: <i>benefit<\/i>)<\/b>", "translation": "Cooking skills will be useful for children when they grow up.", "answer": "<b>Cooking skills will benefit children later in life.<\/b>", "alt": "Children with cooking skills will benefit as adults."}, {"level": 1, "n": 4, "cue": "Theo truyền thống, nhiều thế hệ sống chung dưới một mái nhà.", "kind": "translate", "rewriteWith": "<b>Traditionally (keywords: <i>several generations, under one roof<\/i>)<\/b>", "translation": "In the past, many generations lived together in one house.", "answer": "<b>Traditionally, several generations lived under one roof.<\/b>", "alt": "Several generations traditionally lived together in one household."}, {"level": 1, "n": 5, "cue": "Internet đã thay đổi hoàn toàn cách chúng ta học tập.", "kind": "translate", "rewriteWith": "<b>transform (keywords: <i>the way we learn<\/i>)<\/b>", "translation": "The Internet has completely changed the way we study.", "answer": "<b>The Internet has transformed the way we learn.<\/b>", "alt": "The Internet has revolutionised the way we learn."}, {"level": 1, "n": 6, "cue": "Ngày nay, nhiều người làm việc tại nhà.", "kind": "translate", "rewriteWith": "<b>these days / nowadays<\/b>", "translation": "Today, many people work at home.", "answer": "<b>These days, many people work from home.<\/b>", "alt": "Nowadays, many people work from home."}, {"level": 2, "n": 7, "cue": "Người trẻ ngày càng trở nên độc lập hơn về tài chính.", "kind": "translate", "rewriteWith": "<b>increasingly<\/b>", "translation": "Young people are more and more financially independent.", "answer": "<b>Young people are becoming increasingly financially independent.<\/b>", "alt": "Young people are increasingly able to support themselves financially."}, {"level": 2, "n": 8, "cue": "Trong nhiều thập kỷ qua, các thành phố đã mở rộng nhanh chóng.", "kind": "translate", "rewriteWith": "<b>Over the past few decades<\/b>", "translation": "Cities have grown quickly in the last few decades.", "answer": "<b>Over the past few decades, cities have expanded rapidly.<\/b>", "alt": "Cities have grown rapidly in recent decades."}, {"level": 2, "n": 9, "cue": "Với sự ra đời của điện thoại thông minh, cách chúng ta giao tiếp đã thay đổi đáng kể.", "kind": "translate", "rewriteWith": "<b>With the advent of<\/b>", "translation": "Because smartphones appeared, the way we communicate has changed a lot.", "answer": "<b>With the advent of smartphones, the way we communicate has changed considerably.<\/b>", "alt": "The advent of smartphones has considerably changed the way we communicate."}, {"level": 2, "n": 10, "cue": "Trong những năm tới, trí tuệ nhân tạo có thể thay thế nhiều công việc văn phòng.", "kind": "translate", "rewriteWith": "<b>in years to come<\/b>", "translation": "Artificial intelligence may replace many office jobs in the future.", "answer": "<b>In years to come, artificial intelligence may replace many office jobs.<\/b>", "alt": "In the coming years, AI could take over many office jobs."}, {"level": 2, "n": 11, "cue": "Trước đây, mọi người thường đi bộ hoặc đạp xe đến chỗ làm.", "kind": "translate", "rewriteWith": "<b>used to + V<\/b>", "translation": "In the past, people often walked or cycled to work.", "answer": "<b>People used to walk or cycle to work.<\/b>", "alt": "Traditionally, people walked or cycled to work."}, {"level": 2, "n": 12, "cue": "Một dự án cải tạo các tòa nhà cổ đang được tiến hành.", "kind": "translate", "rewriteWith": "<b>under way<\/b>", "translation": "A project to renovate old buildings is being carried out.", "answer": "<b>A project to restore old buildings is under way.<\/b>", "alt": "Work to restore historic buildings is under way."}, {"level": 2, "n": 13, "cue": "Cùng với sự phát triển của công nghệ là những mối lo ngại mới về quyền riêng tư.", "kind": "translate", "rewriteWith": "<b>With + N + come(s) + N<\/b>", "translation": "Together with the development of technology, there are new concerns about privacy.", "answer": "<b>With the development of technology come new concerns about privacy.<\/b>", "alt": "The development of technology has brought new concerns about privacy."}, {"level": 3, "n": 14, "cue": "Trong suốt lịch sử loài người, con người đã sử dụng động vật làm thức ăn và quần áo.", "kind": "translate", "rewriteWith": "<b>throughout the history of<\/b>", "translation": "During human history, people have used animals for food and clothes.", "answer": "<b>Throughout the history of humankind, people have used animals for food and clothing.<\/b>", "alt": "Throughout history, animals have been used for food and clothing."}, {"level": 3, "n": 15, "cue": "Trong khi trước đây người ta mua sắm ở chợ, ngày nay nhiều người mua hàng trực tuyến.", "kind": "translate", "rewriteWith": "<b>Whereas … traditionally …, … now …<\/b>", "translation": "In the past people shopped at markets, but today many people buy things online.", "answer": "<b>Whereas people traditionally shopped at markets, many now buy goods online.<\/b>", "alt": "People used to shop at markets, but many now buy goods online."}, {"level": 3, "n": 16, "cue": "Mạng xã hội đã có tác động sâu sắc đến cách giới trẻ nhìn nhận bản thân.", "kind": "translate", "rewriteWith": "<b>have a profound impact on<\/b>", "translation": "Social media has deeply affected how young people see themselves.", "answer": "<b>Social media has had a profound impact on how young people see themselves.<\/b>", "alt": "Social media has transformed the way young people see themselves."}, {"level": 3, "n": 17, "cue": "Những đứa trẻ được khuyến khích đọc sách có nhiều khả năng thành công hơn khi trưởng thành.", "kind": "translate", "rewriteWith": "<b>as adults<\/b>", "translation": "Children who are encouraged to read are more likely to succeed when they grow up.", "answer": "<b>Children who are encouraged to read are more likely to succeed as adults.<\/b>", "alt": "Children encouraged to read tend to be more successful later in life."}, {"level": 3, "n": 18, "cue": "Với sự ra đời của thanh toán di động, nhiều người không còn mang theo tiền mặt.", "kind": "translate", "rewriteWith": "<b>With the advent of + no longer<\/b>", "translation": "Because of mobile payment, many people do not carry cash any more.", "answer": "<b>With the advent of mobile payment, many people no longer carry cash.<\/b>", "alt": "Since mobile payment became available, many people have stopped carrying cash."}, {"level": 3, "n": 19, "cue": "Trong những thập kỷ tới, dân số già c "notes": ["<span class=\"tag GRA\">GRA<\/span> <i>history<\/i> nói chung không dùng <i>the<\/i> (trừ khi có <i>of<\/i>: <i>the history of …<\/i>)."]}, {"level": 3, "n": 18, "kind": "fix", "cue": "Over the past few decades, cities have expanded rapidly, and many green spaces have disappeared.", "answer": "<b>✓ <\/b>Over the past few decades, cities have expanded rapidly, and many green spaces have disappeared.", "notes": ["Đúng: hiện tại hoàn thành với <i>over the past few decades<\/i>."]}, {"level": 3, "n": 19, "kind": "fix", "cue": "In the future, all jobs will be done by robots and humans will no longer need to work.", "answer": "In the future, <s>all jobs will be done by robots and humans will no longer need to work<\/s><b> MANY ROUTINE JOBS MAY BE AUTOMATED, WHILE NEW TYPES OF WORK EMERGE<\/b>.", "notes": ["<span class=\"tag TR\">TR<\/span> Dự đoán tuyệt đối hóa; dùng <i>many<\/i> và <i>may<\/i>."]}]}, {"title": "Exercise 4 — Apply to real exam prompts", "intro": ["<i>For each prompt, write one sentence (●, ●●) using the suggested phrase, or two sentences (●●●) describing a change over time. Pay attention to verb tenses.<\/i>"], "items": [{"level": 1, "n": 0, "cue": "Art and museums · Agree/disagree", "prompt": "<i>Advances in technology have made television and other screens so realistic that people no longer need to attend live performances. To what extent do you agree or disagree?<\/i>", "hint": "no longer", "answer": "Many people no longer attend concerts in person, as they can watch high-quality recordings at home.", "kind": "write"}, {"level": 1, "n": 1, "cue": "Media and communication · Agree/disagree", "prompt": "<i>More and more people are using computers and other electronic devices to access information. Therefore, printed books, magazines and newspapers are no longer necessary. To what extent do you agree or disagree?<\/i>", "hint": "these days", "answer": "These days, many people read news on their phones rather than in printed newspapers.", "kind": "write"}, {"level": 1, "n": 2, "cue": "Media and communication · Agree/disagree", "prompt": "<i>More and more people use mobile phones and the Internet to communicate, and some people believe this is reducing their ability to communicate face to face. To what extent do you agree or disagree?<\/i>", "hint": "In recent years + present perfect", "answer": "In recent years, messaging apps have replaced many face-to-face conversations.", "kind": "write"}, {"level": 1, "n": 3, "cue": "Age, generation and gender · Agree/disagree", "prompt": "<i>People's shopping habits are influenced more by their age than by any other factor. To what extent do you agree or disagree?<\/i>", "hint": "today's + noun", "answer": "Today's older shoppers are increasingly comfortable buying goods online.", "kind": "write"}, {"level": 1, "n": 4, "cue": "Ethics · Agree/disagree", "prompt": "<i>In the modern world, it is no longer necessary to use animals for food, clothing or medicine. To what extent do you agree or disagree?<\/i>", "hint": "Traditionally", "answer": "Traditionally, animals were essential for food, clothing and transport.", "kind": "write"}, {"level": 1, "n": 5, "cue": "Climate · Agree/disagree", "prompt": "<i>The international community must take immediate action to ensure that all countries reduce their use of fossil fuels such as oil and gas. To what extent do you agree or disagree?<\/i>", "hint": "in the coming decades", "answer": "In the coming decades, countries that rely on fossil fuels may face serious energy shortages.", "kind": "write"}, {"level": 1, "n": 6, "cue": "City development · Agree/disagree", "prompt": "<i>Governments should spend more money on building new homes and roads than on restoring old buildings. To what extent do you agree or disagree?<\/i>", "hint": "Historically", "answer": "Historically, old buildings have been central to a city's identity.", "kind": "write"}, {"level": 2, "n": 7, "cue": "Education · Agree/disagree", "prompt": "<i>University students spend most of their time studying, but they should also take part in other activities. To what extent do you agree or disagree?<\/i>", "hint": "later in life", "answer": "Students who take part in clubs and voluntary work often benefit from these experiences later in life.", "kind": "write"}, {"level": 2, "n": 8, "cue": "Food and health · Discuss both views", "prompt": "<i>Scientific and technological advances have greatly changed the range and quality of the food we eat. Some people see this as an improvement, while others believe these changes are harmful. Discuss both views and give your own opinion.<\/i>", "hint": "have a profound impact on", "answer": "Scientific advances have had a profound impact on the variety of food available in supermarkets.", "kind": "write"}, {"level": 2, "n": 9, "cue": "Economy, money and trade · Discuss both views", "prompt": "<i>Shops and products are becoming increasingly similar in different parts of the world. Some people see this as a positive development, while others see it as a negative one. Discuss both views and give your own opinion.<\/i>", "hint": "With the advent of", "answer": "With the advent of global brands, shopping streets in different countries now look very similar.", "kind": "write"}, {"level": 2, "n": 10, "cue": "Education · Discuss both views", "prompt": "<i>Some people believe that studying history has little value, while others think that learning about the past helps us understand the present. Discuss both views and give your own opinion.<\/i>", "hint": "used to + V", "answer": "People used to learn about history mainly from books, but many now learn from documentaries and online videos.", "kind": "write"}, {"level": 2, "n": 11, "cue": "City development · Discuss both views", "prompt": "<i>Some people believe that cities should develop vertically, with people living and working in tall buildings, while others think cities should develop horizontally, with fewer high-rise buildings. Discuss both views and g change: use at least one time expression and one verb of change.", "answer": "Thanks to modern transport, consumers today can buy fresh produce from all over the world. However, this has had a profound impact on local farmers, who struggle to compete.", "kind": "write"}, {"level": 3, "n": 16, "cue": "Education · Advantages/disadvantages", "prompt": "<i>In some countries, university students move away from home to study in another city. Do the disadvantages of living away from home outweigh the advantages?<\/i>", "hint": "Two sentences: use at least one time expression (<i>later in life, these days, nowadays …<\/i>).", "answer": "Students who live away from home learn to manage money and time, skills that benefit them later in life. Nowadays, however, the high cost of rent makes this option less affordable.", "kind": "write"}, {"level": 3, "n": 17, "cue": "Language · Positive/negative development", "prompt": "<i>Fewer people today write by hand than in the past. Why is this the case, and is this a positive or negative development?<\/i>", "hint": "Two sentences describing change: use at least one time expression and one verb of change.", "answer": "With the advent of computers and smartphones, fewer people now write by hand. This is not necessarily negative, but children may no longer develop neat handwriting.", "kind": "write"}, {"level": 3, "n": 18, "cue": "Leisure, sports and hobbies · Positive/negative development", "prompt": "<i>Many children today spend more time playing computer games and less time doing sports. Why is this happening, and is this a positive or negative development?<\/i>", "hint": "Two sentences describing change: use at least one time expression and one verb of change.", "answer": "Today's children spend more of their free time on computer games than previous generations did. In the long term, this may lead to health problems.", "kind": "write"}, {"level": 3, "n": 19, "cue": "Traffic · Two-part question", "prompt": "<i>In some cities, people o write", "note": "<i>used to<\/i> + V nguyên mẫu."}, {"level": 1, "n": 6, "kind": "pick", "picks": [["use", "using"]], "cue": "Young people are used to <b>( use / using )<\/b> smartphones.", "answer": "using", "note": "Cấu trúc: <i>be used to<\/i> + V-ing (đã quen với)."}, {"level": 2, "n": 7, "kind": "pick", "picks": [["later of life", "later in life"]], "cue": "Children who read widely benefit <b>( later of life / later in life )<\/b>.", "answer": "later in life", "note": "Cụm cố định: <i>later in life<\/i>."}, {"level": 2, "n": 8, "kind": "pick", "picks": [["Traditionally,", "Traditional,"]], "cue": "<b>( Traditionally, / Traditional, )<\/b> families ate together every evening.", "answer": "Traditionally,", "note": "Đầu câu cần trạng từ."}, {"level": 2, "n": 9, "kind": "pick", "picks": [["transformed", "transformed to"]], "cue": "The Internet has <b>( transformed / transformed to )<\/b> the way we work.", "answer": "transformed", "note": "<i>transform<\/i> + tân ngữ trực tiếp."}, {"level": 2, "n": 10, "kind": "pick", "picks": [["With the advent", "With the advent of"]], "cue": "<b>( With the advent / With the advent of )<\/b> smartphones, communication has changed.", "answer": "With the advent of", "note": "Cụm đầy đủ: <i>with the advent of<\/i> + danh từ."}, {"level": 2, "n": 11, "kind": "pick", "picks": [["on the way", "under way"]], "cue": "Construction of a new metro line is <b>( on the way / under way )<\/b>.", "answer": "under way", "note": "<i>under way<\/i> = đang được tiến hành."}, {"level": 2, "n": 12, "kind": "pick", "picks": [["increasingly", "increasing"]], "cue": "Young people are becoming <b>( increasingly / increasing )<\/b> independent.", "answer": "increasingly", "note": "Trước tính từ cần trạng từ."}, {"level": 2, "n": 13, "kind": "pick", "picks": [["grow", "have grown"]], "cue": "Over the past few decades, cities <b>( grow / have grown )<\/b> rapidly.", "answer": "have grown", "note": "<i>Over the past few decades<\/i> + hiện tại hoàn thành."}, {"level": 3, "n": 14, "kind": "pick", "picks": [["come", "comes"]], "cue": "With the growth of tourism <b>( come / comes )<\/b> greater pressure on the environment.", "answer": "comes", "note": "Hòa hợp với <i>greater pressure<\/i> (số ít)."}, {"level": 3, "n": 15, "kind": "pick", "picks": [["come", "comes"]], "cue": "With the development of technology <b>( come / comes )<\/b> new concerns about privacy.", "answer": "come", "note": "Hòa hợp với <i>new concerns<\/i> (số nhiều)."}, {"level": 3, "n": 16, "kind": "pick", "picks": [["Throughout the history,", "Throughout history,"]], "cue": "<b>( Throughout the history, / Throughout history, )<\/b> people have used animals for transport.", "answer": "Throughout history,", "note": "<i>history<\/i> nói chung không dùng <i>the<\/i>."}, {"level": 3, "n": 17, "kind": "pick", "picks": [["on", "in"]], "cue": "Technology has had a profound impact <b>( on / in )<\/b> education.", "answer": "on", "note": "Giới từ đi kèm: <i>impact on<\/i>."}, {"level": 3, "n": 18, "kind": "pick", "picks": [["In the coming of decades,", "In the coming decades,"]], "cue": "<b>( In the coming of decades, / In the coming decades, )<\/b> automation may eliminate many jobs.", "answer": "In the coming decades,", "note": "Cụm cố định: <i>in the coming decades<\/i>."}, {"level": 3, "n": 19, "kind": "pick", "picks": [["Today's", "Nowadays'"]], "cue": "<b>( Today's / Nowadays' )<\/b> technology allows people to work from anywhere.", "answer": "Today's", "note": "<i>nowadays<\/i> không có dạng sở hữu."}]}], "after": []}], "parts": [], "guide": [], "index": []}</script>

<script>
(function(){
'use strict';
var D = JSON.parse(document.getElementById('data').textContent);
var STORE = 'wt2-11';
var state = load();
function blank(){ return {draft:{}, sub:{}, choice:{}, seen:{}, sent:{}, dirty:{}, fb:{}}; }
function load(){ try { var s = JSON.parse(localStorage.getItem(STORE)); return s && s.sub ? s : blank(); } catch(e){ return blank(); } }
function save(){ try { localStorage.setItem(STORE, JSON.stringify(state)); } catch(e){} }

var $ = function(s, r){ return (r||document).querySelector(s); };
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function dots(n){ return n ? '<span class="lv" title="Level ' + n + '">' + '●'.repeat(n) + '</span>' : ''; }
function textOf(html){ var t = document.createElement('div'); t.innerHTML = html; return t.textContent; }

/* ---------- recorded audio for the English examples (audio/<id>.mp3, made by make_audio.py) ---------- */
var AUDIO = JSON.parse(document.getElementById('audio').textContent);
var player = new Audio(), playing = null;
function speakBtn(text){
  var id = AUDIO[text];
  if (!id) return '';
  return '<button type="button" class="speak" data-audio="' + id + '" aria-label="Listen: ' + esc(text) + '" title="Listen">🔊</button>';
}
function stopAudio(){ player.pause(); if (playing) playing.classList.remove('on'); playing = null; }
player.addEventListener('ended', stopAudio);
document.addEventListener('click', function(e){
  var b = e.target.closest('[data-audio]'); if (!b) return;
  var again = playing === b;
  stopAudio();
  if (again) return;
  player.src = 'audio/' + b.getAttribute('data-audio') + '.mp3';
  playing = b; b.classList.add('on');
  player.play().catch(stopAudio);
});

/* ---------- progress ---------- */
function ids(u){ var out = []; u.exercises.forEach(function(ex, k){ ex.items.forEach(function(it){ out.push(u.num + '-' + (k + 1) + '-' + it.n); }); }); return out; }
function isDone(id){ return !!(state.sub[id] || state.choice[id] || state.seen[id]); }
var ALL = [].concat.apply([], D.units.map(ids));
function updateProgress(){
  var n = ALL.filter(isDone).length;
  $('#progressText').textContent = 'Done: ' + n + '/' + ALL.length + ' items';
  $('#progressBar').style.width = (100 * n / ALL.length) + '%';
}
$('#reset').addEventListener('click', function(){
  if (!confirm('Clear everything you wrote, submitted and chose in this browser?')) return;
  state = blank(); save(); render();
});

/* ---------- header and tabs ---------- */
// One page per unit; D.nav lists every page (index + units) for the tab bar.
$('#title').textContent = D.cover[0];
$('#cover').innerHTML = D.cover.slice(1).map(function(c, i, a){
  return '<p class="standfirst' + (i === a.length - 1 ? ' small' : '') + '">' + esc(c) + '</p>';
}).join('');
$('#tabs').innerHTML = D.nav.map(function(t){ return '<a href="' + t.href + '"' + (t.current ? ' aria-current="page"' : '') + '>' + esc(t.label) + '</a>'; }).join('');
function unitTitle(u){ return u.num === 'review' ? u.name : 'Unit ' + u.num + ' · ' + u.name; }

function route(){
  return {tab: {unit: D.units[0]}, part: location.hash.replace('#', '') || 'ly-thuyet'};
}
var filter = 0;

/* ---------- index page: all units with progress, then the guide ---------- */
function renderBlocks(list){
  var s = '', card = '', open = false;
  function flush(){ if (open) { card += '</ul>'; open = false; } if (card) s += '<div class="card">' + card + '</div>'; card = ''; }
  list.forEach(function(b){
    if (b.type === 'h1') { flush(); s += '<h2 style="margin-top:28px">' + esc(b.text) + '</h2>'; }
    else if (b.type === 'h') { flush(); card = '<h4>' + b.html + '</h4>'; }
    else if (b.type === 'li') { if (!open) { card += '<ul class="plain">'; open = true; } card += '<li>' + b.html + '</li>'; }
    else if (b.type === 'table') { flush(); s += renderTable(b); }
    else { if (open) { card += '</ul>'; open = false; } card += '<p>' + b.html + '</p>'; }
  });
  flush();
  return s;
}
function renderIndex(){
  var s = '<h2>Units</h2>';
  D.parts.forEach(function(p){
    s += '<p class="part-title">' + esc(p.title) + '</p><div class="boxes">' + p.units.map(function(n){
      var u = D.index.find(function(x){ return x.num === n; }), done = 0;
      try { var st = JSON.parse(localStorage.getItem(u.store)) || {}; done = Object.keys(Object.assign({}, st.sub, st.choice)).length; } catch(e){}
      return '<a class="card" style="text-decoration:none;color:inherit;display:block;margin:0" href="' + u.href + '"><h4 style="color:var(--heading)">' + esc(unitTitle(u)) + '</h4><span class="note">Done: ' + Math.min(done, u.count) + '/' + u.count + '</span></a>';
    }).join('') + '</div>';
  });
  return s + renderBlocks(D.guide);
}

/* ---------- theory ---------- */
function renderTable(b){
  var vocab = b.head[0] === 'Cụm từ' || b.head[0] === 'Phrase', speakLast = vocab || /câu trả lời mở rộng|extended answer/i.test(b.head[b.head.length - 1]);
  var rows = b.rows.filter(function(r){ return !filter || !r.level || r.level === filter; });
  return '<div class="tablewrap"><table><thead><tr>' + b.head.map(function(h){ return '<th scope="col">' + esc(h) + '</th>'; }).join('') + '</tr></thead><tbody>' +
    rows.map(function(r){
      return '<tr>' + r.cells.map(function(c, i){
        if (i === 0 && vocab) return '<td class="phrase">' + dots(r.level) + ' ' + c + '</td>';
        if (i === r.cells.length - 1 && speakLast) return '<td>' + c + speakBtn(textOf(c)) + '</td>';
        return '<td' + (vocab && i === 1 ? ' class="muted"' : '') + '>' + c + '</td>';
      }).join('') + '</tr>';
    }).join('') + '</tbody></table></div>';
}
function sampleSpeech(html){

  var r = route();
  document.querySelectorAll('#tabs a').forEach(function(a){
    if (a.getAttribute('href') === '#' + r.tab.id) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
  });
  var m = $('#main');
  if (!D.units.length) { m.innerHTML = renderIndex(); $('.progress-all').style.display = 'none'; return; }
  m.innerHTML = renderUnit(r.tab.unit, r.part);
  updateProgress();
}
function rerenderItem(id){
  var old = document.querySelector('.item[data-id="' + id + '"]'), p = id.split('-');
  var tmp = document.createElement('div');
  var item = findItem(id);
  tmp.innerHTML = renderItem(item, id, D.units.find(function(x){ return String(x.num) === p[0]; }).exercises[+p[1] - 1].items.indexOf(item));
  old.replaceWith(tmp.firstChild);
  updateProgress();
  var chip = document.querySelector('.subnav a[aria-pressed="true"] small');
  if (chip) { var ex = D.units.find(function(x){ return String(x.num) === p[0]; }).exercises[+p[1] - 1];
    chip.textContent = ex.items.filter(function(it){ return isDone(p[0] + '-' + p[1] + '-' + it.n); }).length + '/' + ex.items.length; }
}

/* ---------- events ---------- */
var lastTab = route().tab.id;
window.addEventListener('hashchange', function(){
  render();
  var t = route().tab.id;
  window.scrollTo(0, t === lastTab ? Math.min(window.scrollY, $('nav.tabs').offsetTop) : 0);
  lastTab = t;
});
$('#main').addEventListener('click', function(e){
  var b, id;
  if ((b = e.target.closest('[data-filter]'))) { filter = +b.getAttribute('data-filter'); var y = window.scrollY; render(); window.scrollTo(0, y); return; }
  if ((b = e.target.closest('[data-submit]'))) {
    id = b.getAttribute('data-submit');
    var t = document.getElementById('t-' + id).value.trim(), tt = document.getElementById('t-' + id + '~t');
    if (!t || (tt && !tt.value.trim())) return;
    if (tt) { t = 'Translation: ' + tt.value.trim() + '\nRewrite: ' + t; delete state.draft[id + '~t']; }
    var changed = state.sub[id] !== t;
    state.sub[id] = t; delete state.draft[id]; save(); rerenderItem(id);
    var a = document.getElementById('a-' + id); if (a) a.scrollIntoView({block: 'nearest'});
    var f = (state.fb || {})[id];
    if (!f || f.for !== t || f.kind !== 'ai') assess(findItem(id), id);
    if (changed) afterAnswer(id);
    return;
  }
  if ((b = e.target.closest('[data-choose]'))) {
    id = b.getAttribute('data-choose');
    var r = document.querySelector('input[name="c-' + id + '"]:checked');
    if (!r) return;
    var changedChoice = state.choice[id] !== r.value;
    state.choice[id] = r.value; save(); rerenderItem(id);
    if (changedChoice) afterAnswer(id);
    return;
  }
  if ((b = e.target.closest('[data-send]'))) { sendExercise(b.getAttribute('data-send')); return; }
  if ((b = e.target.closest('[data-see]'))) {
    id = b.getAttribute('data-see');
    if (state.seen[id]) delete state.seen[id]; else state.seen[id] = 1;
    save(); rerenderItem(id);
  }
});
$('#main').addEventListener('change', function(e){
  var t = e.target;
  if (t.matches('input[type="radio"]')) {
    var id = t.name.slice(2), btn = document.querySelector('[data-choose="' + id + '"]');
    if (btn) btn.disabled = false;
  }
});
$('#main').addEventListener('input', function(e){
  var t = e.target;
  if (t.matches('[data-text]')) {
    var id = t.getAttribute('data-text');
    state.draft[id] = t.value; save();
    var base = id.replace(/~t$/, ''), btn = document.querySelector('[data-submit="' + base + '"]');
    var all = [document.getElementById('t-' + base), document.getElementById('t-' + base + '~t')].filter(Boolean);
    if (btn) btn.disabled = !all.every(function(x){ return x.value.trim(); });
  }
});
render();
loadComments();
})();
</script>
</body>
</html>
