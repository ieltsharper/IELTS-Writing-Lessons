<style>
/* IELTS Harper Portal look (same tokens as the Speaking band descriptors page). */
:root{
  --page:#f7f5f2; --card:#ffffff; --line:#e7e5e4; --line-strong:#d6d3d1;
  --ink:#1c1917; --muted:#57534e; --heading:#f96c1b;
  --brand:#c2410c; --brand-hover:#9a3412; --on-brand:#ffffff; --brand-soft:#fff7ed;
  --hl:#ffedd5;
  --ok:#065f46; --ok-soft:#ecfdf5; --no:#991b1b; --no-soft:#fef2f2;
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light dark;
}
@media (prefers-color-scheme: dark){
  :root{
    --page:#171311; --card:#221c19; --line:#3a302b; --line-strong:#4f433c;
    --ink:#f5f0eb; --muted:#b8aca3; --brand-soft:#3a2416; --hl:#5a3418;
    --ok:#6ee7b7; --ok-soft:#12302a; --no:#fca5a5; --no-soft:#3b1d1d;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--page);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6}
.wrap{max-width:1000px;margin:0 auto;padding:0 20px}
a{color:var(--brand)}
button,textarea,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* top bar, as in the portal */
.topbar{background:var(--card);border-bottom:1px solid var(--line)}
.topbar .wrap{padding-top:12px;padding-bottom:12px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:inline-flex;align-items:center;gap:10px;color:var(--heading);font-weight:700;font-size:1.15rem;text-decoration:none;margin-right:auto}
.brand-mark{display:grid;place-items:center;width:36px;height:36px;border-radius:10px;background:var(--brand);color:var(--on-brand);font-size:.85rem;font-weight:800}
.topbar-link{color:var(--ink);font-weight:600;font-size:.9rem;text-decoration:none;border:1px solid var(--line);border-radius:12px;padding:6px 12px}
.topbar-link:hover{background:var(--brand-soft)}

/* masthead */
header.mast .wrap{padding-top:28px}
.hero{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px 26px}
.eyebrow{display:inline-block;font-size:.75rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--brand);background:var(--brand-soft);border-radius:999px;padding:3px 10px;margin:0 0 10px}
h1{color:var(--heading);font-weight:700;font-size:clamp(1.5rem,3.6vw,2.1rem);line-height:1.2;margin:0 0 8px}
.standfirst{margin:0;color:var(--muted)}
.standfirst.small{font-size:.9rem;font-style:italic}
.progress-all{margin-top:16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:.9rem;color:var(--muted)}
.bar{flex:1;min-width:160px;height:8px;background:var(--line);border-radius:999px;overflow:hidden}
.bar span{display:block;height:100%;background:var(--brand);width:0}

/* section tabs */
nav.tabs{position:sticky;top:0;z-index:40;background:var(--page);border-bottom:1px solid var(--line);margin-top:20px}
nav.tabs .wrap{display:flex;gap:6px;overflow-x:auto;padding-top:10px;padding-bottom:10px}
nav.tabs a{border:1px solid transparent;border-radius:12px;padding:8px 14px;white-space:nowrap;color:var(--muted);font-size:.93rem;font-weight:600;text-decoration:none}
nav.tabs a:hover{background:var(--brand-soft);color:var(--ink)}
nav.tabs a[aria-current="page"]{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
main{padding:28px 0 80px}
h2{color:var(--heading);font-weight:700;font-size:1.45rem;margin:0 0 6px}
h3{font-weight:700;font-size:1.12rem;margin:30px 0 10px}
h4{font-weight:700;font-size:1rem;margin:0 0 8px}
.lede{color:var(--muted);margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin-bottom:14px}
.card p{margin:0 0 8px}.card p:last-child{margin-bottom:0}
ul.plain{margin:4px 0 12px;padding-left:22px}
ul.plain li{margin-bottom:6px}

/* unit sub-navigation and level filter */
.subnav{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 12px;margin:14px 0 18px}
.chip{border:1px solid var(--line-strong);background:var(--card);border-radius:999px;padding:6px 14px;cursor:pointer;font-size:.88rem;font-weight:600;color:var(--muted)}
.chip:hover{background:var(--brand-soft);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.chip small{font-weight:500;opacity:.85}
.sep{width:1px;height:22px;background:var(--line);margin:0 4px}
.filter-label{font-size:.82rem;color:var(--muted);margin-left:auto}
.lv{color:var(--brand);letter-spacing:1px;font-size:.8rem;white-space:nowrap}

/* tables */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--card);margin-bottom:14px}
table{border-collapse:collapse;width:100%;font-size:.94rem}
th,td{text-align:left;vertical-align:top;padding:9px 12px;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
th{background:var(--brand);color:var(--on-brand);font-weight:700;font-size:.85rem}
td.phrase{font-weight:700;white-space:nowrap}
td.muted{color:var(--muted)}
.speak{border:1px solid var(--line-strong);background:var(--card);border-radius:999px;width:28px;height:28px;cursor:pointer;font-size:.8rem;vertical-align:middle;margin-left:6px;padding:0;line-height:1}
.speak:hover{background:var(--brand-soft)}
.speak.on{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}

/* boxes */
.boxes{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.box h4{color:var(--brand)}
.mistake{border-top:1px solid var(--line);padding-top:10px;margin-top:10px}
.mistake:first-of-type{border-top:0;margin-top:0;padding-top:0}
.bad{color:var(--no)}.good{color:var(--ok)}
.bad::before{content:"✗ ";font-weight:700}.good::before{content:"✓ ";font-weight:700}
.note{color:var(--muted);font-size:.92rem}
.sample{margin-bottom:10px}
.sample .q{font-weight:700}
.formula{background:var(--brand-soft);border-left:4px solid var(--brand);border-radius:8px;padding:10px 14px;margin:0 0 12px}

/* exercise items */
.item{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin-bottom:12px}
.item.done{border-color:var(--ok)}
.item-head{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.num{display:inline-grid;place-items:center;min-width:28px;height:28px;border-radius:8px;background:var(--brand-soft);color:var(--brand);font-weight:800;font-size:.85rem}
.cue{font-weight:700;font-size:1.05rem;flex:1;min-width:200px}
.examiner{color:var(--muted);font-weight:600;font-size:.85rem;margin-right:4px}
.lines{margin:8px 0 0 38px;font-size:.95rem}
.lines div{margin-bottom:3px}
.label{display:inline-block;min-width:78px;color:var(--muted);font-size:.85rem;font-weight:600}
.hint{color:var(--muted);font-style:italic}
.work{margin:12px 0 0 38px}
textarea{width:100%;min-height:58px;resize:vertical;border:1px solid var(--line-strong);border-radius:10px;padding:8px 10px;background:var(--page)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;align-items:center}
.btn{border:1px solid var(--line-strong);background:var(--card);border-radius:10px;padding:6px 12px;cursor:pointer;font-size:.88rem;font-weight:600}
.btn:hover{background:var(--brand-soft)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.primary:hover{background:var(--brand-hover)}
.btn[aria-pressed="true"]{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.answer{margin-top:10px;border-top:1px dashed var(--line-strong);padding-top:10px}
.answer .main{font-weight:600}
.answer .alt{margin-top:6px}
.empty{color:var(--muted);font-style:italic}

/* question bank */
.search{width:100%;max-width:420px;border:1px solid var(--line-strong);border-radius:12px;padding:8px 12px;background:var(--card);margin-bottom:14px}

footer{color:var(--muted);font-size:.85rem;padding:20px 0 40px;border-top:1px solid var(--line)}
@media (max-width:600px){.lines,.work{margin-left:0}.filter-label{margin-left:0;width:100%}}
@media print{
  .topbar,nav.tabs,.subnav,.actions,.speak,textarea,.progress-all,footer{display:none!important}
  section[hidden]{display:block!important}
  .answer[hidden]{display:block!important}
  body{background:#fff}
  .item,.card{break-inside:avoid}
}
.btn:disabled{opacity:.5;cursor:not-allowed}
.opts{display:grid;gap:6px;margin:10px 0 0 38px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer;background:var(--page)}
.opt:hover{background:var(--brand-soft)}
.opt input{margin-top:5px;accent-color:var(--brand)}
.opt b{min-width:1.2em}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--no);background:var(--no-soft)}
.verdict{font-weight:700;margin-bottom:4px}
.verdict.ok{color:var(--ok)}.verdict.no{color:var(--no)}
.mine{background:var(--page);border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-bottom:8px;white-space:pre-wrap}
.part-title{font-size:.78rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:22px 0 8px}
.read-cue{font-size:1.08rem}
.send-box{margin:0 0 14px}
.send-box:empty{display:none}
.send-msg{margin:0;padding:10px 14px;border:1px dashed var(--line-strong);border-radius:12px;background:var(--card);font-size:.92rem;color:var(--muted)}
.send-msg .btn{margin-left:6px}
.teacher-note{border-left:4px solid var(--brand);background:var(--brand-soft);border-radius:10px;padding:10px 14px;margin-bottom:8px;white-space:pre-wrap}
.teacher-note b{color:var(--brand);display:block;margin-bottom:2px}
.fb{border:1px solid var(--line);border-left:4px solid var(--brand);border-radius:10px;padding:10px 14px;margin:0 0 10px;background:var(--card)}
.fb.great{border-left-color:var(--ok)}.fb.needs_work{border-left-color:var(--no)}
.fb-head{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;margin-bottom:4px}
.fb-head b{color:var(--ink)}
.fb-tag{font-size:.75rem;font-weight:700;border-radius:999px;padding:1px 9px;background:var(--brand-soft);color:var(--brand)}
.fb.great .fb-tag{background:var(--ok-soft);color:var(--ok)}.fb.needs_work .fb-tag{background:var(--no-soft);color:var(--no)}
.fb ul{margin:6px 0 0;padding-left:20px}.fb li{margin-bottom:3px}
.fb .wrong{color:var(--no);text-decoration:line-through}.fb .right{color:var(--ok);font-weight:600}
.fb-small{font-size:.8rem;color:var(--muted);margin-top:6px}
/* Writing: criterion colours (TR red, CC orange, LR blue, GRA purple), corrections, exam prompts */
.tag{display:inline-block;font-size:.72rem;font-weight:800;border-radius:6px;padding:0 6px;color:#1c1917;font-style:normal}
.tag.TR{background:#F4CCCC}.tag.CC{background:#FCE5CD}.tag.LR{background:#CFE2F3}.tag.GRA{background:#D9D2E9}
s{color:var(--no)}
.prompt{margin:8px 0 0 38px;border-left:3px solid var(--line-strong);padding:4px 12px;color:var(--ink);font-size:.95rem}
.ref{font-size:.75rem;font-weight:700;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:0 8px;margin-left:6px}
.wc{font-size:.8rem;color:var(--muted)}
@media (max-width:600px){.prompt{margin-left:0}}
</style>

le realise how important they are.", "alt": "Only when green spaces disappear do people realise their value.", "kind": "write"}]}, {"title": "Exercise 2 — Translate, then rewrite", "intro": ["<i>Translate each sentence into natural English. Then rewrite your translation using the given structure. ● sentences give keywords; ●● and ●●● sentences give only the structure.<\/i>"], "items": [{"level": 1, "n": 0, "cue": "Tự động hóa không chỉ giảm chi phí mà còn cải thiện an toàn.", "kind": "translate", "rewriteWith": "<b>Not only … but also (inversion)<\/b>", "translation": "Automation not only reduces costs but also improves safety.", "answer": "<b>Not only does automation cut costs, but it also improves safety.<\/b>", "alt": "Not only does automation reduce costs, but it also makes work safer."}, {"level": 1, "n": 1, "cue": "Người trẻ hiếm khi đọc báo giấy.", "kind": "translate", "rewriteWith": "<b>Rarely<\/b>", "translation": "Young people rarely read printed newspapers.", "answer": "<b>Rarely do young people read printed newspapers.<\/b>", "alt": "Rarely do young people buy printed newspapers."}, {"level": 1, "n": 2, "cue": "Chưa bao giờ thông tin lại dễ tiếp cận như vậy.", "kind": "translate", "rewriteWith": "<b>Never before<\/b>", "translation": "Information has never been so easy to access.", "answer": "<b>Never before has information been so easy to access.<\/b>", "alt": "Never before has it been so easy to find information."}, {"level": 1, "n": 3, "cue": "Nhiều người tiêu dùng hầu như không nhận ra họ đang chia sẻ bao nhiêu dữ liệu.", "kind": "translate", "rewriteWith": "<b>Little<\/b>", "translation": "Many consumers hardly realise how much data they are sharing.", "answer": "<b>Little do many consumers realise how much data they share.<\/b>", "alt": "Little do consumers know how much personal data they share."}, {"level": 1, "n": 4, "cue": "Chỉ khi giao thông công cộng được cải thiện, người dân mới để xe ở nhà.", "kind": "translate", "rewriteWith": "<b>Only when<\/b>", "translation": "People will leave their cars at home only when public transport improves.", "answer": "<b>Only when public transport improves will people leave their cars at home.<\/b>", "alt": "Only when public transport becomes more reliable will people stop driving."}, {"level": 1, "n": 5, "cue": "Chỉ bằng cách đầu tư vào giáo dục thì nghèo đói mới có thể được giảm bớt.", "kind": "translate", "rewriteWith": "<b>Only by<\/b>", "translation": "Poverty can only be reduced by investing in education.", "answer": "<b>Only by investing in education can poverty be reduced.<\/b>", "alt": "Only by investing in education can governments reduce poverty."}, {"level": 1, "n": 6, "cue": "Mãi đến những năm 1990, hầu hết mọi người mới có Internet.", "kind": "translate", "rewriteWith": "<b>Not until<\/b>", "translation": "Most people did not have the Internet until the 1990s.", "answer": "<b>Not until the 1990s did most people have access to the Internet.<\/b>", "alt": "Not until the 1990s did the Internet become widely available."}, {"level": 2, "n": 7, "cue": "Trong bất kỳ trường hợp nào, trẻ em cũng không nên bị để một mình trên mạng mà không có sự giám sát.", "kind": "translate", "rewriteWith": "<b>Under no circumstances<\/b>", "translation": "Children should never be left online without supervision.", "answer": "<b>Under no circumstances should children be left unsupervised online.<\/b>", "alt": "In no way should children be left unsupervised online."}, {"level": 2, "n": 8, "cue": "Tình trạng thiếu nhà ở nghiêm trọng đến mức nhiều người lao động trẻ phải sống xa nơi làm việc.", "kind": "translate", "rewriteWith": "<b>So + adj + be + N + that<\/b>", "translation": "The housing shortage is so serious that many young workers have to live far from their workplaces.", "answer": "<b>So severe is the housing shortage that many young workers live far from their jobs.<\/b>", "alt": "So serious is the housing shortage that many young workers live a long way from work."}, {"lev rmation been so easy to access.", "answer": "<b>✓ <\/b>Never before has information been so easy to access.", "notes": ["Đúng: <i>Never before<\/i> + <i>has<\/i> + chủ ngữ + V3."]}, {"level": 1, "n": 4, "kind": "fix", "cue": "Not until the 1990s most people had Internet access.", "answer": "Not until the 1990s <s>most people had<\/s><b> DID MOST PEOPLE HAVE<\/b> Internet access.", "notes": ["<span class=\"tag GRA\">GRA<\/span> Sau <i>Not until<\/i> đầu câu dùng <i>did<\/i> + S + V."]}, {"level": 1, "n": 5, "kind": "fix", "cue": "No sooner had the policy been introduced when congestion fell.", "answer": "No sooner had the policy been introduced <s>when<\/s><b> THAN<\/b> congestion fell.", "notes": ["<span class=\"tag GRA\">GRA<\/span> Cặp cố định: <i>No sooner … than<\/i>."]}, {"level": 1, "n": 6, "kind": "fix", "cue": "Hosting the Olympics not only needs to consume huge resources but also increasing the number of tourists.", "answer": "Hosting the Olympics <s>not only needs to consume<\/s><b> NOT ONLY CONSUMES<\/b> huge resources <s>but also increasing<\/s><b> BUT ALSO INCREASES<\/b> the number of tourists.", "notes": ["<span class=\"tag GRA\">GRA<\/span> <i>needs to consume<\/i> diễn đạt gượng; dùng <i>consumes<\/i>.", "<span class=\"tag GRA\">GRA<\/span> Hai vế sau <i>not only … but also<\/i> phải song song, cùng dạng động từ chia (<i>consumes … increases<\/i>)."]}, {"level": 2, "n": 7, "kind": "fix", "cue": "Only when public transport improves will people leave their cars at home.", "answer": "<b>✓ <\/b>Only when public transport improves will people leave their cars at home.", "notes": ["Đúng: đảo ở mệnh đề chính, không đảo trong mệnh đề <i>Only when<\/i>."]}, {"level": 2, "n": 8, "kind": "fix", "cue": "Only when public transport improves people will leave their cars at home.", "answer": "Only when public transport improves <s>people will leave<\/s><b> WILL PEOPLE LEAVE<\/b> their cars at home.", "notes": ["<span class=\"tag GRA\">GRA<\/span> Mệnh đề chính sau < : "Not only does tourism create jobs, but it also helps to preserve local crafts.", "answer": "<b>✓ <\/b>Not only does tourism create jobs, but it also helps to preserve local crafts.", "notes": ["Đúng: đảo ở vế đầu, vế sau giữ trật tự bình thường."]}, {"level": 3, "n": 16, "kind": "fix", "cue": "Not only does tourism create jobs, but also it helps to preserve local crafts.", "answer": "Not only does tourism create jobs, <s>but also it helps<\/s><b> BUT IT ALSO HELPS<\/b> to preserve local crafts.", "notes": ["<span class=\"tag GRA\">GRA<\/span> Vế sau: <i>but<\/i> + S + <i>also<\/i> + V."]}, {"level": 3, "n": 17, "kind": "fix", "cue": "Never before people have been so connected.", "answer": "<s>Never before people have been<\/s><b> NEVER BEFORE HAVE PEOPLE BEEN<\/b> so connected.", "notes": ["<span class=\"tag GRA\">GRA<\/span> Đảo <i>have<\/i> lên trước chủ ngữ."]}, {"level": 3, "n": 18, "kind": "fix", "cue": "Only by investing in public transport can cities reduce congestion.", "answer": "<b>✓ <\/b>Only by investing in public transport can cities reduce congestion.", "notes": ["Đúng: <i>Only by<\/i> + V-ing, <i>can<\/i> + S + V."]}, {"level": 3, "n": 19, "kind": "fix", "cue": "Rarely governments solve problems quickly, so never they gain public trust.", "answer": "<s>Rarely governments solve<\/s><b> RARELY DO GOVERNMENTS SOLVE<\/b> problems quickly, so <s>never they gain public trust<\/s><b> THEY SELDOM GAIN PUBLIC TRUST<\/b>.", "notes": ["<span class=\"tag GRA\">GRA<\/span> Thiếu trợ động từ sau <i>Rarely<\/i>.", "<span class=\"tag TR\">TR<\/span> Tuyệt đối hóa (<i>never<\/i>) và sai trật tự; hai đảo ngữ trong một câu cũng là lạm dụng."]}]}, {"title": "Exercise 4 — Apply to real exam prompts", "intro": ["<i>For each prompt, write one sentence (●, ●●) using the suggested inversion structure, or two sentences (●●●) using two different inversion structures.<\/i>"], "items": [{"level": 1, "n": 0, "cue": "City development · Agree/disagree", "prompt": "<i>It is more important for a building to be practical than to be beautiful, so architects should not treat buildings as works of art. To what extent do you agree or disagree?<\/i>", "hint": "Not only … but also (inversion)", "answer": "Not only does a beautiful building attract visitors, but it also improves the quality of life of those who use it.", "kind": "write"}, {"level": 1, "n": 1, "cue": "Education · Agree/disagree", "prompt": "<i>It is more important for schoolchildren to learn about local history than world history. To what extent do you agree or disagree?<\/i>", "hint": "Only by", "answer": "Only by learning about world history can children understand how their own country fits into the wider world.", "kind": "write"}, {"level": 1, "n": 2, "cue": "Education · Agree/disagree", "prompt": "<i>The main purpose of schools is to prepare children to become good citizens and workers rather than to benefit them as individuals. To what extent do you agree or disagree?<\/i>", "hint": "Not only … but also (inversion)", "answer": "Not only should schools prepare children for work, but they should also help them develop as individuals.", "kind": "write"}, {"level": 1, "n": 3, "cue": "Language · Agree/disagree", "prompt": "<i>Some people believe that not all children have a natural ability to learn a foreign language and that it is therefore wrong to make every child study one at school. To what extent do you agree or disagree?<\/i>", "hint": "Rarely", "answer": "Rarely do children who lack confidence in languages enjoy compulsory lessons.", "kind": "write"}, {"level": 1, "n": 4, "cue": "Leisure, sports and hobbies · Agree/disagree", "prompt": "<i>Parents should encourage their children to spend less time studying and more time taking part in sports and physical activities. To what extent do you agree or disagree?<\/i>", "hint": "Only when", "answer": "Only when children balance study with exercise do they stay healthy and focused.", "kind": "write"}, {"level": 1, "n": 5, "cue": "Lifestyle · Agree/disagree", "prompt": "<i>The popularity of fashions in clothes and other consumer goods shows that people tend to copy one another. To what extent do you agree or disagree?<\/i>", "hint": "Seldom", "answer": "Seldom do young people choose clothes that their friends would consider unfashionable.", "kind": "write"}, {"level": 1, "n": 6, "cue": "Media and communication · Agree/disagree", "prompt": "<i>Although more people now read news online, newspapers still have an important role to play. To what extent do you agree or disagree?<\/i>", "hint": "Never before", "answer": "Never before has so much unreliable information been available online, which is why newspapers remain important.", "kind": "write"}, {"level": 2, "n": 7, "cue": "Travelling and tourism · Agree/disagree", "prompt": "<i>Some people believe that foreign visitors should pay higher entrance fees than local people at tourist attractions. To what extent do you agree or disagree?<\/i>", "hint": "Rarely", "answer": "Rarely do higher entrance fees stop foreign tourists from visiting major attractions, so a modest surcharge seems reasonable.", "kind": "write"}, {"level": 2, "n": 8, "cue": "Art and museums · Discuss both views", "prompt": "<i>Some people believe that museums should be free to enter, while others think visitors should pay an admission fee. Discuss both views and give your own opinion.<\/i>", "hint": "Only if", "answer": "Only if museums are free will many low-income families visit them.", "kind": "write"}, {"level": 2, "n": 9, "cue": "Education · Discuss both views", "prompt": "<i>Some people believe that secondary school students should study international news as a school subject, while others think this would waste valuable school time. Discuss both views and give your own opinion.<\/i>", "hint": "Little", "answer": "Little do many teenagers know about events outside their own country.", "kind": "write"}, {"level": 2, "n": 10, "cue": "Education · Discuss both views", "prompt": "<i>Some people believe that computers and the Internet are more important than schools and teachers in children's education, while others disagree. Discuss both views and give your own opinion.<\/i>", "hint": "Not until", "answer": "Not until children learn to judge online sources critically can the Internet replace a good teacher.", "kind": "write"}, {"level": 2, "n": 11, "cue": "Environment · Discuss both views", "prompt": "<i>Some people believe that economic growth is necessary to reduce poverty, while others argue that economic growth should be limited because it damages the environment. Discuss both views and give your own opinion.<\/i>", "hint": "Such is … that", "answer": "Such is the scale of environmental damage in some regions that economic growth there must be carefully controlled.", "kind": "write"}, {"level": 2, "n": 12, "cue": "Crime, punishment and law · Discuss both views", "prompt": "<i>Some people believe that the best way to reduce crime is to give criminals longer prison sentences, while others think that alternative methods are more effective. Discuss both views and give your own opinion.<\/i>", "hint": "Only by", "answer": "Only by addressing the causes of crime can governments reduce reoffending.", "kind": "write"}, {"level": 2, "n": 13, "cue": "Art and museums · Causes/problems/solutions", "prompt": "<i>In many places, museums and historical sites are visited mainly by tourists rather than local people. Why is this the case, and what can be done to attract more local visitors?<\/i>", "hint": "So + adj + be + N + that", "answer": "So high are admission prices at some museums that local families rarely visit them.", "kind": "write"}, {"level": 3, "n": 14, "cue": "Education · Causes/problems/solutions", "prompt": "<i>Many people leave school with a negative attitude towards learning. Why does this happen, and what can be done to encourage a more positive attitude?<\/i>", "hint": "Two sentences, each using a different inversion structure.", "answer": "Rarely do students enjoy learning when lessons focus only on exams. Only by making lessons relevant to real life can teachers change this attitude.", "kind": "write"}, {"level": 3, "n": 15, "cue": "Science, technology and innovation · Advantages/disadvantages", "prompt": "<i>Machines are becoming increasingly complex, and more and more work is being automated. Do the advantages of automation outweigh the disadvantages?<\/i>", "hint": "Two sentences, each using a different inversion structure.", "answer": "Not only does automation increase productivity, but it also removes workers from dangerous tasks. Only if workers are retrained, however, will its benefits be shared fairly.", "kind": "write"}, {"level": 3, "n": 16, "cue": "Crime, punishment and law · Advantages/disadvantages", "prompt": "<i>In some countries, criminal trials are shown on television so that members of the public can watch them. Do the advantages of broadcasting court cases outweigh the disadvantages?<\/i>", "hint": "Two sentences, each using a different inversion structure.", "answer": "Not only would televised trials make justice more transparent, but they would also educate the public about the law. Under no circumstances, however, should victims' identities be revealed.", "kind": "write"}, {"level": 3, "n": 17, "cue": "Media and communication · Positive/negative development", "prompt": "<i>Many young people admire media and sports stars who do not always set a good example. Is this a positive or negative development?<\/i>", "hint": "Two sentences, each using a different inversion structure.", "answer": "Seldom do young fans distinguish between a star's talent and his or her behaviour. Only when the media highlight positive role models will this begin to change.", "kind": "write"}, {"level": 3, "n": 18, "cue": "Traffic · Positive/negative development", "prompt": "<i>Some cities have introduced congestion charges during busy periods in order to reduce traffic. Is this a positive or negative development?<\/i>", "hint": "Two sentences, each using a different inversion structure.", "answer": "Not only do congestion charges reduce traffic, but they also raise money for public transport. Only if the money is reinvested, however, will drivers accept them.", "kind": "write"}, {"level": 3, "n": 19, "cue": "Socio-cultural and global issues · Two-part question", "prompt": "<i>Some people believe that the human race is steadily improving in every area of life. In which areas have we made the most important progress, and in which areas do we still need to make further progress?<\/i>", "hint": "Two sentences, each using a different inversion structure.", "answer": "Never before has medical science saved so many lives. Rarely, however, have we made similar progress in reducing inequality.", "kind": "write"}]}, {"title": "Exercise 5 — Choose the correct word order", "intro": ["<i>Choose the correct option.<\/i>"], "items": [{"level": 1, "n": 0, "kind": "pick", "picks": [["young people read", "do young people read"]], "cue": "Rarely <b>( young people read / do young people read )<\/b> printed newspapers.", "answer": "do young people read", "note": "Sau <i>Rarely<\/i> đầu câu phải đảo trợ động từ."}, {"level": 1, "n": 1, "kind": "pick", "picks": [["automation cuts", "does automation cut"]], "cue": "Not only <b>( automation cuts / does automation cut )<\/b> costs, but it also improves safety.", "answer": "does automation cut", "note": "<i>Not only<\/i> đầu câu → đảo trợ động từ."}, {"level": 1, "n": 2, "kind": "pick", "picks": [["can poverty be", "poverty can be"]], "cue": "Only by investing in education <b>( can poverty be / poverty can be )<\/b> reduced.", "answer": "can poverty be", "note": "Đảo ở mệnh đề chính sau <i>Only by<\/i>."}, {"level": 1, "n": 3, "kind": "pick", "picks": [["has information been", "information has been"]], "cue": "Never before <b>( has information been / information has been )<\/b> so easy to access.", "answer": "has information been", "note": "Sau <i>Never before<\/i> phải đảo <i>has<\/i>."}, {"level": 1, "n": 4, "kind": "pick", "picks": [["most people had", "did most people have"]], "cue": "Not until the 1990s <b>( most people had / did most people have )<\/b> Internet access.", "answer": "did most people have", "note": "Sau <i>Not until<\/i> đầu câu dùng <i>did<\/i> + S + V."}, {"level": 1, "n": 5, "kind": "pick", "picks": [["than", "when"]], "cue": "No sooner had the policy been introduced <b>( than / when )<\/b> traffic fell.", "answer": "than", "note": "Cặp cố định: <i>No sooner … than<\/i>."}, {"level": 1, "n": 6, "kind": "pick", "picks": [["when", "than"]], "cue": "Hardly had the factory closed <b>( when / than )<\/b> unemployment rose.", "answer": "when", "note": "Cặp cố định: <i>Hardly … when<\/i>."}, {"level": 2, "n": 7, "kind": "pick", "picks": [["people will", "will people"]], "cue": "Only when public transport improves <b>( people will / will people )<\/b> leave their cars at home.", "answer": "will people", "note": "Đảo ở mệnh đề chính."}, {"level": 2, "n": 8, "kind": "pick", "picks": [["does public transport improve", "public transport improves"]], "cue": "Only when <b>( does public transport improve / public transport improves )<\/b> will people leave their cars.", "answer": "public transport improves", "note": "Không đảo trong mệnh đề <i>Only when<\/i>."}, {"level": 2, "n": 9, "kind": "pick", "picks": [["children should", "should children"]], "cue": "Under no circumstances <b>( children should / should children )<\/b> be left unsupervised online.", "answer": "should children", "note": "Đảo <i>should<\/i> lên trước chủ ngữ."}, {"level": 2, "n": 10, "kind": "pick", "picks": [["the housing shortage is", "is the housing shortage"]], "cue": "So severe <b>( the housing shortage is / is the housing shortage )<\/b> that many workers live far away.", "answer": "is the housing shortage", "note": "Cấu trúc đúng: <i>So + adj + be + N + that<\/i>."}, {"level": 2, "n": 11, "kind": "pick", "picks": [["the popularity is", "is the popularity"]], "cue": "Such <b>( the popularity is / is the popularity )<\/b> of smartphones that few people can live without them.", "answer": "is the popularity", "note": "Cấu trúc đúng: <i>Such + be + N + that<\/i>."}, {"level": 2, "n": 12, "kind": "pick", "picks": [["it also helps", "also it helps"]], "cue": "Not only does tourism create jobs, but <b>( it also helps / also it helps )<\/b> preserve local crafts.", "answer": "it also helps", "note": "Vế sau: <i>but<\/i> + S + <i>also<\/i> + V."}, {"level": 2, "n": 13, "kind": "pick", "picks": [["attracts", "attracting"]], "cue": "Hosting the Olympics not only consumes resources but also <b>( attracts / attracting )<\/b> tourists.", "answer": "attracts", "note": "Hai vế song song: <i>consumes … attracts<\/i>."}, {"level": 3, "n": 14, "kind": "pick", "picks": [["do consumers realise", "consumers realise"]], "cue": "Little <b>( do consumers realise / consumers realise )<\/b> how much data they share.", "answer": "do consumers realise", "note": "Sau <i>Little<\/i> đầu câu phải đảo <i>do<\/i>."}, {"level": 3, "n": 15, "kind": "pick", "picks": [["have governments acted", "governments have acted"]], "cue": "Seldom <b>( have governments acted / governments have acted )<\/b> so quickly.", "answer": "have governments acted", "note": "Sau <i>Seldom<\/i> phải đảo <i>have<\/i>."}, {"level": 3, "n": 16, "kind": "pick", "picks": [["should violence", "violence should"]], "cue": "In no way <b>( should violence / violence should )<\/b> be tolerated in schools.", "answer": "should violence", "note": "Đảo <i>should<\/i> sau <i>In no way<\/i>."}, {"level": 3, "n": 17, "kind": "pick", "picks": [["do many governments", "many governments do"]], "cue": "Only after a disaster <b>( do many governments / many governments do )<\/b> take action.", "answer": "do many governments", "note": "Đảo ở mệnh đề chính sau <i>Only after<\/i>."}, {"level": 3, "n": 18, "kind": "pick", "picks": [["Do rarely", "Rarely do"]], "cue": "<b>( Do rarely / Rarely do )<\/b> students question online sources.", "answer": "Rarely do", "note": "Trạng từ phủ định đứng đầu, sau đó là trợ động từ."}, {"level": 3, "n": 19, "kind": "pick", "picks": [["the policy reduced", "did the policy reduce"]], "cue": "Not only <b>( the policy reduced / did the policy reduce )<\/b> traffic, but it also raised money.", "answer": "did the policy reduce", "note": "Đảo ngữ thì quá khứ: <i>did<\/i> + S + V nguyên mẫu."}]}], "after": []}], "parts": [], "guide": [], "index": []}</script>
<script type="application/json" id="audio">{}</script>
<script>
(function(){
'use strict';
var D = JSON.parse(document.getElementById('data').textContent);
var STORE = 'wt2-16';
var state = load();
function blank(){ return {draft:{}, sub:{}, choice:{}, seen:{}, sent:{}, dirty:{}, fb:{}}; }
function load(){ try { var s = JSON.parse(localStorage.getItem(STORE)); return s && s.sub ? s : blank(); } catch(e){ return blank(); } }
function save(){ try { localStorage.setItem(STORE, JSON.stringify(state)); } catch(e){} }

var $ = function(s, r){ return (r||document).querySelector(s); };
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function dots(n){ return n ? '<span class="lv" title="Level ' + n + '">' + '●'.repeat(n) + '</span>' : ''; }
function textOf(html){ var t = document.createElement('div'); t.innerHTML = html; return t.textContent; }

/* ---------- recorded audio for the English examples (audio/<id>.mp3, made by make_audio.py) ---------- */
var AUDIO = JSON.parse(document.getElementById('audio').textContent);
var player = new Audio(), playing = null;
function speakBtn(text){
  var id = AUDIO[text];
  if (!id) return '';
  return '<button type="button" class="speak" data-audio="' + id + '" aria-label="Listen: ' + esc(text) + '" title="Listen">🔊</button>';
}
function stopAudio(){ player.pause(); if (playing) playing.classList.remove('on'); playing = null; }
player.addEventListener('ended', stopAudio);
document.addEventListener('click', function(e){
  var b = e.target.closest('[data-audio]'); if (!b) return;
  var again = playing === b;
  stopAudio();
  if (again) return;
  player.src = 'audio/' + b.getAttribute('data-audio') + '.mp3';
  playing = b; b.classList.add('on');
  player.play().catch(stopAudio);
});

/* ---------- progress ---------- */
function ids(u){ var out = []; u.exercises.forEach(function(ex, k){ ex.items.forEach(function(it){ out.push(u.num + '-' + (k + 1) + '-' + it.n); }); }); return out; }
function isDone(id){ return !!(state.sub[id] || state.choice[id] || state.seen[id]); }
var ALL = [].concat.apply([], D.units.map(ids));
function updateProgress(){
  var n = ALL.filter(isDone).length;
  $('#progressText').textContent = 'Done: ' + n + '/' + ALL.length + ' items';
  $('#progressBar').style.width = (100 * n / ALL.length) + '%';
}
$('#reset').addEventListener('click', function(){
  if (!confirm('Clear everything you wrote, submitted and chose in this browser?')) return;
  state = blank(); save(); render();
});

/* ---------- header and tabs ---------- */
// One page per unit; D.nav lists every page (index + units) for the tab bar.
$('#title').textContent = D.cover[0];
$('#cover').innerHTML = D.cover.slice(1).map(function(c, i, a){
  return '<p class="standfirst' + (i === a.length - 1 ? ' small' : '') + '">' + esc(c) + '</p>';
}).join('');
$('#tabs').innerHTML = D.nav.map(function(t){ return '<a href="' + t.href + '"' + (t.current ? ' aria-current="page"' : '') + '>' + esc(t.label) + '</a>'; }).join('');
function unitTitle(u){ return u.num === 'review' ? u.name : 'Unit ' + u.num + ' · ' + u.name; }

function route(){
  return {tab: {unit: D.units[0]}, part: location.hash.replace('#', '') || 'ly-thuyet'};
}
var filter = 0;

/* ---------- index page: all units with progress, then the guide ---------- */
function renderBlocks(list){
  var s = '', card = '', open = false;
  function flush(){ if (open) { card += '</ul>'; open = false; } if (card) s += '<div class="card">' + card + '</div>'; card = ''; }
  list.forEach(function(b){
    if (b.type === 'h1') { flush(); s += '<h2 style="margin-top:28px">' + esc(b.text) + '</h2>'; }
    else if (b.type === 'h') { flush(); card = '<h4>' + b.html + '</h4>'; }
    else if (b.type === 'li') { if (!open) { card += '<ul class="plain">'; open = true; } card += '<li>' + b.html + '</li>'; }
    else if (b.type === 'table') { flush(); s += renderTable(b); }
    else { if (open) { card += '</ul>'; open = false; } card += '<p>' + b.html + '</p>'; }
  });
  flush();
  return s;
}
function renderIndex(){
  var s = '<h2>Units</h2>';
  D.parts.forEach(function(p){
    s += '<p class="part-title">' + esc(p.title) + '</p><div class="boxes">' + p.units.map(function(n){
      var u = D.index.find(function(x){ return x.num === n; }), done = 0;
      try { var st = JSON.parse(localStorage.getItem(u.store)) || {}; done = Object.keys(Object.assign({}, st.sub, st.choice)).length; } catch(e){}
      return '<a class="card" style="text-decoration:none;color:inherit;display:block;margin:0" href="' + u.href + '"><h4 style="color:var(--heading)">' + esc(unitTitle(u)) + '</h4><span class="note">Done: ' + Math.min(done, u.count) + '/' + u.count + '</span></a>';
    }).join('') + '</div>';
  });
  return s + renderBlocks(D.guide);
}

/* ---------- theory ---------- */
function renderTable(b){

  s += '<div class="subnav" role="group" aria-label="Unit sections">' + parts.map(function(p){
    var n = p[0] === 'ly-thuyet' ? '' : (function(){ var k = +p[0].slice(-1), all = u.exercises[k - 1].items.map(function(it){ return u.num + '-' + k + '-' + it.n; }); return ' <small>' + all.filter(isDone).length + '/' + all.length + '</small>'; })();
    return '<a class="chip" style="text-decoration:none" href="#' + p[0] + '" aria-pressed="' + (p[0] === part) + '">' + p[1] + n + '</a>';
  }).join('') + '<span class="filter-label">Level:</span>' +
    [[0, 'All'], [1, '● 5.0-6.0'], [2, '●● 6.0-6.5'], [3, '●●● 7.0-7.5']].map(function(f){
      return '<button type="button" class="chip" data-filter="' + f[0] + '" aria-pressed="' + (filter === f[0]) + '">' + f[1] + '</button>';
    }).join('') + '</div>';
  s += part === 'ly-thuyet' ? renderTheory(u) : renderExercise(u, +part.slice(-1));
  var i = parts.findIndex(function(p){ return p[0] === part; });
  if (i < parts.length - 1) s += '<p style="text-align:right"><a class="btn primary" style="text-decoration:none;display:inline-block" href="#' + parts[i + 1][0] + '">Next: ' + parts[i + 1][1] + ' →</a></p>';
  return s;
}

function render(){
  var r = route();
  document.querySelectorAll('#tabs a').forEach(function(a){
    if (a.getAttribute('href') === '#' + r.tab.id) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
  });
  var m = $('#main');
  if (!D.units.length) { m.innerHTML = renderIndex(); $('.progress-all').style.display = 'none'; return; }
  m.innerHTML = renderUnit(r.tab.unit, r.part);
  updateProgress();
}
function rerenderItem(id){
  var old = document.querySelector('.item[data-id="' + id + '"]'), p = id.split('-');
  var tmp = document.createElement('div');
  var item = findItem(id);
  tmp.innerHTML = renderItem(item, id, D.units.find(function(x){ return String(x.num) === p[0]; }).exercises[+p[1] - 1].items.indexOf(item));
  old.replaceWith(tmp.firstChild);
  updateProgress();
  var chip = document.querySelector('.subnav a[aria-pressed="true"] small');
  if (chip) { var ex = D.units.find(function(x){ return String(x.num) === p[0]; }).exercises[+p[1] - 1];
    chip.textContent = ex.items.filter(function(it){ return isDone(p[0] + '-' + p[1] + '-' + it.n); }).length + '/' + ex.items.length; }
}

/* ---------- events ---------- */
var lastTab = route().tab.id;
window.addEventListener('hashchange', function(){
  render();
  var t = route().tab.id;
  window.scrollTo(0, t === lastTab ? Math.min(window.scrollY, $('nav.tabs').offsetTop) : 0);
  lastTab = t;
});
$('#main').addEventListener('click', function(e){
  var b, id;
  if ((b = e.target.closest('[data-filter]'))) { filter = +b.getAttribute('data-filter'); var y = window.scrollY; render(); window.scrollTo(0, y); return; }
  if ((b = e.target.closest('[data-submit]'))) {
    id = b.getAttribute('data-submit');
    var t = document.getElementById('t-' + id).value.trim(), tt = document.getElementById('t-' + id + '~t');
    if (!t || (tt && !tt.value.trim())) return;
    if (tt) { t = 'Translation: ' + tt.value.trim() + '\nRewrite: ' + t; delete state.draft[id + '~t']; }
    var changed = state.sub[id] !== t;
    state.sub[id] = t; delete state.draft[id]; save(); rerenderItem(id);
    var a = document.getElementById('a-' + id); if (a) a.scrollIntoView({block: 'nearest'});
    var f = (state.fb || {})[id];
    if (!f || f.for !== t || f.kind !== 'ai') assess(findItem(id), id);
    if (changed) afterAnswer(id);
    return;
  }
  if ((b = e.target.closest('[data-choose]'))) {
    id = b.getAttribute('data-choose');
    var r = document.querySelector('input[name="c-' + id + '"]:checked');
    if (!r) return;
    var changedChoice = state.choice[id] !== r.value;
    state.choice[id] = r.value; save(); rerenderItem(id);
    if (changedChoice) afterAnswer(id);
    return;
  }
  if ((b = e.target.closest('[data-send]'))) { sendExercise(b.getAttribute('data-send')); return; }
  if ((b = e.target.closest('[data-see]'))) {
    id = b.getAttribute('data-see');
    if (state.seen[id]) delete state.seen[id]; else state.seen[id] = 1;
    save(); rerenderItem(id);
  }
});
$('#main').addEventListener('change', function(e){
  var t = e.target;
  if (t.matches('input[type="radio"]')) {
    var id = t.name.slice(2), btn = document.querySelector('[data-choose="' + id + '"]');
    if (btn) btn.disabled = false;
  }
});
$('#main').addEventListener('input', function(e){
  var t = e.target;
  if (t.matches('[data-text]')) {
    var id = t.getAttribute('data-text');
    state.draft[id] = t.value; save();
    var base = id.replace(/~t$/, ''), btn = document.querySelector('[data-submit="' + base + '"]');
    var all = [document.getElementById('t-' + base), document.getElementById('t-' + base + '~t')].filter(Boolean);
    if (btn) btn.disabled = !all.every(function(x){ return x.value.trim(); });
  }
});
render();
loadComments();
})();
</script>
</body>
</html>
